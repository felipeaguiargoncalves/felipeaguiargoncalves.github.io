function importarProdutosVetus(onDone){
  const novos=PRODS_XLSX.filter(nx=>!(DATA.produtos||[]).some(p=>p.nome.toLowerCase()===nx.nome.toLowerCase()));
  if(!novos.length){alert("Todos os "+PRODS_XLSX.length+" produtos já existem!");return;}
  const cont=div();
  const info=div({style:{background:"#f0fdf4",border:"2px solid #2DC653",borderRadius:12,padding:"14px",marginBottom:14,fontSize:13,lineHeight:1.6}});
  info.innerHTML=`<b style="color:#2DC653">✅ ${novos.length} produtos novos</b><br><span style="color:#6B7280">${PRODS_XLSX.length-novos.length} já existiam</span>`;
  cont.appendChild(info);
  const prev=div({style:{maxHeight:200,overflowY:"auto",marginBottom:14}});
  novos.slice(0,50).forEach(p=>{const r=div({style:{fontSize:11,padding:"4px 8px",borderBottom:"1px solid #f0f0f0",display:"flex",justifyContent:"space-between"}});r.innerHTML=`<span style="font-weight:600">${p.nome}</span><span style="color:#2DC653;font-weight:700">R$ ${p.preco}</span>`;prev.appendChild(r);});
  if(novos.length>50){const m=div({style:{textAlign:"center",padding:"6px",color:"#8B8FA8",fontSize:11}});m.textContent="... e mais "+(novos.length-50);prev.appendChild(m);}
  cont.appendChild(prev);
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"15px",background:"linear-gradient(135deg,#2DC653,#22c55e)",color:"#fff",fontSize:15,fontWeight:700,borderRadius:14,marginBottom:10},onClick:()=>{
    updSilent(d=>(({...d,produtos:[...(d.produtos||[]),...novos]})));
    DATA=loadData();if(mv)mv.remove();alert("✅ "+novos.length+" produtos importados!");onDone();
  }},"⬇️ Importar "+novos.length+" produtos"));
  cont.appendChild(btn({style:{width:"100%",padding:"13px",background:"#f5f5f5",color:"#666",borderRadius:12},onClick:()=>{if(mv)mv.remove();}},"Cancelar"));
  mv=openModal("Importar Produtos",cont,()=>{});
}
function renderFarmacia(){
  const w=div({className:"screen"});
  w.appendChild(mkHdr("Banco de Produtos",()=>go("home"),
    h("div",{style:{display:"flex",gap:6}},[
      btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"9px 14px",fontSize:13,borderRadius:12},onClick:()=>abrirProdModal(null,build)},"+Novo"),
      btn({style:{background:"linear-gradient(135deg,#2DC653,#22c55e)",color:"#fff",padding:"9px 12px",fontSize:12,borderRadius:12,fontWeight:700},onClick:()=>importarProdutosVetus(build)},"⬇️ Produtos")
    ])
  ));
  const bR=div({style:{padding:"14px 18px 0"}});
  const bI=inp({className:"fi",placeholder:"Buscar produto...",style:{borderRadius:50,border:"2px solid #FF6B9D"}});bR.appendChild(bI);w.appendChild(bR);
  const body=div({style:{padding:"12px 18px 40px"}});w.appendChild(body);
  function build(){
    body.innerHTML="";const q=bI.value.toLowerCase();const lista=(DATA.produtos||[]).filter(p=>q.length<2||p.nome.toLowerCase().includes(q));
    if(lista.length===0){body.innerHTML='<div style="text-align:center;padding:40px 0;color:#8B8FA8;font-weight:700">Nenhum produto</div>';return;}
    lista.slice(0,100).forEach((p,i)=>{
      const c=div({className:"card",style:{padding:"11px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10}});
      const inf=div({style:{flex:1}});inf.innerHTML=`<div style="font-weight:800;color:#1A1A2E;font-size:13px">${p.nome}</div><div style="font-size:11px;color:#8B8FA8">${p.cat}${p.preco?` - <span style="color:#2DC653;font-weight:700">R$ ${p.preco}</span>`:""}</div>`;
      const a=div({style:{display:"flex",gap:5}});
      a.appendChild(btn({style:{background:"#FFF5F9",color:"#FF6B9D",padding:"6px 10px",borderRadius:10,fontSize:11},onClick:()=>abrirProdModal(i,build)},"Edit"));
      a.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"6px 10px",borderRadius:10,fontSize:11},onClick:()=>{updSilent(d=>({...d,produtos:(d.produtos||[]).filter((_,j)=>j!==i)}));DATA=loadData();build();}},"Del"));
      c.appendChild(inf);c.appendChild(a);body.appendChild(c);
    });
  }
  bI.addEventListener("input",build);build();return w;
}
function abrirProdModal(idx,onDone){
  const p=idx!=null?(DATA.produtos||[])[idx]:null;const cont=div();
  const nI=inp({className:"fi",placeholder:"Nome",value:p?.nome||"",style:{marginBottom:12}});
  const cats=["Anti-inflamatorio","Antibiotico","Antiparasitario","Otologico","Dermatologico","Shampoo","Gastrointestinal","Suplemento","Outros"];
  const cS2=sel({className:"fi",style:{marginBottom:12}},cats.map(c=>({v:c,l:c,sel:c===(p?.cat||"Outros")})));
  const prI=inp({className:"fi",placeholder:"0,00",value:p?.preco||"",style:{marginBottom:20}});
  [lbl("Nome"),nI,lbl("Categoria"),cS2,lbl("Preco (R$)"),prI].forEach(el=>cont.appendChild(el));
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"17px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:16,borderRadius:16},onClick:()=>{
    if(!nI.value){alert("Informe o nome!");return;}
    const novo={nome:nI.value,cat:cS2.value,preco:prI.value};
    if(idx!=null)updSilent(d=>({...d,produtos:(d.produtos||[]).map((x,i)=>i===idx?novo:x)}));
    else updSilent(d=>({...d,produtos:[...(d.produtos||[]),novo]}));
    DATA=loadData();if(mv)mv.remove();onDone();
  }},p?"Salvar":"Adicionar"));
  mv=openModal(p?"Editar Produto":"Novo Produto",cont,()=>{});
}

  const body=div({style:{padding:"14px 16px 40px"}});
  w.appendChild(body);

  // ── Helpers de cálculo ───────────────────────────────────────────────────────
  function getAnoMesAtual(){const n=new Date();return{ano:n.getFullYear(),mes:n.getMonth()};}
  const {ano:anoAt,mes:mesAt}=getAnoMesAtual();

  // Receita total por mês (nome do mês → valor)
  function getReceitaPorMes(){
    const mp={};
    MESES.forEach((m,mi)=>{
      let v=0;
      [DATA.cobrancas[m]||{},(DATA.cobrancas2||{})[m]||{}].forEach(cbM=>
        Object.values(cbM).forEach(cb=>{v+=totAts(cb.atendimentos);}));
      mp[m]={faturado:v,mi};
    });
    return mp;
  }

  // Pets mais lucrativos (todos os tempos)
  function getPetsLucro(){
    const mp={};
    MESES.forEach(m=>{
      [DATA.cobrancas[m]||{},(DATA.cobrancas2||{})[m]||{}].forEach(cbM=>
        Object.values(cbM).forEach(cb=>{
          (cb.atendimentos||[]).forEach(at=>{
            (at.caes||[]).forEach(c=>{
              const v=(c.servicos||[]).reduce((s,sv)=>s+(parseFloat(sv.valor)||0),0);
              if(v>0){
                const k=c.nome||"?";
                mp[k]=(mp[k]||0)+v;
              }
            });
          });
        }));
    });
    return Object.entries(mp).sort((a,b)=>b[1]-a[1]).slice(0,10);
  }

  // Clientes mais lucrativos por mês
  function getClientesDoMes(mesNome){
    const mp={};
    [DATA.cobrancas[mesNome]||{},(DATA.cobrancas2||{})[mesNome]||{}].forEach(cbM=>{
      Object.entries(cbM).forEach(([casaNum,cb])=>{
        const v=totAts(cb.atendimentos);
        if(v>0){
          const casaObj=(DATA.casas||{})[casaNum]||(DATA.casas2||{})[casaNum]||{};
          const nome=casaObj.morador||("Casa "+casaNum);
          mp[nome]=(mp[nome]||0)+v;
        }
      });
    });
    return Object.entries(mp).sort((a,b)=>b[1]-a[1]).slice(0,8);
  }

  // Semana atual (últimos 7 dias)
  function getReceitaSemana(){
    const hoje2=new Date();
    let total=0,contPets=0;
    for(let i=0;i<7;i++){
      const d=new Date(hoje2);d.setDate(hoje2.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      (DATA.agenda||[]).filter(a=>a.data===ds&&a.buscado).forEach(ev=>{
        total+=getValorEvento(ev);contPets++;
      });
    }
    return{total,contPets};
  }

  // Totais gerais
  const recMes=getReceitaPorMes();
  const mesNomeAt=MESES[mesAt];
  const mesAnterior=MESES[mesAt>0?mesAt-1:11];
  const faturadoMesAt=recMes[mesNomeAt]?.faturado||0;
  const faturadoMesAnt=recMes[mesAnterior]?.faturado||0;
  const varMes=faturadoMesAnt>0?((faturadoMesAt-faturadoMesAnt)/faturadoMesAnt*100):0;
  const semana=getReceitaSemana();
  const tSaidas=(DATA.saidas||[]).reduce((s,x)=>s+(parseFloat(x.val)||0),0);
  const tVendas=(DATA.vendas||[]).reduce((s,v)=>s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1),0);
  const tAgendaDia=(DATA.agenda||[]).filter(a=>a.data===hoje()).length;

  // ── Seção 1: Cards resumo topo ───────────────────────────────────────────────
  const secTopo=div({style:{marginBottom:18}});
  const cardGrid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}});

  function mkStatCard(emoji,label,valor,sub,corFaixa){
    const c=div({style:{background:"#fff",borderRadius:18,padding:"14px 12px",boxShadow:"0 2px 12px rgba(0,0,0,.07)",borderTop:"4px solid "+corFaixa}});
    c.innerHTML=`<div style="font-size:22px;margin-bottom:2px">${emoji}</div>
      <div style="font-size:18px;font-weight:800;color:#1A1A2E;font-family:'Fredoka One',sans-serif">${valor}</div>
      <div style="font-size:10px;font-weight:700;color:#8B8FA8;text-transform:uppercase;letter-spacing:.6px;margin-top:1px">${label}</div>
      ${sub?`<div style="font-size:10px;color:#aaa;margin-top:3px">${sub}</div>`:""}`;
    return c;
  }

  const fmtR=v=>"R$\u00a0"+v.toFixed(2).replace(".",",");
  const varIcon=varMes>=0?"▲":"▼";
  const varCor=varMes>=0?"#2DC653":"#e53e3e";

  cardGrid.appendChild(mkStatCard("💰","Mês Atual",fmtR(faturadoMesAt),`<span style="color:${varCor};font-weight:800">${varIcon} ${Math.abs(varMes).toFixed(1)}%</span> vs mês ant.`,"#FF6B9D"));
  // Contar banhos
  const agendaMes=(DATA.agenda||[]).filter(a=>a.data&&a.data.startsWith(mesNomeAt.slice(0,3).toLowerCase())||
    (()=>{const d=new Date(a.data);return d.getMonth()===mesAt&&d.getFullYear()===anoAt;})());
  const banhosMes=(DATA.agenda||[]).filter(a=>{if(!a.data||!a.buscado)return false;const d=new Date(a.data);return d.getMonth()===mesAt&&d.getFullYear()===anoAt;}).length;
  const banhosSemana=semana.contPets;
  const mediaSemanal=banhosMes>0?Math.round(banhosMes/4.3):0;

  cardGrid.appendChild(mkStatCard("✂️","Banhos Semana",banhosSemana+" pets","realizados nos últimos 7 dias","#FFD93D"));
  cardGrid.appendChild(mkStatCard("📅","Banhos Mês",banhosMes+" pets","realizados este mês · média "+mediaSemanal+"/sem","#3B82F6"));
  cardGrid.appendChild(mkStatCard("🛍","Vendas",fmtR(tVendas),"total acumulado","#9B59B6"));
  cardGrid.appendChild(mkStatCard("📅","Hoje",tAgendaDia+" agend.","agendamentos do dia","#FF6B9D"));
  secTopo.appendChild(cardGrid);

  // Card saídas vs lucro
  const todosRecebidos=Object.values(recMes).reduce((s,m)=>s+m.faturado,0)+tVendas;
  const lucroLiquido=todosRecebidos-tSaidas;
  const cardLucro=div({style:{background:"linear-gradient(135deg,#1A1A2E,#2d3561)",borderRadius:18,padding:"16px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}});
  cardLucro.innerHTML=`
    <div><div style="color:rgba(255,255,255,.6);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px">Lucro Estimado (Total)</div>
    <div style="font-family:'Fredoka One',sans-serif;font-size:24px;color:#FFD93D;margin-top:2px">${fmtR(lucroLiquido)}</div></div>
    <div style="text-align:right"><div style="color:rgba(255,255,255,.5);font-size:10px">Saídas: <span style="color:#FF6B9D;font-weight:800">${fmtR(tSaidas)}</span></div>
    <div style="color:rgba(255,255,255,.5);font-size:10px;margin-top:3px">Receita total: <span style="color:#2DC653;font-weight:800">${fmtR(todosRecebidos)}</span></div></div>`;
  secTopo.appendChild(cardLucro);
  body.appendChild(secTopo);

  // ── Seção 2: Gráfico de barras por mês ─────────────────────────────────────
  const secGrafico=div({style:{background:"#fff",borderRadius:18,padding:"16px 14px",boxShadow:"0 2px 12px rgba(0,0,0,.06)",marginBottom:18}});
  secGrafico.appendChild(h("p",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:16,color:"#1A1A2E",marginBottom:12}},"📈 Faturamento por Mês"));
  const maxVal=Math.max(...Object.values(recMes).map(m=>m.faturado),1);
  const barsWrap=div({style:{display:"flex",gap:4,alignItems:"flex-end",height:90,overflowX:"auto",paddingBottom:4}});
  MESES.forEach((m,mi)=>{
    const v=recMes[m].faturado;
    const pct=v/maxVal;
    const isAt=mi===mesAt;
    const col=div({style:{display:"flex",flexDirection:"column",alignItems:"center",gap:2,flex:"0 0 auto",width:34,cursor:"pointer"}});
    const bar=div({style:{width:28,borderRadius:"6px 6px 0 0",background:isAt?"#FF6B9D":"#FFE4EF",height:Math.max(pct*80,4)+"px",transition:"height .4s",position:"relative"}});
    if(isAt){const dot=div({style:{position:"absolute",top:-6,left:"50%",transform:"translateX(-50%)",width:8,height:8,borderRadius:4,background:"#FF6B9D"}});bar.appendChild(dot);}
    col.appendChild(bar);
    col.appendChild(h("span",{style:{fontSize:8,fontWeight:800,color:isAt?"#FF6B9D":"#8B8FA8",whiteSpace:"nowrap"}},m.slice(0,3)));
    barsWrap.appendChild(col);
  });
  secGrafico.appendChild(barsWrap);
  body.appendChild(secGrafico);

  // ── Seção 3: Abas interativas ────────────────────────────────────────────────
  let abaAtiva="pets";
  const abaWrap=div({style:{marginBottom:18}});
  const abaTabs=div({style:{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}});
  const abaContent=div();

  const ABAS=[
    {k:"pets",l:"🐾 Top Pets"},
    {k:"clientes",l:"👤 Clientes"},
    {k:"mes",l:"📋 Por Mês"},
    {k:"texto",l:"📋 Relatório"},
  ];

  function buildAbaTabs(){
    abaTabs.innerHTML="";
    ABAS.forEach(ab=>{
      const isA=abaAtiva===ab.k;
      abaTabs.appendChild(btn({style:{flexShrink:0,padding:"8px 14px",fontSize:12,fontWeight:800,background:isA?"#FF6B9D":"#fff",color:isA?"#fff":"#8B8FA8",border:"2px solid "+(isA?"#FF6B9D":"#FFE4EF"),borderRadius:20,whiteSpace:"nowrap"},onClick:()=>{abaAtiva=ab.k;buildAbaTabs();buildAbaContent();}},ab.l));
    });
  }

  let mesSel=mesNomeAt;

  function buildAbaContent(){
    abaContent.innerHTML="";
    if(abaAtiva==="pets"){
      const tops=getPetsLucro();
      if(tops.length===0){abaContent.appendChild(div({style:{textAlign:"center",padding:"20px",color:"#8B8FA8",fontSize:13}},"Sem dados de atendimento ainda"));return;}
      const maxP=tops[0][1];
      tops.forEach(([nome,val],i)=>{
        const row=div({style:{display:"flex",alignItems:"center",gap:10,marginBottom:8,background:"#fff",borderRadius:14,padding:"10px 12px",boxShadow:"0 1px 6px rgba(0,0,0,.05)"}});
        const medal=["🥇","🥈","🥉"][i]||(i+1+".");
        row.innerHTML=`<span style="font-size:18px;flex-shrink:0">${medal}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:13px;color:#1A1A2E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nome}</div>
            <div style="background:#FFE4EF;height:6px;border-radius:3px;margin-top:4px"><div style="background:#FF6B9D;height:6px;border-radius:3px;width:${(val/maxP*100).toFixed(1)}%"></div></div>
          </div>
          <span style="font-weight:800;color:#FF6B9D;font-size:13px;flex-shrink:0">${fmtR(val)}</span>`;
        abaContent.appendChild(row);
      });

    }else if(abaAtiva==="clientes"){
      const selMes=div({style:{marginBottom:12}});
      const mSel=sel({className:"fi",style:{marginBottom:0},onChange:e=>{mesSel=e.target.value;buildAbaContent();}},MESES.map(m=>({v:m,l:m,sel:m===mesSel})));
      selMes.appendChild(lbl("Mês"));selMes.appendChild(mSel);
      abaContent.appendChild(selMes);
      const tops=getClientesDoMes(mesSel);
      if(tops.length===0){abaContent.appendChild(div({style:{textAlign:"center",padding:"20px",color:"#8B8FA8",fontSize:13}},"Nenhuma receita em "+mesSel));return;}
      const maxC=tops[0][1];
      tops.forEach(([nome,val],i)=>{
        const row=div({style:{display:"flex",alignItems:"center",gap:10,marginBottom:8,background:"#fff",borderRadius:14,padding:"10px 12px",boxShadow:"0 1px 6px rgba(0,0,0,.05)"}});
        row.innerHTML=`<span style="font-size:18px;flex-shrink:0">${["🥇","🥈","🥉"][i]||(i+1+".")}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:13px;color:#1A1A2E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nome}</div>
            <div style="background:#E0F2FE;height:6px;border-radius:3px;margin-top:4px"><div style="background:#3B82F6;height:6px;border-radius:3px;width:${(val/maxC*100).toFixed(1)}%"></div></div>
          </div>
          <span style="font-weight:800;color:#3B82F6;font-size:13px;flex-shrink:0">${fmtR(val)}</span>`;
        abaContent.appendChild(row);
      });

    }else if(abaAtiva==="mes"){
      // ── Tabela de meses clicáveis ─────────────────────────────────────────
      const tbl=div({style:{background:"#fff",borderRadius:14,overflow:"hidden",boxShadow:"0 1px 8px rgba(0,0,0,.06)",marginBottom:mesSel?16:0}});
      const hdr2=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",background:"#FF6B9D",padding:"10px 14px"}});
      ["Mês","Faturado","Var."].forEach(t=>hdr2.appendChild(h("span",{style:{fontWeight:800,color:"#fff",fontSize:11,textTransform:"uppercase"}},t)));
      tbl.appendChild(hdr2);
      MESES.forEach((m,mi)=>{
        const v=recMes[m].faturado;
        const vAnt=mi>0?recMes[MESES[mi-1]].faturado:0;
        const varPct=vAnt>0?((v-vAnt)/vAnt*100):0;
        const isAt=mi===mesAt;
        const isSel=mesSel===m;
        const row=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",padding:"9px 14px",borderBottom:"1px solid #FFE4EF",background:isSel?"#FFF0F7":(isAt?"#FFF5F9":"#fff"),cursor:"pointer"},onClick:()=>{mesSel=isSel?null:m;buildAbaContent();}});
        row.appendChild(h("span",{style:{fontWeight:isSel||isAt?800:600,fontSize:12,color:isSel?"#FF6B9D":(isAt?"#FF6B9D":"#1A1A2E")}},m.slice(0,3)+(isAt?" ◀":"")+(isSel?" 🔍":"")));
        row.appendChild(h("span",{style:{fontWeight:700,fontSize:12,color:"#1A1A2E"}},fmtR(v)));
        const vc=varPct>=0?"#2DC653":"#e53e3e";
        row.appendChild(h("span",{style:{fontWeight:700,fontSize:11,color:vAnt===0?"#ccc":vc}},vAnt===0?"—":(varPct>=0?"▲":"▼")+Math.abs(varPct).toFixed(0)+"%"));
        tbl.appendChild(row);
      });
      abaContent.appendChild(tbl);

      // ── Detalhes por semana do mês selecionado ────────────────────────────
      if(mesSel){
        const miSel=MESES.indexOf(mesSel);
        const detWrap=div({style:{background:"#fff",borderRadius:18,padding:"16px",boxShadow:"0 2px 12px rgba(0,0,0,.07)",border:"2px solid #FF6B9D"}});
        detWrap.appendChild(h("p",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:16,color:"#FF6B9D",marginBottom:12}},"📊 "+mesSel+" — por semana"));

        // Coleta atendimentos do mês
        function getAtsDoMes(mesNome){
          const ats=[];
          [DATA.cobrancas[mesNome]||{},(DATA.cobrancas2||{})[mesNome]||{}].forEach(cbM=>{
            Object.entries(cbM).forEach(([casaNum,cb])=>{
              (cb.atendimentos||[]).forEach(at=>{
                const sub=totAts([at]);
                if(sub>0)ats.push({data:at.data,valor:sub,casa:casaNum,pago:!!at.pago,caes:(at.caes||[]).length});
              });
            });
          });
          return ats.sort((a,b)=>a.data.localeCompare(b.data));
        }

        const atsM=getAtsDoMes(mesSel);
        const totalM=atsM.reduce((s,a)=>s+a.valor,0);
        const pagosM=atsM.filter(a=>a.pago).reduce((s,a)=>s+a.valor,0);
        const totalPetsM=atsM.reduce((s,a)=>s+a.caes,0);

        // Resumo do mês
        const resumoMes=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}});
        [{l:"Faturado",v:fmtR(totalM),c:"#FF6B9D"},{l:"Recebido",v:fmtR(pagosM),c:"#2DC653"},{l:"Pets",v:totalPetsM+" banhos",c:"#3B82F6"}].forEach(it=>{
          const c=div({style:{background:it.c+"18",borderRadius:12,padding:"10px 8px",textAlign:"center"}});
          c.innerHTML=`<div style="font-size:10px;font-weight:700;color:${it.c};text-transform:uppercase;letter-spacing:.6px">${it.l}</div><div style="font-weight:800;color:${it.c};font-size:13px;margin-top:3px">${it.v}</div>`;
          resumoMes.appendChild(c);
        });
        detWrap.appendChild(resumoMes);

        // Dividir em semanas (Seg a Dom)
        const ano2=new Date().getFullYear();
        const primDiaMes=new Date(ano2,miSel,1);
        const ultDiaMes=new Date(ano2,miSel+1,0);

        // Agrupa por semana do mês
        function semanaDoMes(dataStr){
          const d=new Date(dataStr+"T12:00:00");
          const dia=d.getDate();
          return Math.ceil(dia/7);
        }

        const semanas={};
        atsM.forEach(at=>{
          const s=semanaDoMes(at.data);
          if(!semanas[s])semanas[s]={valor:0,pago:0,pets:0,dias:new Set()};
          semanas[s].valor+=at.valor;
          if(at.pago)semanas[s].pago+=at.valor;
          semanas[s].pets+=at.caes;
          semanas[s].dias.add(at.data);
        });

        const nSems=Object.keys(semanas).map(Number).sort((a,b)=>a-b);
        if(nSems.length===0){detWrap.appendChild(div({style:{textAlign:"center",padding:"20px",color:"#8B8FA8",fontSize:13}},"Sem atendimentos em "+mesSel));}
        else{
          // encontra semana com maior faturamento
          const melhorSem=nSems.reduce((best,s)=>semanas[s].valor>semanas[best].valor?s:best,nSems[0]);

          nSems.forEach(s=>{
            const sm=semanas[s];
            const isMelhor=s===melhorSem&&sm.valor>0;
            const semRow=div({style:{marginBottom:10,background:isMelhor?"#FFFBEE":"#f8f8f8",borderRadius:14,padding:"10px 12px",border:isMelhor?"2px solid #FFD93D":"1.5px solid #f0f0f0"}});
            const topSem=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}});
            topSem.innerHTML=`<div><span style="font-weight:800;color:#1A1A2E;font-size:13px">Semana ${s}</span>${isMelhor?'<span style="background:#FFD93D;color:#1A1A2E;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:6px">⭐ MELHOR</span>':""}</div><span style="font-weight:800;color:#FF6B9D;font-size:14px">${fmtR(sm.valor)}</span>`;
            semRow.appendChild(topSem);
            // Barra progresso
            const pct=totalM>0?sm.valor/totalM:0;
            const barWrap=div({style:{background:"#FFE4EF",borderRadius:6,height:8,marginBottom:6}});
            barWrap.appendChild(div({style:{background:isMelhor?"#FFD93D":"#FF6B9D",borderRadius:6,height:8,width:(pct*100).toFixed(1)+"%",minWidth:"4px"}}));
            semRow.appendChild(barWrap);
            const info2=div({style:{display:"flex",gap:12,fontSize:11,color:"#8B8FA8",fontWeight:700}});
            info2.innerHTML=`<span>✅ Rec: ${fmtR(sm.pago)}</span><span>🐾 ${sm.pets} pets</span><span>📅 ${sm.dias.size} dia${sm.dias.size>1?"s":""}</span>`;
            semRow.appendChild(info2);
            detWrap.appendChild(semRow);
          });

          // Comparativo entre semanas
          if(nSems.length>=2){
            const compWrap=div({style:{background:"linear-gradient(135deg,#1A1A2E,#2d3561)",borderRadius:14,padding:"12px 14px",marginTop:8}});
            compWrap.appendChild(h("p",{style:{color:"rgba(255,255,255,.7)",fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:.7,marginBottom:8}},"📈 Comparativo"));
            const maxV=Math.max(...nSems.map(s=>semanas[s].valor));
            nSems.forEach(s=>{
              const sm=semanas[s];const pct2=maxV>0?sm.valor/maxV:0;
              const cRow=div({style:{display:"flex",alignItems:"center",gap:8,marginBottom:6}});
              cRow.appendChild(h("span",{style:{color:"rgba(255,255,255,.6)",fontSize:10,fontWeight:700,minWidth:50}},"Sem "+s));
              const barBg=div({style:{flex:1,background:"rgba(255,255,255,.1)",borderRadius:4,height:10}});
              barBg.appendChild(div({style:{background:s===melhorSem?"#FFD93D":"#FF6B9D",borderRadius:4,height:10,width:(pct2*100).toFixed(1)+"%",minWidth:"4px"}}));
              cRow.appendChild(barBg);
              cRow.appendChild(h("span",{style:{color:"#fff",fontSize:10,fontWeight:800,minWidth:60,textAlign:"right"}},fmtR(sm.valor)));
              compWrap.appendChild(cRow);
            });
            detWrap.appendChild(compWrap);
          }
        }
        abaContent.appendChild(detWrap);
      }

    }else if(abaAtiva==="texto"){
      let tR2=0,tP2=0;
      MESES.forEach(m=>{[DATA.cobrancas[m]||{},(DATA.cobrancas2||{})[m]||{}].forEach(cbM=>Object.values(cbM).forEach(cb=>{const v=totAts(cb.atendimentos);tR2+=v;if(cb.pago)tP2+=v;}));});
      const topPets=getPetsLucro().slice(0,5).map(([n,v],i)=>`  ${i+1}. ${n}: R$ ${v.toFixed(2)}`).join("\n")||"  (sem dados)";

function getPetsDoTutor(casaNum){
  const pets=new Set();
  // modelos
  (DATA.modelos?.[casaNum]||[]).forEach(p=>{if(p.nome)pets.add(p.nome);});
  // campo pets da casa
  const casa=(DATA.casas||{})[casaNum]||(DATA.casas2||{})[casaNum]||{};
  (casa.pets||[]).forEach(p=>{if(p.nome)pets.add(p.nome);});
  // cobrancas
  [DATA.cobrancas,DATA.cobrancas2||{}].forEach(src=>{
    MESES.forEach(m=>{
      ((src[m]||{})[casaNum]||{atendimentos:[]}).atendimentos.forEach(at=>{
        (at.caes||[]).forEach(c=>{if(c.nome)pets.add(c.nome);});
      });
    });
  });
  return [...pets];
}

function executarFusao(idManter,idsRemover){
  updSilent(d=>{
    const nd={...d};
    const nc1={...(nd.casas||{})};
    const nc2={...(nd.casas2||{})};
    const allC={...nc1,...nc2};

    const casaManter=allC[idManter]||{};
    const petsManterSet=new Set(getPetsDoTutor(idManter));

    // Mescla modelos
    const modManterArr=[...(nd.modelos?.[idManter]||[])];
    const modNomesSet=new Set(modManterArr.map(p=>p.nome.toLowerCase()));

    // Mescla campo pets
    const petsManterArr=[...(casaManter.pets||[])];
    const petsNomesSet=new Set(petsManterArr.map(p=>p.nome.toLowerCase()));

    idsRemover.forEach(idRem=>{
      const casaRem=allC[idRem]||{};

      // Telefone: usa o que tiver se o manter não tiver
      if(!casaManter.telefone&&casaRem.telefone){
        if(nc1[idManter])nc1[idManter]={...nc1[idManter],telefone:casaRem.telefone};
        if(nc2[idManter])nc2[idManter]={...nc2[idManter],telefone:casaRem.telefone};
      }

      // Mescla modelos (pets de serviço)
      (nd.modelos?.[idRem]||[]).forEach(p=>{
        if(p.nome&&!modNomesSet.has(p.nome.toLowerCase())){
          modManterArr.push(p);modNomesSet.add(p.nome.toLowerCase());
        }
      });

      // Mescla campo pets
      (casaRem.pets||[]).forEach(p=>{
        if(p.nome&&!petsNomesSet.has(p.nome.toLowerCase())){
          petsManterArr.push(p);petsNomesSet.add(p.nome.toLowerCase());
        }
      });

      // Mescla cobrancas: move atendimentos do idRem para idManter
      MESES.forEach(m=>{
        if(nd.cobrancas?.[m]?.[idRem]){
          if(!nd.cobrancas[m][idManter])nd.cobrancas[m][idManter]={atendimentos:[],pago:false};
          const atsRem=nd.cobrancas[m][idRem].atendimentos||[];
          nd.cobrancas[m][idManter].atendimentos=[...(nd.cobrancas[m][idManter].atendimentos||[]),...atsRem];
          delete nd.cobrancas[m][idRem];
        }
        if(nd.cobrancas2?.[m]?.[idRem]){
          if(!nd.cobrancas2[m])nd.cobrancas2[m]={};
          if(!nd.cobrancas2[m][idManter])nd.cobrancas2[m][idManter]={atendimentos:[],pago:false};
          const atsRem2=nd.cobrancas2[m][idRem].atendimentos||[];
          nd.cobrancas2[m][idManter].atendimentos=[...(nd.cobrancas2[m][idManter].atendimentos||[]),...atsRem2];
          delete nd.cobrancas2[m][idRem];
        }
      });

      // Mescla agenda
      nd.agenda=(nd.agenda||[]).map(ev=>ev.casa===idRem?{...ev,casa:idManter}:ev);

      // Remove o duplicado
      delete nc1[idRem];
      delete nc2[idRem];
    });

    // Salva modelos e pets mesclados
    if(!nd.modelos)nd.modelos={};
    nd.modelos[idManter]=modManterArr;
    if(nc1[idManter])nc1[idManter]={...nc1[idManter],pets:petsManterArr};
    if(nc2[idManter])nc2[idManter]={...nc2[idManter],pets:petsManterArr};

    nd.casas=nc1;nd.casas2=nc2;
    return nd;
  });
  DATA=loadData();
}

// ── Calcula vencedor de um jogo (prêmio banho grátis) ─────────────────────────
// Regra: goleador certo = GANHA (desempata por placar exato)
// Se ninguém acertou goleador → quem acertou placar exato ganha
// Se ninguém acertou placar → quem acertou resultado (V/E/D) ganha
function calcularVencedores(jogoId,real,palpites){
  if(!real||real.golM===""||real.golV==="")return[];
  const rm=parseInt(real.golM),rv=parseInt(real.golV);
  const resReal=rm>rv?"M":rm<rv?"V":"E";
  const candidatos=Object.entries(palpites[jogoId]||{}).map(([uid,pal])=>{
    const pm=parseInt(pal.golM),pv=parseInt(pal.golV);
    const acertouGol=pal.jogador&&real.goleador&&pal.jogador===real.goleador;
    const acertouExato=!isNaN(pm)&&!isNaN(pv)&&pm===rm&&pv===rv;
    const resPal=pm>pv?"M":pm<pv?"V":"E";
    const acertouRes=!isNaN(pm)&&!isNaN(pv)&&resPal===resReal;
    return{uid,nome:pal.nome,acertouGol,acertouExato,acertouRes,pal};
  });
  // 1º critério: acertou goleador
  const comGol=candidatos.filter(c=>c.acertouGol);
  if(comGol.length){
    // desempata por placar exato
    const comGolExato=comGol.filter(c=>c.acertouExato);
    return(comGolExato.length?comGolExato:comGol).map(c=>({...c,motivo:c.acertouExato?"⚽🎯 Gol + Placar exato!":"⚽ Acertou o goleador!"}));
  }
  // 2º critério: placar exato
  const exatos=candidatos.filter(c=>c.acertouExato);
  if(exatos.length)return exatos.map(c=>({...c,motivo:"🎯 Placar exato!"}));
  // 3º critério: resultado certo
  const resOk=candidatos.filter(c=>c.acertouRes);
  if(resOk.length)return resOk.map(c=>({...c,motivo:"✅ Resultado certo"}));
  return[];
}

// ── Tab Palpites ──────────────────────────────────────────────────────────────
function renderPalpitesTab(bolao,jogoAtual){
  const wrap=div();
  // Seletor de jogo
  const jogoSel=sel({className:"fi",style:{marginBottom:10,fontWeight:700}},
    BOLAO_JOGOS.map(j=>({v:j.id,l:`${fmtD(j.data)} · ${j.mandante} × ${j.visitante}`,sel:j.id===jogoAtual.id}))
  );
  let jogoId=jogoAtual.id;
  wrap.appendChild(jogoSel);

  // ── Busca igual à agenda: cao (nome) + tutor/tel, lado a lado ──────────────
  const buscaDupla=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}});
  const colNome=div();
  colNome.appendChild(h("span",{style:{fontWeight:700,color:"#15803d",fontSize:10,textTransform:"uppercase",letterSpacing:.8,display:"block",marginBottom:4}},"Nome do tutor"));
  const bNome=inp({className:"fi",placeholder:"Ex: Maria, João...",style:{border:"2px solid #FF6B9D"}});
  colNome.appendChild(bNome);
  const colId=div();
  colId.appendChild(h("span",{style:{fontWeight:700,color:"#15803d",fontSize:10,textTransform:"uppercase",letterSpacing:.8,display:"block",marginBottom:4}},"ID / Telefone"));
  const bId=inp({className:"fi",placeholder:"Ex: 608, 51999...",style:{border:"2px solid #4285F4"}});
  colId.appendChild(bId);
  buscaDupla.appendChild(colNome);buscaDupla.appendChild(colId);
  wrap.appendChild(buscaDupla);

  const listaWrap=div();
  wrap.appendChild(listaWrap);

  // Montar lista de tutores
  const todosTutores=[];
  const adicionados=new Set();
  [[DATA.casas||{},"cad1"],[DATA.casas2||{},"cad2"]].forEach(([casas,cad])=>{
    Object.entries(casas).forEach(([id,c])=>{
      const chave=String(id);
      if(!adicionados.has(chave)&&c.morador){adicionados.add(chave);todosTutores.push({id:chave,nome:c.morador,tel:c.telefone||"",cad});}
    });
  });
  todosTutores.sort((a,b)=>a.nome.localeCompare(b.nome));

  jogoSel.addEventListener("change",()=>{jogoId=jogoSel.value;renderLista();});

  function filtrarTutores(){
    const qNome=bNome.value.trim().toLowerCase();
    const qId=bId.value.trim();
    const qIdDig=qId.replace(/\D/g,"");
    if(!qNome&&!qId)return todosTutores.slice(0,40);
    return todosTutores.filter(t=>{
      const nomeOk=!qNome||t.nome.toLowerCase().includes(qNome);
      const idOk=!qId||(t.id.includes(qId)||(qIdDig&&t.tel.replace(/\D/g,"").includes(qIdDig)));
      return nomeOk&&idOk;
    }).slice(0,60);
  }

  function renderLista(){
    listaWrap.innerHTML="";
    const lista=filtrarTutores();
    if(!lista.length){
      listaWrap.innerHTML=`<div style="text-align:center;padding:20px;color:#8B8FA8;font-size:13px">Nenhum tutor encontrado</div>`;
      return;
    }
    const real=(bolao.placar||{})[jogoId]||{};
    const temPlacar=real.golM!=null&&real.golM!=="";
    const vencedores=temPlacar?calcularVencedores(jogoId,real,bolao.palpites||{}).map(v=>v.uid):[];

    lista.forEach(tutor=>{
      const pal=((bolao.palpites||{})[jogoId]||{})[tutor.id]||{};
      const eVencedor=vencedores.includes(tutor.id);
      const card=div({className:"card",style:{marginBottom:8,overflow:"hidden",border:eVencedor?"2.5px solid #FFD93D":"1.5px solid #f0f0f0"}});

      const cabeca=div({style:{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",cursor:"pointer",
        background:eVencedor?"linear-gradient(135deg,#fef9c3,#fef08a)":pal.golM!=null&&pal.golM!==""?"#f0fdf4":"#fff"},
        onClick:()=>{const b=card.querySelector(".pal-body");b.style.display=b.style.display==="none"?"block":"none";}});

      const nomeShort=tutor.nome.split(" ").slice(0,2).join(" ");
      const iniciais=tutor.nome.split(" ").filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join("");
      const avatarBg=tutor.cad==="cad1"?"linear-gradient(135deg,#FF6B9D,#ffb347)":"linear-gradient(135deg,#9B59B6,#6366F1)";
      const placarStr=(pal.golM!=null&&pal.golM!==""&&pal.golV!=null&&pal.golV!=="")?`${pal.golM}×${pal.golV}`:"";

      cabeca.innerHTML=`
        <div style="width:38px;height:38px;border-radius:19px;background:${avatarBg};display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',sans-serif;font-size:14px;color:#fff;flex-shrink:0;font-weight:900">${iniciais}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:13px;color:#1A1A2E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nomeShort}${eVencedor?" 🏆":""}</div>
          <div style="font-size:10px;color:#8B8FA8">ID ${tutor.id}${tutor.tel?" · "+tutor.tel:""}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px">
          ${placarStr?`<span style="background:#dcfce7;color:#15803d;border-radius:8px;padding:2px 8px;font-weight:900;font-size:13px">${placarStr}</span>`:""}
          ${pal.jogador?`<span style="font-size:10px;color:#3B82F6;font-weight:700">⚽ ${pal.jogador.split(" ")[0]}</span>`:""}
          ${!placarStr&&!pal.jogador?`<span style="font-size:10px;color:#d1d5db">Sem palpite</span>`:""}
        </div>
        <span style="color:#8B8FA8;font-size:16px;margin-left:6px">›</span>`;
      card.appendChild(cabeca);

      // Corpo expandível — NOVO: só goleador (resultado vai junto automático)
      const body2=div({className:"pal-body",style:{display:"none",padding:"14px 14px 16px",borderTop:"1px solid #f0f0f0",background:"#fafafa"}});

      // ── Placar — campos numéricos simples ────────────────────────────────
      body2.appendChild(h("div",{style:{fontWeight:800,fontSize:11,color:"#8B8FA8",textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"Placar do jogo"));
      const palRow=div({style:{display:"flex",alignItems:"center",gap:8,marginBottom:14,justifyContent:"center"}});
      const g1=inp({type:"number",min:"0",max:"20",style:{width:56,padding:"12px 6px",borderRadius:14,border:"2px solid #e5e7eb",textAlign:"center",fontSize:22,fontWeight:900,color:"#1A1A2E"},value:pal.golM||""});
      const g2=inp({type:"number",min:"0",max:"20",style:{width:56,padding:"12px 6px",borderRadius:14,border:"2px solid #e5e7eb",textAlign:"center",fontSize:22,fontWeight:900,color:"#1A1A2E"},value:pal.golV||""});
      const xSpan=h("span",{style:{fontSize:24,fontWeight:900,color:"#8B8FA8",margin:"0 4px"}},"×");
      const jAtual=BOLAO_JOGOS.find(j=>j.id===jogoId)||jogoAtual;
      const fM2=jAtual.mandante==="Brasil"?"🇧🇷":jAtual.mandante==="Escócia"?"🏴󠁧󠁢󠁳󠁣󠁴󠁿":"🌍";

      const mn=h("div",{style:{fontSize:11,fontWeight:700,color:"#1A1A2E",textAlign:"center",flex:1}});mn.innerHTML=`<div style="font-size:20px">${fM2}</div>${jAtual.mandante}`;

      [mn,g1,xSpan,g2,vn].forEach(el=>palRow.appendChild(el));
      body2.appendChild(palRow);

      // ── Goleador — CHIPS horizontais simples, sem cards ────────────────
      body2.appendChild(h("div",{style:{fontWeight:800,fontSize:11,color:"#8B8FA8",textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"Quem vai fazer gol? ⚽"));
      const chipsWrap=div({style:{display:"flex",flexWrap:"wrap",gap:7,marginBottom:14}});
      let jogSelecionado=pal.jogador||"";
      const chipEls={};

      function atualizarChips(){
        Object.entries(chipEls).forEach(([nome,el])=>{
          const sel2=jogSelecionado===nome;
          el.style.background=sel2?"#15803d":"#fff";
          el.style.color=sel2?"#fff":"#1A1A2E";
          el.style.border="2px solid "+(sel2?"#15803d":"#e5e7eb");
          el.style.fontWeight=sel2?"900":"700";
        });
        // chip nenhum
        if(chipEls["__nenhum__"]){

          chipEls["__nenhum__"].style.background=s?"#6b7280":"#fff";
          chipEls["__nenhum__"].style.color=s?"#fff":"#6b7280";
          chipEls["__nenhum__"].style.border="2px solid "+(s?"#6b7280":"#e5e7eb");
        }
      }

      ATACANTES_BR.forEach(j=>{
        const chip=btn({style:{padding:"7px 12px",borderRadius:20,fontSize:12,border:"2px solid #e5e7eb",background:"#fff",color:"#1A1A2E",fontWeight:700,display:"flex",alignItems:"center",gap:5},onClick:()=>{
          jogSelecionado=jogSelecionado===j.n?"":j.n;atualizarChips();
        }});
        chip.innerHTML=`<span style="font-size:14px">${j.emoji}</span><span>${j.n.split(" ")[0]}</span>`;
        chipEls[j.n]=chip;
        chipsWrap.appendChild(chip);

      // Chip "Nenhum"
      const chipNenhum=btn({style:{padding:"7px 12px",borderRadius:20,fontSize:12,border:"2px solid #e5e7eb",background:"#fff",color:"#6b7280",fontWeight:700},onClick:()=>{jogSelecionado="";atualizarChips();}});
      chipNenhum.textContent="❌ Nenhum";
      chipEls["__nenhum__"]=chipNenhum;
      chipsWrap.appendChild(chipNenhum);
      atualizarChips();
      body2.appendChild(chipsWrap);

      // Botão salvar
      const salvarBtn=btn({style:{width:"100%",padding:"13px",background:"linear-gradient(135deg,#15803d,#22c55e)",color:"#fff",fontSize:14,fontWeight:800,borderRadius:13},onClick:()=>{
        const golM=g1.value.trim();const golV=g2.value.trim();
        if(!golM&&!golV&&!jogSelecionado){alert("Preencha o placar ou escolha um goleador!");return;}
        updSilent(d=>{
          if(!d.bolao)d.bolao={palpites:{},placar:{}};
          if(!d.bolao.palpites[jogoId])d.bolao.palpites[jogoId]={};
          d.bolao.palpites[jogoId][tutor.id]={golM,golV,jogador:jogSelecionado,nome:tutor.nome};
          return d;
        });
        DATA=loadData();
        salvarBtn.textContent="✅ Palpite salvo!";
        salvarBtn.style.background="linear-gradient(135deg,#16a34a,#15803d)";
        setTimeout(()=>{body2.style.display="none";renderLista();},700);
      }},"💾 Salvar Palpite");
      body2.appendChild(salvarBtn);
      card.appendChild(body2);
      listaWrap.appendChild(card);
    });

    const qTotal=bNome.value.trim()||bId.value.trim();
    if(!qTotal&&todosTutores.length>40){
      const m=div({style:{textAlign:"center",padding:"10px",color:"#8B8FA8",fontSize:12}});
      m.textContent="Mostrando 40 de "+todosTutores.length+" — use a busca para filtrar";
      listaWrap.appendChild(m);
    }
  }

  let debT=null;
  function onBusca(){clearTimeout(debT);debT=setTimeout(renderLista,260);}
  bNome.addEventListener("input",onBusca);
  bId.addEventListener("input",onBusca);
  renderLista();
  return wrap;
}

  const placarReal=bolao.placar||{};

  // Para cada jogo com resultado, mostra bloco de ganhador(es)
  let temAlgumResultado=false;
  BOLAO_JOGOS.forEach(jogo=>{
    const real=placarReal[jogo.id];
    if(!real||real.golM==null||real.golM==="")return;
    temAlgumResultado=true;
    const vencedores=calcularVencedores(jogo.id,real,palpites);
    const qtPal=Object.keys(palpites[jogo.id]||{}).length;
    const bloco=div({className:"card",style:{marginBottom:14,overflow:"hidden"}});

    // Cabeçalho do jogo
    bloco.innerHTML=`<div style="background:linear-gradient(135deg,#15803d,#166534);padding:10px 14px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-family:'Fredoka One',sans-serif;font-size:14px;color:#fff">${jogo.mandante} × ${jogo.visitante}</div>
        <div style="font-size:10px;color:rgba(255,255,255,.7)">${fmtD(jogo.data)} · ${jogo.local}</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:'Fredoka One',sans-serif;font-size:22px;color:#FFD93D">${real.golM} × ${real.golV}</div>
        ${real.goleador?`<div style="font-size:10px;color:rgba(255,255,255,.8)">⚽ ${real.goleador}</div>`:""}
      </div>
    </div>`;

    const corpo=div({style:{padding:"12px 14px 14px"}});
    if(!vencedores.length){
      corpo.innerHTML=`<div style="text-align:center;padding:12px;color:#8B8FA8;font-size:13px">😔 Ninguém ganhou o banho nesse jogo<br><span style="font-size:11px">${qtPal} palpite(s) recebidos</span></div>`;
    } else {
      const tit=h("div",{style:{fontWeight:800,fontSize:12,color:"#15803d",textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"🏆 GANHADOR(ES) DO BANHO GRÁTIS");
      corpo.appendChild(tit);
      vencedores.forEach((v,i)=>{
        const vCard=div({style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:i===0?"linear-gradient(135deg,#fef9c3,#fef08a)":"#f9fafb",borderRadius:12,marginBottom:6,border:"1.5px solid "+(i===0?"#FFD93D":"#e5e7eb")}});
        const iniciais=v.nome.split(" ").filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join("");
        vCard.innerHTML=`
          <div style="width:40px;height:40px;border-radius:20px;background:linear-gradient(135deg,#FFD93D,#f59e0b);display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',sans-serif;font-size:15px;color:#fff;flex-shrink:0">${i===0?"🏆":iniciais}</div>
          <div style="flex:1">
            <div style="font-weight:800;font-size:14px;color:#1A1A2E">${v.nome.split(" ").slice(0,2).join(" ")}</div>
            <div style="font-size:11px;color:#15803d;font-weight:700">${v.motivo}</div>
            <div style="font-size:10px;color:#8B8FA8">Palpite: ${v.pal.placar||"—"}${v.pal.jogador?" · ⚽ "+v.pal.jogador:""}</div>
          </div>
          <div style="font-size:28px">🐕</div>`;
        corpo.appendChild(vCard);
      });
      const obs=h("div",{style:{fontSize:10,color:"#8B8FA8",textAlign:"center",marginTop:6}});
      obs.textContent=`${qtPal} palpite(s) · Prêmio: banho grátis 🛁`;
      corpo.appendChild(obs);
    }
    bloco.appendChild(corpo);
    wrap.appendChild(bloco);
  });

  if(!temAlgumResultado){
    const em=div({style:{textAlign:"center",padding:"36px 20px",color:"#8B8FA8"}});
    em.innerHTML=`<div style="font-size:40px;margin-bottom:10px">🏆</div><div style="font-weight:800;font-size:14px;color:#1A1A2E;margin-bottom:4px">Aguardando os jogos!</div><div style="font-size:12px">Quando você lançar o resultado na aba Jogos,<br>o ganhador do banho aparece aqui.</div>`;
    wrap.appendChild(em);
    const regras=div({style:{background:"#f0fdf4",border:"1.5px solid #16a34a",borderRadius:14,padding:"14px 16px",marginTop:4}});
    regras.innerHTML=`<div style="font-weight:800;color:#15803d;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px">🏅 Como funciona o prêmio</div>
      <div style="font-size:12px;line-height:2.2;color:#1A1A2E">
        ⚽ <b>Acertou o goleador</b> → <b style="color:#15803d">GANHA o banho</b><br>
        🎯 Empate? Quem também acertou o <b>placar exato</b> leva<br>
        ✅ Se ninguém acertou gol → quem acertou o <b>resultado</b> ganha
      </div>`;
    wrap.appendChild(regras);
  }
  return wrap;
}

// ── Tab Jogos + lançar resultado real ─────────────────────────────────────────
function renderJogosTab(bolao){
  const wrap=div();
  BOLAO_JOGOS.forEach(jogo=>{
    const real=(bolao.placar||{})[jogo.id]||{};
    const qtPal=Object.keys((bolao.palpites||{})[jogo.id]||{}).length;
    const temPlacar=real.golM!=null&&real.golM!=="";
    const isBR=jogo.mandante==="Brasil"||jogo.visitante==="Brasil";
    const card=div({className:"card",style:{marginBottom:14,overflow:"hidden"}});

    const fM=jogo.mandante==="Brasil"?"🇧🇷":jogo.mandante==="Escócia"?"🏴󠁧󠁢󠁳󠁣󠁴󠁿":"🌍";
    const fV=jogo.visitante==="Brasil"?"🇧🇷":jogo.visitante==="Haiti"?"🇭🇹":jogo.visitante==="Marrocos"?"🇲🇦":"🌍";

    const hdr=div({style:{background:isBR?"linear-gradient(135deg,#15803d,#166534)":"linear-gradient(135deg,#1A1A2E,#2d2d4e)",padding:"12px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}});
    hdr.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:20px">${fM}</span>
        <div>
          <div style="font-family:'Fredoka One',sans-serif;font-size:14px;color:#fff">${jogo.mandante} × ${jogo.visitante} <span style="font-size:14px">${fV}</span></div>
          <div style="font-size:10px;color:rgba(255,255,255,.65)">${fmtD(jogo.data)} ${jogo.hora}h · ${jogo.local}</div>
        </div>
      </div>
      <div style="text-align:right">
        ${temPlacar?`<div style="font-family:'Fredoka One',sans-serif;font-size:22px;color:#FFD93D">${real.golM} × ${real.golV}</div>
          ${real.goleador?`<div style="font-size:10px;color:rgba(255,255,255,.8)">⚽ ${real.goleador}</div>`:""}`:
          `<div style="font-size:11px;color:rgba(255,255,255,.5)">Aguardando</div>`}
        <div style="font-size:9px;color:rgba(255,255,255,.4);margin-top:2px">${qtPal} palpite(s)</div>
      </div>`;
    card.appendChild(hdr);

    // Form lançar resultado
    const form=div({style:{padding:"14px 14px 16px"}});
    form.appendChild(h("div",{style:{fontWeight:800,fontSize:11,color:"#8B8FA8",textTransform:"uppercase",letterSpacing:.8,marginBottom:10}},"⚙️ Lançar resultado real"));

    // Placar row
    const row=div({style:{display:"flex",alignItems:"center",gap:8,marginBottom:12,justifyContent:"center"}});
    const gm=inp({type:"number",min:"0",max:"20",style:{width:52,padding:"10px 6px",borderRadius:12,border:"2px solid #e5e7eb",textAlign:"center",fontSize:20,fontWeight:900,color:"#1A1A2E"},value:real.golM||""});
    const gv=inp({type:"number",min:"0",max:"20",style:{width:52,padding:"10px 6px",borderRadius:12,border:"2px solid #e5e7eb",textAlign:"center",fontSize:20,fontWeight:900,color:"#1A1A2E"},value:real.golV||""});
    const xS=h("span",{style:{fontSize:22,fontWeight:900,color:"#8B8FA8",margin:"0 6px"}},"×");
    const mnL=h("div",{style:{fontSize:11,fontWeight:700,textAlign:"center",flex:1}});mnL.innerHTML=`<div style="font-size:20px">${fM}</div>${jogo.mandante}`;
    const vnL=h("div",{style:{fontSize:11,fontWeight:700,textAlign:"center",flex:1}});vnL.innerHTML=`<div style="font-size:20px">${fV}</div>${jogo.visitante}`;
    [mnL,gm,xS,gv,vnL].forEach(el=>row.appendChild(el));
    form.appendChild(row);

    // Goleador real — chips simples (igual ao palpite)
    form.appendChild(h("div",{style:{fontWeight:800,fontSize:11,color:"#8B8FA8",textTransform:"uppercase",letterSpacing:.8,marginBottom:8}},"Quem fez o gol? ⚽"));
    const gChipsWrap=div({style:{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12}});
    let goleadorSel=real.goleador||"";
    const gChipEls={};
    function atualizarGChips(){
      Object.entries(gChipEls).forEach(([nome,el])=>{
        const s=goleadorSel===nome;
        el.style.background=s?"#15803d":"#fff";
        el.style.color=s?"#fff":"#1A1A2E";
        el.style.border="2px solid "+(s?"#15803d":"#e5e7eb");
        el.style.fontWeight=s?"900":"700";
      });
      if(gChipEls["__nenhum__"]){
        const s=goleadorSel==="";
        gChipEls["__nenhum__"].style.background=s?"#6b7280":"#fff";
        gChipEls["__nenhum__"].style.color=s?"#fff":"#6b7280";
        gChipEls["__nenhum__"].style.border="2px solid "+(s?"#6b7280":"#e5e7eb");
      }
    }
    ATACANTES_BR.forEach(j=>{
      const gc=btn({style:{padding:"7px 12px",borderRadius:20,fontSize:12,border:"2px solid #e5e7eb",background:"#fff",color:"#1A1A2E",fontWeight:700,display:"flex",alignItems:"center",gap:5},onClick:()=>{goleadorSel=goleadorSel===j.n?"":j.n;atualizarGChips();}});
      gc.innerHTML=`<span style="font-size:14px">${j.emoji}</span><span>${j.n.split(" ")[0]}</span>`;
      gChipEls[j.n]=gc;gChipsWrap.appendChild(gc);
    });
    const gcNenhum=btn({style:{padding:"7px 12px",borderRadius:20,fontSize:12,border:"2px solid #e5e7eb",background:"#fff",color:"#6b7280",fontWeight:700},onClick:()=>{goleadorSel="";atualizarGChips();}});
    gcNenhum.textContent="❌ Sem gol";
    gChipEls["__nenhum__"]=gcNenhum;gChipsWrap.appendChild(gcNenhum);
    atualizarGChips();
    form.appendChild(gChipsWrap);

    const svBtn=btn({style:{width:"100%",padding:"13px",background:"linear-gradient(135deg,#15803d,#22c55e)",color:"#fff",fontSize:14,fontWeight:800,borderRadius:13},onClick:()=>{
      updSilent(d=>{
        if(!d.bolao)d.bolao={palpites:{},placar:{}};
        d.bolao.placar[jogo.id]={golM:gm.value,golV:gv.value,goleador:goleadorSel};
        return d;
      });
      DATA=loadData();
      svBtn.textContent="✅ Resultado salvo! Ranking atualizado.";
      svBtn.style.background="linear-gradient(135deg,#16a34a,#15803d)";
      setTimeout(()=>{svBtn.textContent="💾 Salvar Resultado";},2000);
    }},"💾 Salvar Resultado");
    form.appendChild(svBtn);
    card.appendChild(form);
    wrap.appendChild(card);
  });
  return wrap;
}

render();
</script>
</body>
</html>
