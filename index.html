<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Planet Dogs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--pk:#FF6B9D;--ac:#FFD93D;--dk:#1A1A2E;--mu:#8B8FA8;--ok:#2DC653;}
.screen{min-height:100vh;padding-top:58px;padding-bottom:80px;}
.btn{cursor:pointer;border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-weight:800;transition:transform .12s;background:transparent;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.96);}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(255,107,157,.13);border:1.5px solid #FFE4EF;}
input,select,textarea{font-family:'Nunito',sans-serif;font-size:14px;}
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#FF6B9D,#FFD93D);padding:6px 8px;display:flex;gap:4px;box-shadow:0 2px 12px rgba(255,107,157,.35);}
.topbtn{flex:1;padding:5px 2px;background:rgba(255,255,255,.28);color:#1A1A2E;font-size:10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;}
.topbtn span{font-size:15px;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-end;}
.modal-box{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:22px 18px 40px;}
.modal-ct{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:0 20px;}
.modal-cd{background:#fff;border-radius:22px;width:100%;padding:26px 20px;max-height:90vh;overflow-y:auto;}
.hdr{background:linear-gradient(135deg,#FF6B9D,#FFD93D);padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(255,107,157,.3);}
.hdr h2{font-family:'Fredoka One',sans-serif;font-size:20px;color:#1A1A2E;flex:1;}
.lb{font-weight:700;color:#8B8FA8;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;display:block;margin-top:4px;}
.fi{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #FFE4EF;font-size:14px;font-weight:600;color:#1A1A2E;outline:none;background:#fff;}
.tog-wrap{width:50px;height:27px;border-radius:14px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;display:inline-block;}
.tog-thumb{position:absolute;top:3px;width:21px;height:21px;border-radius:11px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:left .2s;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:up .2s ease both;}
</style>
</head>

function emptyData(){
  return{casas:{},casas2:{},cobrancas:{},cobrancas2:{},modelos:{},agenda:[],saidas:[],enderecos:{},vendas:[],produtos:JSON.parse(JSON.stringify(PRODS_DEF)),lab:{maquina:"",insumos:[],exames:[],valorExame:"60"},gruposWA:{0:"",1:"",2:"",3:"",4:"",5:"",6:""},gruposWAPag:{0:"",1:"",2:"",3:"",4:"",5:"",6:""}};

function loadData(){
  try{const d=localStorage.getItem(KEY);if(d){const p=JSON.parse(d);
    if(!p.produtos||p.produtos.length<3)p.produtos=JSON.parse(JSON.stringify(PRODS_DEF));
    if(!p.lab)p.lab={maquina:"",insumos:[],exames:[],valorExame:"60"};
    if(!p.gruposWA)p.gruposWA={0:"",1:"",2:"",3:"",4:"",5:"",6:""};if(!p.gruposWAPag)p.gruposWAPag={0:"",1:"",2:"",3:"",4:"",5:"",6:""};
    if(!p.casas2)p.casas2={};if(!p.cobrancas2)p.cobrancas2={};
    return p;}}catch(e){}
  return emptyData();
}
function saveData(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
let DATA=loadData();
function updSilent(fn){DATA=fn(JSON.parse(JSON.stringify(DATA)));saveData(DATA);}
function upd(fn){DATA=fn(JSON.parse(JSON.stringify(DATA)));saveData(DATA);render();}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function h(tag,attrs,children){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else el.setAttribute(k,v);
  }
  for(const c of(children||[])){
    if(c==null||c===false)continue;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  }
  return el;
}
const div=(a,c)=>h("div",a,c);
const btn=(a,c)=>{const e=h("button",a,c);e.classList.add("btn");return e;};
const inp=a=>h("input",a);
function sel(attrs,opts){
  const el=h("select",attrs);
  opts.forEach(o=>{const op=h("option",{value:o.v!==undefined?o.v:o.l});op.textContent=o.l;if(o.sel)op.selected=true;el.appendChild(op);});
  return el;
}
const lbl=t=>h("span",{className:"lb"},t);
function tog(val,onChange){
  const w=div({className:"tog-wrap",style:{background:val?"#2DC653":"#FFE4EF"},onClick:()=>onChange(!val)});
  w.appendChild(div({className:"tog-thumb",style:{left:val?"25px":"3px"}}));
  return w;
}
function mkHdr(title,onBack,extra){
  return div({className:"hdr"},[
    onBack&&btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"10px 13px",borderRadius:12,fontSize:17},onClick:onBack},"←"),
    h("h2",{},title),
    extra
  ].filter(Boolean));
}
function openModal(title,content,onClose,center){
  const ov=div({className:center?"modal-ct":"modal-ov"});
  const box=div({className:center?"modal-cd":"modal-box"});
  const top=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}});
  top.appendChild(h("h3",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:20,color:"#FF6B9D"}},title));
  top.appendChild(btn({style:{background:"#f0f0f0",color:"#1A1A2E",padding:"8px 14px",borderRadius:11,fontSize:16,minWidth:44,minHeight:44},onClick:()=>{ov.remove();if(onClose)onClose();}},"✕"));
  box.appendChild(top);
  (Array.isArray(content)?content:[content]).forEach(c=>{if(c)box.appendChild(c);});
  ov.appendChild(box);
  document.body.appendChild(ov);
  return ov;
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
let NAV={s:IS_GERENTE?"agenda_gerente":"home"};
function go(s,extra){
  // Gerente só pode ir para agenda_gerente
  if(IS_GERENTE&&s!=="agenda_gerente")return;
  NAV={s,...(extra||{})};render();
}

function renderTopbar(){
  const tb=document.getElementById("topbar");tb.innerHTML="";
  [{k:"cad1",l:"Cad.1",i:"📁"},{k:"cad2",l:"Cad.2",i:"📂"},{k:"agenda",l:"Agenda",i:"📅"},{k:"saidas",l:"Saidas",i:"💸"},{k:"vendas",l:"Vendas",i:"🛍"},{k:"home",l:"Home",i:"🏠"}].forEach(b=>{
    tb.appendChild(h("button",{className:"topbtn",onClick:()=>go(b.k)},[h("span",{},b.i),b.l]));
  });
}
function renderTopbarGerente(){
  const tb=document.getElementById("topbar");tb.innerHTML="";
  const logo=div({style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8}});
  logo.innerHTML='<span style="font-size:18px">🐕</span><span style="font-family:\'Fredoka One\',sans-serif;font-size:17px;color:#1A1A2E;letter-spacing:1px">PLANET DOGS</span>';
  tb.appendChild(logo);
}

function render(){
  if(IS_GERENTE){renderTopbarGerente();const app=document.getElementById("app");app.innerHTML="";app.appendChild(renderAgenda(true));return;}
  if(NAV.s==="agenda_gerente")renderTopbarGerente();

  const screens={
    home:renderHome,

    cad1_casa:()=>renderCadCasa("Cadastro 1","cad1"),cad2_casa:()=>renderCadCasa("Cadastro 2","cad2"),
    cad1_meses:()=>renderMeses("cad1"),cad2_meses:()=>renderMeses("cad2"),
    cad1_grade:()=>renderGrade("Cadastro 1","cad1",NAV.mes),cad2_grade:()=>renderGrade("Cadastro 2","cad2",NAV.mes),
    cad1_det:()=>renderDet("cad1",NAV.mes,NAV.num),cad2_det:()=>renderDet("cad2",NAV.mes,NAV.num),
    cad1_fin:()=>renderFin("Cadastro 1",DATA.casas,DATA.cobrancas,"cad1"),
    cad2_fin:()=>renderFin("Cadastro 2",DATA.casas2||{},DATA.cobrancas2||{},"cad2"),

// ── UTILS ─────────────────────────────────────────────────────────────────────
const hoje=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{if(!d)return"--";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;};
const addD=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const mapsUrl=e=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e+", Porto Alegre RS");
const totAts=ats=>(ats||[]).reduce((s,a)=>s+(a.caes||[]).reduce((ss,c)=>ss+(c.servicos||[]).reduce((sss,sv)=>sss+(parseFloat(sv.valor)||0),0),0),0);

function getValorPetFromCobs(casaNum,petNome){
  let melhorData="",melhorValor=0;
  [DATA.cobrancas,DATA.cobrancas2||{}].forEach(cSrc=>{
    MESES.forEach(m=>{
      ((cSrc[m]||{})[casaNum]||{atendimentos:[]}).atendimentos.forEach(at=>{
        (at.caes||[]).forEach(cao=>{
          if(cao.nome===petNome){
            const val=(cao.servicos||[]).reduce((s,sv)=>s+(parseFloat(sv.valor)||0),0);
            if(val>0&&at.data>melhorData){melhorData=at.data;melhorValor=val;}
          }
        });
      });
    });
  });
  return melhorValor;
}
function getValorEvento(ev){
  if(ev.valorCustom&&parseFloat(ev.valorCustom)>0)return parseFloat(ev.valorCustom);
  return getValorPetFromCobs(ev.casa,ev.pet);
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function renderHome(){
  const w=div({className:"screen"});
  w.appendChild(div({style:{background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",padding:"24px",textAlign:"center"}},[

// ── CADASTRAR CASA ────────────────────────────────────────────────────────────
function getProxId(casas){
  // Gera próximo ID a partir de 15000 para novos clientes manuais
  const nums=Object.keys(casas).map(Number);
  let next=15000;
  while(nums.includes(next))next++;
  return next;
}
function abrirCadastroPetModal(casaNum,pref,onDone){
  const cont=div();
  const infoD=div({style:{background:"#EFF6FF",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:13,fontWeight:700,color:"#3B82F6"}});
  infoD.textContent="Tutor salvo! Agora cadastre o(s) pet(s) desta casa.";
  cont.appendChild(infoD);

  // ── Coleta raças já cadastradas no banco (modelos + atendimentos) ─────────────
  function getRacasConhecidas(){
    const racas=new Set();
    // dos modelos
    Object.values(DATA.modelos||{}).forEach(lista=>{
      (lista||[]).forEach(p=>{if(p.raca&&p.raca.trim())racas.add(p.raca.trim());});
    });
    // dos atendimentos (cobrancas + cobrancas2)
    [DATA.cobrancas,DATA.cobrancas2||{}].forEach(src=>{
      Object.values(src||{}).forEach(cbMes=>{
        Object.values(cbMes||{}).forEach(cb=>{
          (cb.atendimentos||[]).forEach(at=>{
            (at.caes||[]).forEach(c=>{if(c.raca&&c.raca.trim())racas.add(c.raca.trim());});
          });
        });
      });
    });
    // das casas (campo pets)
    [...Object.values(DATA.casas||{}),...Object.values(DATA.casas2||{})].forEach(casa=>{
      (casa.pets||[]).forEach(p=>{if(p.raca&&p.raca.trim())racas.add(p.raca.trim());});
    });
    return [...racas].sort((a,b)=>a.localeCompare(b));
  }

  // datalist compartilhado entre todos os campos de raça
  const dlId="raca-dl-"+Date.now();
  const dl=h("datalist",{id:dlId});
  getRacasConhecidas().forEach(r=>{const op=document.createElement("option");op.value=r;dl.appendChild(op);});
  cont.appendChild(dl);

  let pets=[{nome:"",raca:""}];
  const petsWrap=div();
  function buildPets(){
    petsWrap.innerHTML="";
    pets.forEach((p,i)=>{
      const pb=div({style:{background:"#FFF5F9",borderRadius:14,padding:14,marginBottom:10,border:"1.5px solid #FFE4EF"}});
      const tRow=div({style:{display:"flex",justifyContent:"space-between",marginBottom:8,alignItems:"center"}});
      tRow.appendChild(h("span",{style:{fontWeight:800,fontSize:14,color:"#FF6B9D"}},"🐶 Pet "+(i+1)));
      if(pets.length>1)tRow.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"4px 10px",borderRadius:10,fontSize:12},onClick:()=>{pets.splice(i,1);buildPets();}},"Remover"));
      pb.appendChild(tRow);
      pb.appendChild(lbl("Nome do Pet"));
      const nI=inp({className:"fi",placeholder:"Ex: Rex",value:p.nome,style:{marginBottom:10}});
      nI.addEventListener("input",()=>pets[i].nome=nI.value);
      pb.appendChild(nI);
      pb.appendChild(lbl("Raça"));
      // input com datalist para autocomplete dinâmico
      const rI=inp({className:"fi",placeholder:"Digite ou escolha...",value:p.raca,style:{marginBottom:4}});
      rI.setAttribute("list",dlId);

}

function importarClientesVetus(onDone){
  const casas2={...(DATA.casas2||{})};
  const telMap={};const nomeMap={};
  Object.values(casas2).forEach(c=>{
    const t=(c.telefone||"").replace(/\D/g,"");
    if(t.length>=8){telMap[t]=c;if(t.length>8)telMap[t.slice(-9)]=c;telMap[t.slice(-8)]=c;}
    if(c.morador)nomeMap[c.morador.toLowerCase().trim()]=c;
  });
  const novos=[];const atualizados=[];
  VETUS_CLIENTES.forEach(cli=>{
    const td=(cli.telefone||"").replace(/\D/g,"");
    const nk=(cli.nome||"").toLowerCase().trim();
    let ex=null;
    if(td.length>=8)ex=telMap[td]||telMap[td.slice(-9)]||telMap[td.slice(-8)];
    if(!ex)ex=nomeMap[nk];
    if(ex)atualizados.push({casa:ex,cli});
    else novos.push(cli);
  });
  const semId=VETUS_SEM_ID.filter(item=>!nomeMap[(item.nome||"").toLowerCase().trim()]);
  const totalN=novos.length+semId.length;
  const cont=div();
  const info=div({style:{background:"#f0fdf4",border:"2px solid #2DC653",borderRadius:12,padding:"14px",marginBottom:14,fontSize:13,lineHeight:1.7}});
  info.innerHTML=
    `<b style="color:#2DC653">✅ ${novos.length} novos</b> com ID Vetus + telefone<br>`+
    (semId.length?`<b style="color:#FFD93D">⚠️ ${semId.length} novos</b> sem ID Vetus<br>`:"")+
    (atualizados.length?`<b style="color:#3B82F6">📝 ${atualizados.length} existentes</b> tel atualizado<br>`:"")+
    `<span style="color:#6B7280;font-size:12px">ID Vetus preservado. Match por telefone ou nome.</span>`;
  cont.appendChild(info);
  const prev=div({style:{maxHeight:190,overflowY:"auto",marginBottom:14,border:"1px solid #f0f0f0",borderRadius:10,padding:"6px"}});
  novos.slice(0,20).forEach(cli=>{
    const r=div({style:{fontSize:11,padding:"4px 8px",borderBottom:"1px solid #f8f8f8",display:"flex",gap:8}});
    r.innerHTML=`<span style="color:#8B8FA8;min-width:40px">#${cli.id}</span><span style="font-weight:700">${cli.nome}</span><span style="color:#8B8FA8">${cli.telefone||""}</span>`;
    prev.appendChild(r);
  });
  if(totalN>20){const m=div({style:{textAlign:"center",padding:"6px",color:"#8B8FA8",fontSize:11}});m.textContent="... e mais "+(totalN-20);prev.appendChild(m);}
  cont.appendChild(prev);
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"15px",background:"linear-gradient(135deg,#3B82F6,#60a5fa)",color:"#fff",fontSize:15,fontWeight:700,borderRadius:14,marginBottom:10},onClick:()=>{
    const nc={...(DATA.casas2||{})};
    novos.forEach(cli=>{nc[cli.id]={numero:cli.id,morador:cli.nome,telefone:cli.telefone};}); 
    let nid=getProxId(nc);
    semId.forEach(item=>{nc[nid]={numero:nid,morador:item.nome,telefone:""};nid++;});
    atualizados.forEach(({casa,cli})=>{nc[casa.numero]={...nc[casa.numero],telefone:cli.telefone||nc[casa.numero].telefone};});
    updSilent(d=>(({...d,casas2:nc})));
    DATA=loadData();if(mv)mv.remove();
    alert("✅ "+novos.length+" novos com ID Vetus\n⚠️ "+semId.length+" sem ID Vetus\n📝 "+atualizados.length+" atualizados");
    onDone();
  }},"👤 Importar "+totalN+" clientes"));
  cont.appendChild(btn({style:{width:"100%",padding:"13px",background:"#f5f5f5",color:"#666",borderRadius:12},onClick:()=>{if(mv)mv.remove();}},"Cancelar"));
  mv=openModal("Importar Clientes do Vetus",cont,()=>{});
}

function importarPetsVetus(onDone){
  const casas2={...(DATA.casas2||{})};
  const idMap={};
  Object.values(casas2).forEach(c=>{if(c.numero)idMap[String(c.numero)]=c;});
  const updates=[];let totalPets=0;
  VETUS_CLIENTES.forEach(cli=>{
    const casa=idMap[String(cli.id)];if(!casa)return;
    const vetPets=(VETUS_PETS[String(cli.id)])||[];if(!vetPets.length)return;
    const petsAtuais=casa.pets||[];
    const nomesAtuais=new Set(petsAtuais.map(p=>p.nome.toLowerCase()));
    const petsNovos=vetPets
      .filter(p=>p.nome&&!nomesAtuais.has(p.nome.toLowerCase()))
      .map(p=>{return {
        nome:p.nome,raca:p.raca,sexo:p.sexo,nasc:p.nasc,peso:p.peso,
        valorRef:p.ultimo_valor>0?p.ultimo_valor:0,
        servicoRef:p.ultimo_servico,ultimaData:p.ultima_data
      };});
    if(petsNovos.length){updates.push({numero:casa.numero,petsNovos,petsAtuais});totalPets+=petsNovos.length;}
  });
  if(!totalPets){alert("Nenhum pet novo encontrado.\nImporte os clientes primeiro com o botão 👤 Clientes.");return;}
  const cont=div();

  cont.appendChild(info);
  const prev=div({style:{maxHeight:240,overflowY:"auto",marginBottom:14,border:"1px solid #f0f0f0",borderRadius:10,padding:"6px"}});
  let shown=0;
  updates.forEach(({numero,petsNovos})=>{
    if(shown>=40)return;
    const casa=(DATA.casas2||{})[numero];
    const tutor=casa?casa.morador.split(" ")[0]:"?";
    petsNovos.slice(0,3).forEach(p=>{
      if(shown>=40)return;

      const val=p.valorRef>0?`<b style="color:#2DC653">R$ ${p.valorRef.toFixed(2)}</b>`:`<span style="color:#ccc">s/val</span>`;
      r.innerHTML=`<span style="color:#8B8FA8;font-size:10px;min-width:45px">${tutor}</span><span style="font-weight:700;flex:1">${p.nome}</span><span style="color:#8B8FA8;font-size:10px;flex:1">${p.raca}</span>${val}`;
      prev.appendChild(r);shown++;
    });
  });
  if(totalPets>40){const m=div({style:{textAlign:"center",padding:"6px",color:"#8B8FA8",fontSize:11}});m.textContent="... e mais "+(totalPets-shown)+" pets";prev.appendChild(m);}
  cont.appendChild(prev);
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"15px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:15,fontWeight:700,borderRadius:14,marginBottom:10},onClick:()=>{
    const nc={...(DATA.casas2||{})};
    updates.forEach(({numero,petsNovos,petsAtuais})=>{nc[numero]={...nc[numero],pets:[...petsAtuais,...petsNovos]};});
    updSilent(d=>(({...d,casas2:nc})));
    DATA=loadData();if(mv)mv.remove();
    alert("✅ "+totalPets+" pets importados em "+updates.length+" tutores!");
    onDone();
  }},"🐾 Importar "+totalPets+" pets"));
  cont.appendChild(btn({style:{width:"100%",padding:"13px",background:"#f5f5f5",color:"#666",borderRadius:12},onClick:()=>{if(mv)mv.remove();}},"Cancelar"));

}

      cb.appendChild(sT);
      cao.servicos.forEach((sv,si)=>{
        const sr=div({style:{display:"flex",gap:7,marginBottom:7,alignItems:"center"}});
        const sN=sel({style:{flex:2,padding:"12px 8px",borderRadius:12,border:"1.5px solid #FFE4EF",fontFamily:"Nunito,sans-serif",fontWeight:600},onChange:e=>caes[ci].servicos[si].nome=e.target.value},SERVICOS.map(s=>({v:s,l:s,sel:s===sv.nome})));
        const vI=inp({className:"fi",type:"number",placeholder:"0",value:sv.valor,style:{flex:1}});vI.addEventListener("input",()=>caes[ci].servicos[si].valor=vI.value);
        sr.appendChild(sN);sr.appendChild(vI);
        if(cao.servicos.length>1)sr.appendChild(btn({style:{background:"#ffe5e5",color:"#e53e3e",padding:"9px 11px",borderRadius:10},onClick:()=>{caes[ci].servicos.splice(si,1);buildForm();}},"X"));

      });
      const sub=cao.servicos.reduce((s,sv)=>s+(parseFloat(sv.valor)||0),0);

    const tot=caes.reduce((s,c)=>s+(c.servicos||[]).reduce((ss,sv)=>ss+(parseFloat(sv.valor)||0),0),0);
    const tR=div({style:{background:"#FFF5F9",borderRadius:12,padding:"11px 16px",marginBottom:14,display:"flex",justifyContent:"space-between",fontWeight:800,fontSize:16}});
    tR.innerHTML=`<span style="color:#8B8FA8">Total</span><span style="color:#FF6B9D">R$ ${tot.toFixed(2)}</span>`;
    cont.appendChild(tR);
    cont.appendChild(btn({style:{width:"100%",padding:"16px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:16,borderRadius:16},onClick:()=>{
      if(!dataVal)return;
      const cob2=getCob();let novas;
      if(atEdit)novas=(cob2.atendimentos||[]).map(a=>a.id===atEdit.id?{...a,data:dataVal,caes:JSON.parse(JSON.stringify(caes))}:a);
      else novas=[...(cob2.atendimentos||[]),{id:Date.now(),data:dataVal,caes:JSON.parse(JSON.stringify(caes)),pago:false}];
      novas.sort((a,b)=>a.data.localeCompare(b.data));
      saveCob(mes,numero,{...cob2,atendimentos:novas});
      updSilent(d=>({...d,modelos:{...d.modelos,[numero]:JSON.parse(JSON.stringify(caes))}}));
      if(mv)mv.remove();onDone();
    }},"Salvar Banho"));
  }
  buildForm();
  mv=openModal(atEdit?"Editar Banho":"Novo Banho",cont,()=>{});
}

// ── FINANCEIRO ────────────────────────────────────────────────────────────────
function renderFin(titulo,casas,cobs,pref){

// ── AGENDA ────────────────────────────────────────────────────────────────────
function renderAgenda(gerente){
  const w=div({className:"screen"});
  const gwa=DATA.gruposWA||{};
  const grpBtn=btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"8px 12px",fontSize:12,borderRadius:10},onClick:()=>abrirGruposModal()},"📲 Grupos");
  if(gerente)w.appendChild(mkHdr("Agenda — Banho e Tosa",null,grpBtn));
  else w.appendChild(mkHdr("Agenda",()=>go("home"),grpBtn));

  let ano=new Date().getFullYear(),mes=new Date().getMonth();
  let diaSel=hoje();
  let filtroStatus="todos";

  // ── Container principal (sem padding-bottom no wrapper, adicionamos abaixo)
  const calWrap=div({style:{padding:"0 14px 120px"}});
  w.appendChild(calWrap);

  // ── Seção calendário (cabeçalho fixo)
  const calSection=div();
  calWrap.appendChild(calSection);

  // ── Seção de eventos (rola até aqui ao clicar no dia)
  const evSection=div({id:"ev-section"});
  calWrap.appendChild(evSection);

  function buildCal(){
    calSection.innerHTML="";

    // Navegação mês
    const navRow=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 4px 8px"}});
    navRow.appendChild(btn({style:{background:"#FF6B9D",color:"#fff",padding:"8px 16px",borderRadius:12,fontSize:18},onClick:()=>{mes--;if(mes<0){mes=11;ano--;}buildCal();}},"‹"));
    navRow.appendChild(h("span",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:20,color:"#1A1A2E"}},MESES[mes]+" "+ano));
    navRow.appendChild(btn({style:{background:"#FF6B9D",color:"#fff",padding:"8px 16px",borderRadius:12,fontSize:18},onClick:()=>{mes++;if(mes>11){mes=0;ano++;}buildCal();}},"›"));
    calSection.appendChild(navRow);

    // Cabeçalho dias semana
    const wd=div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}});
    DIAS_SEM.forEach(d=>{wd.appendChild(div({style:{textAlign:"center",fontSize:11,fontWeight:800,color:"#8B8FA8",padding:"4px 0"}},d));});
    calSection.appendChild(wd);

    // Grade dias
    const primDia=new Date(ano,mes,1).getDay();
    const diasMes=new Date(ano,mes+1,0).getDate();
    const grid2=div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:10}});
    for(let i=0;i<primDia;i++)grid2.appendChild(div({}));
    for(let d=1;d<=diasMes;d++){
      const ds=ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const isH=ds===hoje(),isS=ds===diaSel;
      const evs=(DATA.agenda||[]).filter(a=>a.data===ds);
      const nb=evs.some(e=>!e.buscado);
      const c=btn({style:{padding:"8px 4px",borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:isS?"#FF6B9D":(isH?"#FFF5F9":"#fff"),border:"2px solid "+(isS?"#FF6B9D":(isH?"#FFD93D":"#FFE4EF")),color:isS?"#fff":"#1A1A2E"},onClick:()=>{
        diaSel=ds;
        // Se o mês clicado é diferente do exibido, ajusta
        const dObj=new Date(ds+"T12:00:00");
        ano=dObj.getFullYear();mes=dObj.getMonth();
        buildCal();
        // Rola até a seção de eventos SEM recriar a tela
        setTimeout(()=>{evSection.scrollIntoView({behavior:"smooth",block:"start"});},80);
      }});
      c.appendChild(h("span",{style:{fontWeight:800,fontSize:14}},String(d)));
      if(evs.length>0)c.appendChild(div({style:{width:6,height:6,borderRadius:3,background:isS?"rgba(255,255,255,.8)":(nb?"#FFD93D":"#2DC653")}}));
      grid2.appendChild(c);
    }
    calSection.appendChild(grid2);

    // Botão Hoje
    calSection.appendChild(btn({style:{width:"100%",padding:"11px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:13,borderRadius:12,marginBottom:4},onClick:()=>{
      diaSel=hoje();ano=new Date().getFullYear();mes=new Date().getMonth();
      buildCal();
      setTimeout(()=>{evSection.scrollIntoView({behavior:"smooth",block:"start"});},80);
    }},"Hoje — "+fmtD(hoje())));

    // Sempre rebuid eventos ao mudar mês/dia
    buildEvs();
  }

  function buildEvs(){
    evSection.innerHTML="";

    // Cabeçalho dia selecionado
    const dSelObj=new Date(diaSel+"T12:00:00");
    const diaSemanaNome=DIAS_FULL[dSelObj.getDay()];
    const isHoje=diaSel===hoje();
    const dayHdr=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,borderTop:"2px solid #FFE4EF",paddingTop:12,marginTop:4,gap:8}});
    const dayInfo=div({style:{display:"flex",flexDirection:"column",gap:2}});
    dayInfo.appendChild(h("span",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:19,color:"#1A1A2E",lineHeight:1.1}},fmtD(diaSel)));
    dayInfo.appendChild(h("span",{style:{fontSize:11,fontWeight:800,color:isHoje?"#FF6B9D":"#8B8FA8",textTransform:"uppercase",letterSpacing:.8}},isHoje?"📅 Hoje - "+diaSemanaNome:diaSemanaNome));
    dayHdr.appendChild(dayInfo);
    const agBtn=btn({style:{background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",padding:"11px 18px",fontSize:14,borderRadius:14,fontWeight:800,display:"flex",alignItems:"center",gap:6,flexShrink:0,boxShadow:"0 2px 10px rgba(255,107,157,.35)"},onClick:()=>abrirAgModal(diaSel,buildEvs,getAllPets,gerente)});
    agBtn.innerHTML='<span style="font-size:16px">+</span> Agendar';
    dayHdr.appendChild(agBtn);
    evSection.appendChild(dayHdr);

    // Filtros
    const filtros=div({style:{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:4}});
    [{k:"todos",l:"Todos",e:"📋"},{k:"pendente",l:"Pendente",e:"🟡"},{k:"servico",l:"Em Servico",e:"🔵"},{k:"finalizado",l:"Finalizado",e:"🟢"}].forEach(f=>{
      const isA=filtroStatus===f.k;
      filtros.appendChild(btn({style:{flexShrink:0,padding:"8px 13px",fontSize:12,fontWeight:800,background:isA?"#FF6B9D":"#fff",color:isA?"#fff":"#1A1A2E",border:"1.5px solid "+(isA?"#FF6B9D":"#FFE4EF"),borderRadius:20,whiteSpace:"nowrap"},onClick:()=>{filtroStatus=f.k;buildEvs();}},f.e+" "+f.l));
    });
    evSection.appendChild(filtros);

    // Lista eventos
    const evsDia=(DATA.agenda||[]).filter(a=>a.data===diaSel);
    if(evsDia.length===0){
      evSection.appendChild(div({style:{textAlign:"center",padding:"20px 0",color:"#8B8FA8",fontSize:13}},"Nenhum agendamento neste dia"));
      return;
    }
    const grupos=[];const vistos=new Set();
    evsDia.forEach(ev=>{
      if(vistos.has(ev.id))return;
      const irmaos=evsDia.filter(e=>e.casa===ev.casa&&e.func===ev.func&&e.hora===ev.hora);
      irmaos.forEach(e=>vistos.add(e.id));grupos.push(irmaos);
    });
    const gruposFiltrados=filtroStatus==="todos"?grupos:grupos.filter(g=>(g[0].statusCor||"pendente")===filtroStatus);
    if(gruposFiltrados.length===0){evSection.appendChild(div({style:{textAlign:"center",padding:"20px 0",color:"#8B8FA8",fontSize:13}},"Nenhum com este filtro"));return;}

    gruposFiltrados.forEach((grupo,gi)=>{
      const rep=grupo[0];
      const statusAtual=rep.statusCor||"pendente";const sc2=STATUS_CORES[statusAtual]||STATUS_CORES.pendente;
      const card=div({className:"card anim",style:{marginBottom:8,animationDelay:gi*20+"ms",borderLeft:"5px solid "+sc2.faixa,background:sc2.bg}});
      const inner=div({style:{padding:"12px 14px"}});
      const petsWrap=div();
      function buildPetsWrap(){
        petsWrap.innerHTML="";
        const grpAtual=(DATA.agenda||[]).filter(a=>grupo.some(g=>g.id===a.id));
        grpAtual.forEach(ev=>{
          const val=getValorEvento(ev);
          const petRow=div({style:{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}});
          petRow.appendChild(h("span",{style:{fontWeight:800,color:"#1A1A2E",fontSize:14}},ev.pet||"Pet"));
          if(!gerente){
            const valBtn=btn({style:{background:val>0?"#e8fbed":"#fff0f0",color:val>0?"#2DC653":"#e53e3e",fontWeight:800,fontSize:12,padding:"2px 8px",borderRadius:8,border:"1px solid "+(val>0?"#2DC653":"#ffcdd2")},onClick:()=>abrirValorModal(ev,()=>{DATA=loadData();buildPetsWrap();})},val>0?"R$ "+val.toFixed(2):"+ Valor");
            petRow.appendChild(valBtn);
          }
          // botão remover pet do grupo
          petRow.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",fontWeight:800,fontSize:11,padding:"2px 7px",borderRadius:8,border:"1px solid #ffcdd2"},onClick:()=>{if(grpAtual.length<=1){alert("Grupo precisa ter ao menos 1 pet.");return;}updSilent(d=>({...d,agenda:d.agenda.filter(a=>a.id!==ev.id)}));DATA=loadData();buildPetsWrap();}},"✕"));
          petsWrap.appendChild(petRow);
        });
        // botão + Pet
        const addPetBtn=btn({style:{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",background:"#FFF5F9",color:"#FF6B9D",border:"2px dashed #FF6B9D",borderRadius:10,fontSize:12,fontWeight:800,marginTop:4},onClick:()=>abrirAddPetGrupoModal(rep,grpAtual,buildPetsWrap,gerente)},[h("span",{},"＋")," Pet"]);
        petsWrap.appendChild(addPetBtn);
      }
      buildPetsWrap();
      inner.appendChild(petsWrap);
      const funcR=div({style:{display:"flex",alignItems:"center",gap:8,marginTop:4,flexWrap:"wrap"}});
      const funcSel2=sel({style:{fontSize:12,fontWeight:700,color:"#3B82F6",background:"#EFF6FF",border:"1.5px solid #BFDBFE",borderRadius:8,padding:"4px 8px",fontFamily:"Nunito,sans-serif"},onChange:e=>{const ids=new Set(grupo.map(x=>x.id));updSilent(d=>({...d,agenda:d.agenda.map(a=>ids.has(a.id)?{...a,func:e.target.value}:a)}));}},FUNCS.map(f=>({v:f.n,l:f.n,sel:f.n===rep.func})));
      funcR.appendChild(funcSel2);
      funcR.appendChild(h("span",{style:{fontSize:11,color:"#8B8FA8"}},rep.hora||""));
      inner.appendChild(funcR);
      inner.appendChild(div({style:{fontSize:11,color:"#8B8FA8",marginTop:3}},"Casa "+rep.casa+(rep.morador?" - "+rep.morador:"")));
      const acts=div({style:{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}});
      const todosBaixados=grupo.every(e=>e.buscado);
      if(!todosBaixados)acts.appendChild(btn({style:{padding:"8px 12px",background:"linear-gradient(135deg,#FFD93D,#E8A000)",color:"#fff",borderRadius:10,fontSize:12,fontWeight:800},onClick:()=>darBaixaGrupo(grupo,buildEvs)},"✓ Dar Baixa"));
      else acts.appendChild(div({style:{padding:"8px 10px",background:"#e8fbed",color:"#2DC653",borderRadius:10,fontSize:11,fontWeight:800,border:"1px solid #2DC653"}},"✅ Baixado"));
      acts.appendChild(btn({style:{background:"#EFF6FF",color:"#3B82F6",padding:"7px 10px",borderRadius:10,fontSize:12,fontWeight:800},onClick:()=>abrirEditDataModal(grupo,buildEvs)},"📅"));
      acts.appendChild(btn({style:{background:"#f5f5f5",color:rep.vetus?"#444":"#bbb",padding:"7px 10px",borderRadius:10,fontSize:12,fontWeight:700,border:"1px solid #ddd"},onClick:()=>{const ids=new Set(grupo.map(e=>e.id));updSilent(d=>({...d,agenda:d.agenda.map(a=>ids.has(a.id)?{...a,vetus:!rep.vetus}:a)}));buildEvs();}},rep.vetus?"V✓":"V"));
      acts.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"7px 10px",borderRadius:10,fontSize:12},onClick:()=>{if(confirm("Apagar?")){updSilent(d=>({...d,agenda:d.agenda.filter(a=>!grupo.map(e=>e.id).includes(a.id))}));DATA=loadData();buildEvs();}}},"🗑️"));
      inner.appendChild(acts);
      const stRow=div({style:{display:"flex",gap:5,marginTop:8}});
      Object.entries(STATUS_CORES).forEach(([k,v])=>{
        const isA=statusAtual===k;
        stRow.appendChild(btn({style:{flex:1,padding:"6px 4px",fontSize:10,fontWeight:800,background:isA?v.faixa:"#f5f5f5",color:isA?"#fff":"#8B8FA8",borderRadius:8,border:"2px solid "+(isA?v.faixa:"#eee")},onClick:()=>{const ids=new Set(grupo.map(e=>e.id));updSilent(d=>({...d,agenda:d.agenda.map(a=>ids.has(a.id)?{...a,statusCor:k}:a)}));buildEvs();}},v.emoji+" "+v.label));
      });
      inner.appendChild(stRow);
      const mapRow=div({style:{marginTop:8,paddingTop:8,borderTop:"1px solid #FFE4EF",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}});
      const endStr=rep.endereco||"";
      mapRow.appendChild(div({style:{flex:1,fontSize:11,color:"#8B8FA8",minWidth:50,wordBreak:"break-word"}},endStr||"Sem endereco"));
      if(endStr)mapRow.appendChild(h("a",{href:mapsUrl(endStr),target:"_blank",style:{background:"#4285F4",color:"#fff",padding:"7px 10px",borderRadius:10,fontWeight:800,fontSize:11,textDecoration:"none",flexShrink:0}},"🗺 Maps"));
      mapRow.appendChild(btn({style:{background:"#FF6B9D",color:"#fff",padding:"7px 10px",borderRadius:10,fontWeight:800,fontSize:11,flexShrink:0},onClick:()=>abrirWATelebusca(grupo,gwa)},"🚗 Buscar"));
      if(!gerente)mapRow.appendChild(btn({style:{background:"#25D366",color:"#fff",padding:"7px 10px",borderRadius:10,fontWeight:800,fontSize:11,flexShrink:0},onClick:()=>abrirPagamentoModal(grupo,buildEvs,gwa)},"💬 WA"));
      inner.appendChild(mapRow);
      card.appendChild(inner);evSection.appendChild(card);
    });
  }

  function getAllPets(){
    const all={...DATA.casas,...DATA.casas2||{}};const pets=[];const visto=new Set();
    Object.entries(all).forEach(([num,casa])=>{
      const endObj=(DATA.enderecos||{})[num]||{};
      const endStr=endObj.rua?`${endObj.rua}, ${endObj.numero||""}, ${endObj.bairro||""}`:"";
      const vis=new Set();
      // 1) Pets dos atendimentos de cobrança (fonte original)
      [...Object.values(DATA.cobrancas||{}),...Object.values(DATA.cobrancas2||{})].forEach(cbM=>{
        const cb=cbM[num];if(!cb)return;
        (cb.atendimentos||[]).forEach(at=>(at.caes||[]).forEach(c=>{
          if(c.nome&&!vis.has(c.nome)){vis.add(c.nome);const uid=num+"_"+c.nome;if(!visto.has(uid)){visto.add(uid);pets.push({pet:c.nome,casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
        }));
      });
      // 2) Pets do campo modelos (cadastrados via modal de pets)
      const modPets=DATA.modelos?.[num]||[];
      modPets.forEach(p=>{
        if(p.nome&&!vis.has(p.nome)){vis.add(p.nome);const uid=num+"_"+p.nome;if(!visto.has(uid)){visto.add(uid);pets.push({pet:p.nome,casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
      });
      // 3) Pets do campo pets da casa (campo direto do cadastro)
      const casaPets=casa.pets||[];
      casaPets.forEach(p=>{
        if(p.nome&&!vis.has(p.nome)){vis.add(p.nome);const uid=num+"_"+p.nome;if(!visto.has(uid)){visto.add(uid);pets.push({pet:p.nome,casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
      });
      // 4) Se ainda não tem nenhum pet, exibe tutor para cadastrar
      if(vis.size===0){const uid=num+"_";if(!visto.has(uid)){visto.add(uid);pets.push({pet:"",casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
    });
    return pets;
  }

  buildCal();
  return w;
}

// ── MODAL ADICIONAR PET AO GRUPO ─────────────────────────────────────────────
function abrirAddPetGrupoModal(rep,grupoAtual,onDone,gerente){
  const casaNum=rep.casa;
  const casaObj=(DATA.casas||{})[casaNum]||(DATA.casas2||{})[casaNum]||{};
  const telefone=casaObj.telefone||rep.telefone||"";
  const morador=casaObj.morador||rep.morador||"";
  const endObj=(DATA.enderecos||{})[casaNum]||{};
  const endStr=endObj.rua?`${endObj.rua}, ${endObj.numero||""}, ${endObj.bairro||""}`:(rep.endereco||"");

  // Coletar todos os pets do tutor (modelos + cobrancas + campo pets)
  const petsCadastrados=new Set();

function abrirAgModal(dataInicial,onDone,getAllPets,gerente){

  let selIdxs=[];let funcIdx=0;let servicoSel="Banho";let repetir=null;
  let petsFiltrados=pets;
  const cont=div();
  const dI=inp({className:"fi",type:"date",value:dataInicial,style:{marginBottom:12}});
  const buscaNum=inp({className:"fi",placeholder:"Ex: 608, 1029...",style:{marginBottom:8,border:"2px solid #4285F4"}});
  const buscaCao=inp({className:"fi",placeholder:"Cao...",style:{marginBottom:0,border:"2px solid #FF6B9D"}});
  const buscaTutor=inp({className:"fi",placeholder:"Tutor / telefone...",style:{marginBottom:0,border:"2px solid #FF6B9D"}});
  const buscaEnd=inp({className:"fi",placeholder:"Rua, bairro...",style:{marginBottom:8,border:"2px solid #2DC653"}});
  const listaDiv=div({style:{maxHeight:200,overflowY:"auto",border:"1.5px solid #FFE4EF",borderRadius:14,marginBottom:12}});
  const selInfo=div({style:{fontSize:12,fontWeight:700,color:"#FF6B9D",marginBottom:8,minHeight:18}});
  function filtrarPets(){
    const qNum=buscaNum.value.toLowerCase().trim();
    const qCao=buscaCao.value.toLowerCase().trim();
    const qTutor=buscaTutor.value.toLowerCase().trim();
    const qTutorDig=qTutor.replace(/\D/g,"");
    const qEnd=buscaEnd.value.toLowerCase().trim();
    return pets.filter(p=>{
      if(qNum&&!String(p.casa).includes(qNum))return false;
      if(qCao&&!p.pet.toLowerCase().includes(qCao))return false;
      if(qTutor){
        const tutorOk=p.morador.toLowerCase().includes(qTutor);
        const telOk=qTutorDig&&p.telefone&&String(p.telefone).replace(/\D/g,"").includes(qTutorDig);
        if(!tutorOk&&!telOk)return false;
      }
      if(qEnd&&!p.endereco.toLowerCase().includes(qEnd))return false;
      return true;
    });
  }
  // painel resumo dos pets selecionados (aparece abaixo da lista)
  const resumoDiv=div({style:{marginBottom:10}});

  function getUltimoValorPet(casa,pet){
    let melhorData="",melhorValor=0;
    [DATA.cobrancas,DATA.cobrancas2||{}].forEach(src=>{
      MESES.forEach(m=>{
        ((src[m]||{})[casa]||{atendimentos:[]}).atendimentos.forEach(at=>{
          (at.caes||[]).forEach(c=>{

      const sm=div({className:"card",style:{padding:"14px 18px",marginBottom:16,background:"#FFF5F9"}});
      sm.innerHTML=`<div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px"><span style="color:#8B8FA8">Total</span><span style="color:#FF6B9D">R$ ${tG.toFixed(2)}</span></div>`;
      body.appendChild(sm);
      const grid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}});
      CAT_SAIDAS.forEach((item,i)=>{
        const tot=lista.filter(s=>s.cat===item.k).reduce((s,x)=>s+(parseFloat(x.val)||0),0);
        const c=div({className:"btn card anim",style:{padding:"20px 14px",display:"flex",flexDirection:"column",alignItems:"center",gap:8,animationDelay:i*30+"ms",cursor:"pointer"},onClick:()=>{catSel=item.k;build();}});

        grid.appendChild(c);
      });body.appendChild(grid);
    } else {
      const ci=CAT_SAIDAS.find(c=>c.k===catSel);
      const sc=lista.filter(s=>s.cat===catSel);
      const tc=sc.reduce((s,x)=>s+(parseFloat(x.val)||0),0);

      body.appendChild(tR);

      if(sc.length===0)body.appendChild(div({style:{textAlign:"center",padding:"40px 0",color:"#8B8FA8",fontWeight:700}},"Sem registros"));
      sc.forEach(s=>{
        const c=div({className:"card anim",style:{padding:"12px 16px",marginBottom:10,borderLeft:"4px solid #FF6B9D",display:"flex",alignItems:"center",gap:10}});
        const inf=div({style:{flex:1}});
        // Mostra subtipo se tiver
        const subLabel=s.subtipo?`<span style="background:#FFE4EF;color:#FF6B9D;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;margin-left:6px">${s.subtipo}</span>`:"";

function renderVendas(){
  const w=div({className:"screen"});
  w.appendChild(mkHdr("Vendas",()=>go("home"),btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"9px 13px",fontSize:13,borderRadius:12},onClick:()=>abrirVendaModal(null,build)},"+Nova")));
  const body=div({style:{padding:"16px 18px 40px"}});w.appendChild(body);
  function build(){
    body.innerHTML="";const lista=DATA.vendas||[];const tot=lista.reduce((s,v)=>s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1),0);
    const sm=div({className:"card",style:{padding:"14px 18px",marginBottom:14,background:"#FFF5F9"}});
    sm.innerHTML=`<div style="font-weight:700;color:#8B8FA8;font-size:11px;text-transform:uppercase">Total Vendas</div><div style="font-family:'Fredoka One',sans-serif;font-size:26px;color:#FF6B9D">R$ ${tot.toFixed(2)}</div>`;
    body.appendChild(sm);
    if(lista.length===0){body.innerHTML+='<div style="text-align:center;padding:40px 0;color:#8B8FA8"><div style="font-size:48px">🛍</div><p style="font-weight:700;margin-top:12px">Nenhuma venda</p></div>';return;}
    [...lista].reverse().forEach((v,i)=>{
      const sub=(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1);
      const c=div({className:"card anim",style:{marginBottom:10,animationDelay:i*18+"ms",borderLeft:"4px solid #FF6B9D"}});
      const top=div({style:{padding:"12px 14px",display:"flex",gap:10,alignItems:"center"}});
      const inf=div({style:{flex:1}});inf.innerHTML=`<div style="font-weight:800;color:#1A1A2E;font-size:14px">${v.nome}</div><div style="font-size:12px;color:#8B8FA8">Casa ${v.casaNum||""} ${v.morador||""} - ${fmtD(v.data)}</div>`;
      const r=div({style:{textAlign:"right"}});r.innerHTML=`<div style="font-weight:800;color:#FF6B9D;font-size:15px">R$ ${sub.toFixed(2)}</div>`;
      const a=div({style:{display:"flex",gap:5,marginTop:6}});
      a.appendChild(btn({style:{background:"#FFF5F9",color:"#FF6B9D",padding:"6px 9px",borderRadius:10,fontSize:11},onClick:()=>abrirVendaModal(v,build)},"Edit"));
      a.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"6px 9px",borderRadius:10,fontSize:11},onClick:()=>{updSilent(d=>({...d,vendas:(d.vendas||[]).filter(x=>x.id!==v.id)}));DATA=loadData();build();}},"Del"));
      r.appendChild(a);top.appendChild(inf);top.appendChild(r);c.appendChild(top);body.appendChild(c);
    });
  }
  build();return w;
}
function abrirVendaModal(vEdit,onDone){
  const all={...DATA.casas,...DATA.casas2||{}};const cl2=Object.entries(all).map(([n,c])=>({num:Number(n),morador:c.morador})).sort((a,b)=>a.num-b.num);
  const cont=div();
  const cS=sel({className:"fi",style:{marginBottom:12}},[{v:"",l:"Selecione o tutor..."},...cl2.map(c=>({v:c.num,l:`Casa ${c.num} - ${c.morador}`}))]);
  if(vEdit)cS.value=vEdit.casaNum;
  const nI=inp({className:"fi",placeholder:"Produto",value:vEdit?.nome||"",style:{marginBottom:12}});
  nI.setAttribute("list","plist");
  const dl=h("datalist",{id:"plist"});(DATA.produtos||[]).forEach(p=>{const op=document.createElement("option");op.value=p.nome;dl.appendChild(op);});
  const pI=inp({className:"fi",type:"number",placeholder:"0,00",value:vEdit?.preco||"",style:{marginBottom:12}});
  // Auto-fill price when product is selected
  nI.addEventListener("change",()=>{
    const nome=nI.value.trim().toLowerCase();
    const prod=(DATA.produtos||[]).find(p=>(p.nome||"").trim().toLowerCase()===nome);
    if(prod&&prod.preco&&!pI.value){
      const v=parseFloat(String(prod.preco).replace(",","."));
      if(!isNaN(v)&&v>0) pI.value=v.toFixed(2);
    }
  });
  nI.addEventListener("input",()=>{
    const nome=nI.value.trim().toLowerCase();
    const prod=(DATA.produtos||[]).find(p=>(p.nome||"").trim().toLowerCase()===nome);
    if(prod&&prod.preco){
      const v=parseFloat(String(prod.preco).replace(",","."));
      if(!isNaN(v)&&v>0) pI.value=v.toFixed(2);
    }
  });
  const qI=inp({className:"fi",type:"number",placeholder:"1",value:vEdit?.qtd||"1",style:{marginBottom:12}});
  const dI=inp({className:"fi",type:"date",value:vEdit?.data||hoje(),style:{marginBottom:20}});
  [lbl("Tutor"),cS,dl,lbl("Produto"),nI,lbl("Preco (R$)"),pI,lbl("Qtd"),qI,lbl("Data"),dI].forEach(el=>cont.appendChild(el));
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"17px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:16,borderRadius:16},onClick:()=>{
    if(!cS.value||!nI.value||!pI.value){alert("Preencha tutor, produto e preco!");return;}
    const casa=all[cS.value]||{};const venda={id:vEdit?.id||Date.now(),casaNum:Number(cS.value),morador:casa.morador||"",nome:nI.value,preco:pI.value,qtd:qI.value||"1",data:dI.value};
    if(vEdit)updSilent(d=>({...d,vendas:(d.vendas||[]).map(v=>v.id===venda.id?venda:v)}));
    else updSilent(d=>({...d,vendas:[...(d.vendas||[]),venda]}));
    DATA=loadData();if(mv)mv.remove();onDone();
  }},vEdit?"Salvar":"Registrar"));
  mv=openModal(vEdit?"Editar Venda":"Nova Venda",cont,()=>{});
}

function importarAnimaisVetus(onDone){
  // Abre modal para selecionar arquivo JSON exportado (animais_com_telefones.json)
  const cont=h("div",{style:{padding:"16px"}});
  let mv;
  const info=h("p",{style:{fontSize:13,color:"#6B7280",marginBottom:12}});
  info.innerHTML="Selecione o arquivo <b>animais_com_telefones.json</b> gerado pelo Claude.";
  cont.appendChild(info);
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json";
  inp.style.cssText="width:100%;padding:8px;border:1px solid #ddd;borderRadius:8px;fontSize:13;marginBottom:10px";
  cont.appendChild(inp);
  const res=h("div",{style:{marginTop:8,fontSize:13}});
  cont.appendChild(res);
  inp.onchange=()=>{
    const file=inp.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const lista=JSON.parse(e.target.result);
        if(!Array.isArray(lista)){res.innerHTML="<span style=\"color:red\">Arquivo inválido.</span>";return;}
        let importados=0, substituidos=0, semId=0;
        DATA=loadData();
        const casas=DATA.casas2||{};
        const pets2=DATA.pets2||{};
        // Detectar duplicado pelo telefone principal
        const telMap={};
        Object.values(casas).forEach(c=>{if(c.telefone)telMap[c.telefone.replace(/\D/g,"")]=c.id;});
        lista.forEach(a=>{
          if(!a.id_vetus){semId++;return;}
          const id=String(a.id_vetus);
          const tel=(a.telefone_principal||"").replace(/\D/g,"");
          const existeTel=tel&&telMap[tel];
          // Se já existe pelo telefone E é outro id, substitui; se mesmo id, atualiza
          const alvo=existeTel||id;
          // Upsert cliente (casa2)
          casas[id]={
            id:id,
            morador:a.tutor||"",
            telefone:a.telefone_principal||"",
            telefone2:a.telefones&&a.telefones[1]?a.telefones[1]:"",
            telefones:a.telefones||[],
            endereco:a.endereco||"",
            numero:a.numero||"",
            bairro:a.bairro||"",
            cidade:a.cidade||"",
            cep:a.cep||"",
            cpf:a.cpf||""
          };
          if(existeTel&&existeTel!==id) substituidos++;
          else importados++;
          // Upsert pet
          const petId="pet_"+id+"_"+((a.nome_pet||"sem_nome").replace(/\s+/g,"_").toLowerCase());
          if(!pets2[id]) pets2[id]=[];
          // Verifica se pet já existe pelo nome
          const jaExiste=pets2[id].find(p=>p.nome&&p.nome.toLowerCase()===((a.nome_pet||"").toLowerCase()));
          if(!jaExiste){
            pets2[id].push({
              id:petId,
              nome:a.nome_pet||"",
              raca:a.raca||"",
              especie:a.especie||"",
              sexo:a.sexo||"",
              nascimento:a.nascimento||"",
              observacao:a.observacao||""
            });
          }
          if(tel) telMap[tel]=id;
        });
        DATA.casas2=casas;
        DATA.pets2=pets2;
        saveData(DATA);
        res.innerHTML=`<span style="color:#2DC653;font-weight:700">✅ ${importados} clientes importados, ${substituidos} substituídos por telefone, ${semId} sem ID Vetus ignorados.</span>`;
        if(typeof onDone==="function")onDone();
      }catch(err){res.innerHTML="<span style=\"color:red\">Erro: "+err.message+"</span>";}
    };
    reader.readAsText(file);
  };
  cont.appendChild(btn({style:{width:"100%",padding:"11px",background:"linear-gradient(135deg,#7C3AED,#a78bfa)",color:"#fff",borderRadius:12,fontWeight:700,fontSize:14,marginTop:8},onClick:()=>{if(mv)mv.remove();}},"✅ Fechar"));
  mv=openModal("Importar Animais + Telefones",cont,()=>{});
}

      if(idx!=null)notas[idx]={...notas[idx],titulo:tI.value,corpo:ta.value};
      else notas.push({id:Date.now(),titulo:tI.value,corpo:ta.value,criado:hoje()});
      saveNotas(notas);if(mv)mv.remove();onDone2();
    }},nota?"Salvar Nota":"Criar Nota"));
    if(nota)cont.appendChild(btn({style:{width:"100%",padding:"13px",background:"#fff0f0",color:"#e53e3e",borderRadius:12,border:"2px solid #ffcdd2"},onClick:()=>{if(confirm("Apagar?")){notas.splice(idx,1);saveNotas(notas);if(mv)mv.remove();onDone2();}}},"🗑️ Apagar nota"));
    mv=openModal(nota?"Editar Nota":"Nova Nota",cont,()=>{});
  }
  build();return w;
}

// ── EXPORTAR / RESTAURAR ──────────────────────────────────────────────────────
function renderExportar(){
  const w=div({className:"screen"});w.appendChild(mkHdr("Exportar Dados",()=>go("home")));
  const body=div({style:{padding:"20px 18px 40px"}});
  const txt=JSON.stringify(DATA);
  const info=div({className:"card",style:{padding:"14px 18px",marginBottom:16,background:"#e8fbed",border:"1.5px solid #2DC653"}});
  info.innerHTML=`<div style="font-weight:800;color:#2DC653;font-size:15px;margin-bottom:6px">Backup</div><div style="font-size:13px;color:#1A1A2E;line-height:1.9">Cad.1: <b>${Object.keys(DATA.casas||{}).length}</b> | Cad.2: <b>${Object.keys(DATA.casas2||{}).length}</b><br>Agenda: <b>${(DATA.agenda||[]).length}</b> items<br>Tamanho: <b>${(txt.length/1024).toFixed(1)} KB</b></div>`;
  body.appendChild(info);
  const dlB=btn({style:{width:"100%",padding:"16px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:15,borderRadius:14,marginBottom:12,display:"flex",alignItems:"center",justifyContent:"center",gap:10},onClick:()=>{const blob=new Blob([txt],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="planetdogs_backup_"+hoje()+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}},[h("span",{},"📥")," Baixar .json"]);
  const cpB=btn({style:{width:"100%",padding:"16px",background:"linear-gradient(135deg,#1A1A2E,#2d2d4e)",color:"#fff",fontSize:15,borderRadius:14,marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:10},onClick:()=>navigator.clipboard.writeText(txt).then(()=>alert("Copiado!"))},[h("span",{},"📋")," Copiar JSON"]);
  const ta=h("textarea",{style:{width:"100%",height:100,padding:"10px",borderRadius:10,border:"1.5px solid #FFE4EF",fontSize:10,fontFamily:"monospace",resize:"none",color:"#1A1A2E",background:"#FAFAFA"}});ta.value=txt;ta.addEventListener("focus",()=>ta.select());
  [dlB,cpB,ta].forEach(el=>body.appendChild(el));w.appendChild(body);return w;
}
function renderRestaurar(){
  const w=div({className:"screen"});w.appendChild(mkHdr("Restaurar Backup",()=>go("home")));
  const body=div({style:{padding:"20px 18px 40px"}});
  const fileI=h("input",{type:"file",accept:".json,application/json",style:{display:"none"}});
  const msg=div({style:{borderRadius:12,padding:"12px 16px",marginBottom:14,fontWeight:700,fontSize:13,whiteSpace:"pre-line",display:"none"}});
  let parsed=null;
  const rB=btn({style:{width:"100%",padding:"18px",background:"linear-gradient(135deg,#2DC653,#52e87b)",color:"#fff",fontSize:17,borderRadius:16,display:"none",alignItems:"center",justifyContent:"center",gap:10,marginBottom:16},onClick:()=>{if(parsed){saveData(parsed);DATA=parsed;go("home");alert("Backup restaurado!");}}},[h("span",{style:{fontSize:22}},"✅")," RESTAURAR AGORA"]);
  fileI.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);parsed=p;msg.style.display="block";msg.style.background="#e8fbed";msg.style.color="#2DC653";msg.textContent=`Valido! Cad.1: ${Object.keys(p.casas||{}).length} | Cad.2: ${Object.keys(p.casas2||{}).length}`;rB.style.display="flex";}catch(e){msg.style.display="block";msg.style.background="#fff0f0";msg.style.color="#e53e3e";msg.textContent="Erro: "+e.message;parsed=null;rB.style.display="none";}};r.readAsText(f);});
  const selB=btn({style:{width:"100%",padding:"20px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:16,borderRadius:16,marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:10},onClick:()=>{fileI.value="";fileI.click();}},[h("span",{},"📂")," SELECIONAR ARQUIVO"]);
  const lblC=h("p",{style:{fontWeight:800,color:"#8B8FA8",fontSize:13,textTransform:"uppercase",marginBottom:8,marginTop:8}},"Ou cole o JSON:");
  const ta=h("textarea",{style:{width:"100%",height:140,padding:"12px",borderRadius:12,border:"2px solid #FF6B9D",fontSize:11,fontFamily:"monospace",resize:"vertical",color:"#1A1A2E",background:"#FAFAFA",marginBottom:8}});ta.placeholder='{"casas":{...},...}';
  const valB=btn({style:{width:"100%",padding:"14px",background:"linear-gradient(135deg,#9B59B6,#FF6B9D)",color:"#fff",fontSize:14,borderRadius:14,marginBottom:8},onClick:()=>{
    if(!ta.value.trim()){alert("Cole o conteudo!");return;}
    try{const p=JSON.parse(ta.value);parsed=p;msg.style.display="block";msg.style.background="#e8fbed";msg.style.color="#2DC653";msg.textContent=`Valido! Cad.1: ${Object.keys(p.casas||{}).length} | Cad.2: ${Object.keys(p.casas2||{}).length}`;rB.style.display="flex";}catch(e){msg.style.display="block";msg.style.background="#fff0f0";msg.style.color="#e53e3e";msg.textContent="Erro: "+e.message;parsed=null;rB.style.display="none";}
  }},"Validar JSON");
  [fileI,selB,msg,rB,lblC,ta,valB].forEach(el=>body.appendChild(el));
  w.appendChild(body);return w;
}

render();
</script>
