<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Planet Dogs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;font-family:'Nunito',sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--pk:#FF6B9D;--ac:#FFD93D;--dk:#1A1A2E;--mu:#8B8FA8;--ok:#2DC653;}
.screen{min-height:100vh;padding-top:58px;padding-bottom:80px;}
.btn{cursor:pointer;border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-weight:800;transition:transform .12s;background:transparent;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.96);}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(255,107,157,.13);border:1.5px solid #FFE4EF;}
input,select,textarea{font-family:'Nunito',sans-serif;font-size:14px;}
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#FF6B9D,#FFD93D);padding:6px 8px;display:flex;gap:4px;box-shadow:0 2px 12px rgba(255,107,157,.35);}
.topbtn{flex:1;padding:5px 2px;background:rgba(255,255,255,.28);color:#1A1A2E;font-size:10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;}
.topbtn span{font-size:15px;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-end;}
.modal-box{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:22px 18px 40px;}
.modal-ct{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:0 20px;}
.modal-cd{background:#fff;border-radius:22px;width:100%;padding:26px 20px;max-height:90vh;overflow-y:auto;}
.hdr{background:linear-gradient(135deg,#FF6B9D,#FFD93D);padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(255,107,157,.3);}
.hdr h2{font-family:'Fredoka One',sans-serif;font-size:20px;color:#1A1A2E;flex:1;}
.lb{font-weight:700;color:#8B8FA8;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;display:block;margin-top:4px;}
.fi{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #FFE4EF;font-size:14px;font-weight:600;color:#1A1A2E;outline:none;background:#fff;}
.tog-wrap{width:50px;height:27px;border-radius:14px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;display:inline-block;}
.tog-thumb{position:absolute;top:3px;width:21px;height:21px;border-radius:11px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:left .2s;}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:up .2s ease both;}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div id="app"></div>
<script>
const MESES=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS_SEM=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
const DIAS_FULL=["Domingo","Segunda","Terca","Quarta","Quinta","Sexta","Sabado"];
const SERVICOS=["Banho","Tosa","Banho + Tosa","Vacina","Consulta","Outro"];
const FUNCS=[{n:"Jaqueline",c:"Banho e Tosa"},{n:"Patricia",c:"Banho e Tosa"},{n:"Kleber",c:"Banho e Tosa"},{n:"Julia",c:"Recepcao"},{n:"Vera",c:"Recepcao"},{n:"Felipe",c:"Motorista"}];
const REPS=[{l:"7 dias",d:7},{l:"10 dias",d:10},{l:"15 dias",d:15},{l:"4 semanas",d:28}];
const STATUS_CORES={pendente:{bg:"#FFFBEE",faixa:"#FFD93D",label:"Pendente",emoji:"🟡"},servico:{bg:"#EFF6FF",faixa:"#3B82F6",label:"Em Servico",emoji:"🔵"},finalizado:{bg:"#f0fff4",faixa:"#2DC653",label:"Finalizado",emoji:"🟢"}};

// ── SAÍDAS: categorias com subcategorias específicas ──────────────────────────
const CAT_SAIDAS=[
  {k:"carro",l:"Carro",e:"🚗",subs:[
    {k:"gasolina",l:"Gasolina",e:"⛽"},{k:"diesel",l:"Diesel",e:"🛢"},{k:"gnv",l:"GNV",e:"🔴"},
    {k:"oleo",l:"Oleo",e:"🔧"},{k:"pneu",l:"Pneu",e:"🔄"},{k:"manutencao",l:"Manutencao",e:"🔩"},
    {k:"lavagem",l:"Lavagem",e:"🚿"},{k:"seguro",l:"Seguro",e:"🛡"},{k:"ipva",l:"IPVA",e:"📋"},
    {k:"outros",l:"Outros",e:"📦"}
  ]},
  {k:"funcionarios",l:"Funcionarios",e:"👥",subs:null},// tratado especialmente
  {k:"alimentacao",l:"Alimentacao",e:"🍽",subs:[
    {k:"almoco",l:"Almoco",e:"🍱"},{k:"lanche",l:"Lanche",e:"🥪"},
    {k:"supermercado",l:"Supermercado",e:"🛒"},{k:"outros",l:"Outros",e:"📦"}
  ]},
  {k:"produtos",l:"Produtos",e:"🧴",subs:[
    {k:"shampoo",l:"Shampoo",e:"🧴"},{k:"medicamento",l:"Medicamento",e:"💊"},
    {k:"equipamento",l:"Equipamento",e:"🔧"},{k:"embalagem",l:"Embalagem",e:"📦"},
    {k:"outros",l:"Outros",e:"📦"}
  ]},
  {k:"outros",l:"Outros",e:"📦",subs:[
    {k:"aluguel",l:"Aluguel",e:"🏠"},{k:"energia",l:"Energia",e:"⚡"},
    {k:"agua",l:"Agua",e:"💧"},{k:"internet",l:"Internet",e:"📡"},
    {k:"outros",l:"Outros",e:"📦"}
  ]}
];

const KEY="pd_v8";
// ── MODO GERENTE ──────────────────────────────────────────────────────────────
const IS_GERENTE=new URLSearchParams(location.search).has("gerente");
const PRODS_DEF=[
  {nome:"Meloxivet 1mg",cat:"Anti-inflamatorio",preco:""},{nome:"Simparic Trio",cat:"Antiparasitario",preco:""},
  {nome:"EctoFend Coleira",cat:"Antiparasitario",preco:"149,90"},{nome:"Apoquel",cat:"Antiparasitario",preco:""},
  {nome:"Silmox CL",cat:"Antibiotico",preco:""},{nome:"Otodex",cat:"Otologico",preco:""},
  {nome:"Episoothe Shampoo",cat:"Shampoo",preco:"160,00"},{nome:"OrgaMilk",cat:"Suplemento",preco:"35,80"},
  {nome:"Lactobac Multiespecie",cat:"Suplemento",preco:"35,80"},{nome:"Florentero",cat:"Gastrointestinal",preco:""},
];
function emptyData(){
  return{casas:{},casas2:{},cobrancas:{},cobrancas2:{},modelos:{},agenda:[],saidas:[],enderecos:{},vendas:[],produtos:JSON.parse(JSON.stringify(PRODS_DEF)),lab:{maquina:"",insumos:[],exames:[],valorExame:"60"},gruposWA:{0:"",1:"",2:"",3:"",4:"",5:"",6:""},gruposWAPag:{0:"",1:"",2:"",3:"",4:"",5:"",6:""}};
}
function loadData(){
  try{const d=localStorage.getItem(KEY);if(d){const p=JSON.parse(d);
    if(!p.produtos||p.produtos.length<3)p.produtos=JSON.parse(JSON.stringify(PRODS_DEF));
    if(!p.lab)p.lab={maquina:"",insumos:[],exames:[],valorExame:"60"};
    if(!p.gruposWA)p.gruposWA={0:"",1:"",2:"",3:"",4:"",5:"",6:""};if(!p.gruposWAPag)p.gruposWAPag={0:"",1:"",2:"",3:"",4:"",5:"",6:""};
    if(!p.casas2)p.casas2={};if(!p.cobrancas2)p.cobrancas2={};
    return p;}}catch(e){}
  return emptyData();
}
function saveData(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){
  if(e.name==="QuotaExceededError"||e.code===22){
    // Tentar limpar agendamentos muito antigos (mais de 2 anos atrás)
    const hoje2=new Date().toISOString().slice(0,10);
    const limite=new Date();limite.setFullYear(limite.getFullYear()-2);
    const limStr=limite.toISOString().slice(0,10);
    if(d.agenda)d.agenda=d.agenda.filter(a=>!a.data||a.data>=limStr);
    try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e2){
      alert("⚠️ Armazenamento cheio! Alguns agendamentos antigos foram removidos automaticamente.");
    }
  }
}}
let DATA=loadData();

// ── AUTO-IMPORT VETUS ────────────────────────────────────────────────────────
(function(){
  const VFLAG="pd_vetus_imported_v2";
  if(localStorage.getItem(VFLAG)) return; // já importado
  try{
    // Dados carregados via fetch de vetus_data_import.json
    // (já carregados em window._VD pelo script externo)
    const VD=window._VD||{c2:{},m:{},e:{}};
    const d=DATA;
    if(!d.casas2) d.casas2={};
    if(!d.modelos) d.modelos={};
    if(!d.enderecos) d.enderecos={};
    let nc=0,np=0;
    Object.keys(VD.c2).forEach(cid=>{
      if(!(cid in d.casas2)){
        d.casas2[cid]=VD.c2[cid]; nc++;
      } else {
        const ex=new Set((d.casas2[cid].pets||[]).map(p=>p.nome.toLowerCase()));
        (VD.c2[cid].pets||[]).forEach(p=>{
          if(!ex.has(p.nome.toLowerCase())){
            if(!d.casas2[cid].pets) d.casas2[cid].pets=[];
            d.casas2[cid].pets.push(p); np++;
          }
        });
      }
    });
    Object.keys(VD.m).forEach(cid=>{
      if(!(cid in d.modelos)){
        d.modelos[cid]=VD.m[cid];
      } else {
        const ex=new Set((d.modelos[cid]||[]).map(p=>p.nome.toLowerCase()));
        VD.m[cid].forEach(p=>{ if(!ex.has(p.nome.toLowerCase())){ d.modelos[cid].push(p); np++; } });
      }
    });
    Object.keys(VD.e).forEach(cid=>{
      if(!(cid in d.enderecos)) d.enderecos[cid]=VD.e[cid];
    });
    try{ saveData(d); }catch(e){ delete d.enderecos; saveData(d); }
    localStorage.setItem(VFLAG,"1");
    DATA=d;
    console.log("Vetus importado:",nc,"clientes novos,",np,"pets novos");
  }catch(e){ console.warn("Vetus import err:",e); }
})();
// ─────────────────────────────────────────────────────────────────────────────

function updSilent(fn){DATA=fn(JSON.parse(JSON.stringify(DATA)));saveData(DATA);}
function upd(fn){DATA=fn(JSON.parse(JSON.stringify(DATA)));saveData(DATA);render();}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function h(tag,attrs,children){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else el.setAttribute(k,v);
  }
  for(const c of(children||[])){
    if(c==null||c===false)continue;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  }
  return el;
}
const div=(a,c)=>h("div",a,c);
const btn=(a,c)=>{const e=h("button",a,c);e.classList.add("btn");return e;};
const inp=a=>h("input",a);
function sel(attrs,opts){
  const el=h("select",attrs);
  opts.forEach(o=>{const op=h("option",{value:o.v!==undefined?o.v:o.l});op.textContent=o.l;if(o.sel)op.selected=true;el.appendChild(op);});
  return el;
}
const lbl=t=>h("span",{className:"lb"},t);
function tog(val,onChange){
  const w=div({className:"tog-wrap",style:{background:val?"#2DC653":"#FFE4EF"},onClick:()=>onChange(!val)});
  w.appendChild(div({className:"tog-thumb",style:{left:val?"25px":"3px"}}));
  return w;
}
function mkHdr(title,onBack,extra){
  return div({className:"hdr"},[
    onBack&&btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"10px 13px",borderRadius:12,fontSize:17},onClick:onBack},"←"),
    h("h2",{},title),
    extra
  ].filter(Boolean));
}
function openModal(title,content,onClose,center){
  const ov=div({className:center?"modal-ct":"modal-ov"});
  const box=div({className:center?"modal-cd":"modal-box"});
  const top=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}});
  top.appendChild(h("h3",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:20,color:"#FF6B9D"}},title));
  top.appendChild(btn({style:{background:"#f0f0f0",color:"#1A1A2E",padding:"8px 14px",borderRadius:11,fontSize:16,minWidth:44,minHeight:44},onClick:()=>{ov.remove();if(onClose)onClose();}},"✕"));
  box.appendChild(top);
  (Array.isArray(content)?content:[content]).forEach(c=>{if(c)box.appendChild(c);});
  ov.appendChild(box);
  document.body.appendChild(ov);
  return ov;
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
let NAV={s:IS_GERENTE?"agenda_gerente":"home"};
function go(s,extra){
  // Gerente só pode ir para agenda_gerente
  if(IS_GERENTE&&s!=="agenda_gerente")return;
  NAV={s,...(extra||{})};render();
}

function renderTopbar(){
  const tb=document.getElementById("topbar");tb.innerHTML="";
  [{k:"cad1",l:"Cad.1",i:"📁"},{k:"cad2",l:"Cad.2",i:"📂"},{k:"agenda",l:"Agenda",i:"📅"},{k:"saidas",l:"Saidas",i:"💸"},{k:"vendas",l:"Vendas",i:"🛍"},{k:"home",l:"Home",i:"🏠"}].forEach(b=>{
    const bt=h("button",{className:"topbtn"},[h("span",{},b.i),b.l]);
    function addTap(el, fn){
      let sx=0,sy=0,moved=false;
      el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
      el.addEventListener("touchmove",e=>{if(Math.abs(e.touches[0].clientX-sx)>6||Math.abs(e.touches[0].clientY-sy)>6)moved=true;},{passive:true});
      el.addEventListener("touchend",e=>{if(!moved){e.preventDefault();fn(e);}},{passive:false});
      el.addEventListener("click",fn);
    }
    addTap(bt,()=>go(b.k));
    tb.appendChild(bt);
  });
}
function renderTopbarGerente(){
  const tb=document.getElementById("topbar");tb.innerHTML="";
  const logo=div({style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8}});
  logo.innerHTML='<span style="font-size:18px">🐕</span><span style="font-family:\'Fredoka One\',sans-serif;font-size:17px;color:#1A1A2E;letter-spacing:1px">PLANET DOGS</span>';
  tb.appendChild(logo);
}

function render(){
  if(IS_GERENTE){renderTopbarGerente();const app=document.getElementById("app");app.innerHTML="";app.appendChild(renderAgenda(true));return;}
  if(NAV.s==="agenda_gerente")renderTopbarGerente();
  else renderTopbar();
  const app=document.getElementById("app");app.innerHTML="";
  const screens={
    home:renderHome,
    agenda:()=>renderAgenda(false),agenda_gerente:()=>renderAgenda(true),
    saidas:renderSaidas,vendas:renderVendas,farmacia:renderFarmacia,bolao:renderBolao,
    stats:renderStats,exportar:renderExportar,restaurar:renderRestaurar,notas:renderNotas,mesclar:renderMesclar,
    cad1:()=>renderMenuCad("Cadastro 1","cad1"),cad2:()=>renderMenuCad("Cadastro 2","cad2"),
    cad1_casa:()=>renderCadCasa("Cadastro 1","cad1"),cad2_casa:()=>renderCadCasa("Cadastro 2","cad2"),
    cad1_meses:()=>renderMeses("cad1"),cad2_meses:()=>renderMeses("cad2"),
    cad1_grade:()=>renderGrade("Cadastro 1","cad1",NAV.mes),cad2_grade:()=>renderGrade("Cadastro 2","cad2",NAV.mes),
    cad1_det:()=>renderDet("cad1",NAV.mes,NAV.num),cad2_det:()=>renderDet("cad2",NAV.mes,NAV.num),
    cad1_fin:()=>renderFin("Cadastro 1",DATA.casas,DATA.cobrancas,"cad1"),
    cad2_fin:()=>renderFin("Cadastro 2",DATA.casas2||{},DATA.cobrancas2||{},"cad2"),
  };
  if(screens[NAV.s])app.appendChild(screens[NAV.s]());
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
const hoje=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{if(!d)return"--";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;};
const addD=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const mapsUrl=e=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e+", Porto Alegre RS");
const totAts=ats=>(ats||[]).reduce((s,a)=>s+(a.caes||[]).reduce((ss,c)=>ss+(c.servicos||[]).reduce((sss,sv)=>sss+(parseFloat(sv.valor)||0),0),0),0);

function getValorPetFromCobs(casaNum,petNome){
  let melhorData="",melhorValor=0;
  [DATA.cobrancas,DATA.cobrancas2||{}].forEach(cSrc=>{
    MESES.forEach(m=>{
      ((cSrc[m]||{})[casaNum]||{atendimentos:[]}).atendimentos.forEach(at=>{
        (at.caes||[]).forEach(cao=>{
          if(cao.nome===petNome){
            const val=(cao.servicos||[]).reduce((s,sv)=>s+(parseFloat(sv.valor)||0),0);
            if(val>0&&at.data>melhorData){melhorData=at.data;melhorValor=val;}
          }
        });
      });
    });
  });
  return melhorValor;
}
function getValorEvento(ev){
  if(ev.valorCustom&&parseFloat(ev.valorCustom)>0)return parseFloat(ev.valorCustom);
  return getValorPetFromCobs(ev.casa,ev.pet);
}

// ── LANÇAR BANHOS BUSCADOS CAD.2 ─────────────────────────────────────────────
function lancarBanhosBuscadosCad2(){
  const casas2=DATA.casas2||{};
  const agenda=DATA.agenda||[];
  // Filtra: tutores do Cad.2, buscado:true, data em Maio (4) ou Junho (5)
  const evsFiltrados=agenda.filter(ev=>{
    if(!ev.buscado||!ev.data||!ev.casa)return false;
    if(!casas2[String(ev.casa)]&&!casas2[Number(ev.casa)])return false;
    const mes=new Date(ev.data+"T12:00:00").getMonth();
    return mes===4||mes===5; // 4=Maio, 5=Junho
  });
  if(evsFiltrados.length===0){alert("Nenhum agendamento encontrado.\n(Cad.2 + Maio/Junho + buscado)");return;}

  // Agrupa por tutor+mês para mostrar preview
  const resumo={};
  evsFiltrados.forEach(ev=>{
    const d=new Date(ev.data+"T12:00:00");
    const mesIdx=d.getMonth();
    const mesNome=MESES[mesIdx];
    const chave=mesNome+"_"+ev.casa;
    if(!resumo[chave])resumo[chave]={mesNome,casa:ev.casa,evs:[]};
    resumo[chave].evs.push(ev);
  });

  const totalTutores=Object.keys(resumo).length;
  const cont=div();
  const info=div({style:{background:"#EFF6FF",border:"2px solid #3B82F6",borderRadius:12,padding:"14px",marginBottom:14,fontSize:13,lineHeight:1.8}});
  info.innerHTML=`<b style="color:#3B82F6">📋 ${evsFiltrados.length} agendamentos</b> encontrados<br><b>${totalTutores} tutor/mês</b> serão lançados nas cobranças do Cad.2<br><span style="color:#8B8FA8;font-size:11px">Todos marcados como pagos ✅</span>`;
  cont.appendChild(info);

  const prev=div({style:{maxHeight:200,overflowY:"auto",marginBottom:14,border:"1px solid #f0f0f0",borderRadius:10,padding:"6px"}});
  Object.values(resumo).slice(0,30).forEach(({mesNome,casa,evs})=>{
    const casaObj=casas2[String(casa)]||casas2[Number(casa)]||{};
    const nome=(casaObj.morador||"Casa "+casa).split(" ")[0];
    const r=div({style:{fontSize:11,padding:"4px 8px",borderBottom:"1px solid #f8f8f8",display:"flex",gap:8,alignItems:"center"}});
    r.innerHTML=`<span style="color:#8B8FA8;min-width:50px">${mesNome}</span><span style="font-weight:700;flex:1">${nome}</span><span style="background:#EFF6FF;color:#3B82F6;borderRadius:6px;padding:"2px 6px">${evs.length} banho(s)</span>`;
    prev.appendChild(r);
  });
  if(totalTutores>30){const m=div({style:{textAlign:"center",padding:"6px",color:"#8B8FA8",fontSize:11}});m.textContent="... e mais "+(totalTutores-30)+" combinações";prev.appendChild(m);}
  cont.appendChild(prev);

  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"16px",background:"linear-gradient(135deg,#3B82F6,#60a5fa)",color:"#fff",fontSize:15,fontWeight:700,borderRadius:14,marginBottom:10},onClick:()=>{
    updSilent(d=>{
      const nd={...d};
      if(!nd.cobrancas2)nd.cobrancas2={};
      evsFiltrados.forEach(ev=>{
        const dObj=new Date(ev.data+"T12:00:00");
        const mesNome=MESES[dObj.getMonth()];
        const casaNum=Number(ev.casa);
        const casaObj=(nd.casas2||{})[casaNum]||{};
        const valorRef=getValorPetFromCobs(casaNum,ev.pet)||parseFloat(ev.valorCustom)||0;
        if(!nd.cobrancas2[mesNome])nd.cobrancas2[mesNome]={};
        if(!nd.cobrancas2[mesNome][casaNum])nd.cobrancas2[mesNome][casaNum]={atendimentos:[],pago:false};
        // Verifica duplicata pelo id do evento da agenda
        const jaExiste=(nd.cobrancas2[mesNome][casaNum].atendimentos||[]).some(a=>a.agendaId===ev.id);
        if(!jaExiste){
          const novoAt={
            id:Date.now()+Math.random(),
            agendaId:ev.id,
            data:ev.data,

      const casa=casas2[cid]||{};

      inadimplentes.push({cid,casa,cb,ats,totalPendente,tel});

    const comTel=inadimplentes.filter(i=>i.tel.length>=8);

      previewWrap.appendChild(btn({style:{width:"100%",padding:"14px",background:"linear-gradient(135deg,#25D366,#128C7E)",color:"#fff",fontSize:14,fontWeight:800,borderRadius:14,marginBottom:8,display:"flex",alignItems:"center",justifyContent:"center",gap:10},onClick:()=>{

          let msg=`🐾 PLANET DOGS\n📅 ${mes}\nOlá ${casa.morador||""}!\n\n`;
          msg+=`✂️ Banhos pendentes:\n`;
          atsPend.forEach(at=>{
            msg+=`📅 ${fmtD(at.data)} — R$ ${totAts([at]).toFixed(2)}\n`;
          });
          msg+=`\n💰 Total: *R$ ${totalPendente.toFixed(2)}*\n\nObrigado! 🐾`;
          window.open("https://api.whatsapp.com/send?phone=55"+tel+"&text="+encodeURIComponent(msg),"_blank");

// ── CADASTRAR CASA ────────────────────────────────────────────────────────────
function getProxId(casas){
  // Gera próximo ID a partir de 15000 para novos clientes manuais
  const nums=Object.keys(casas).map(Number);
  let next=15000;
  while(nums.includes(next))next++;
  return next;
}

  infoD.textContent="Tutor salvo! Agora cadastre o(s) pet(s) desta casa.";
  cont.appendChild(infoD);

  // ── Coleta raças já cadastradas no banco (modelos + atendimentos) ─────────────
  function getRacasConhecidas(){
    const racas=new Set();
    // dos modelos
    Object.values(DATA.modelos||{}).forEach(lista=>{
      (lista||[]).forEach(p=>{if(p.raca&&p.raca.trim())racas.add(p.raca.trim());});
    });
    // dos atendimentos (cobrancas + cobrancas2)
    [DATA.cobrancas,DATA.cobrancas2||{}].forEach(src=>{
      Object.values(src||{}).forEach(cbMes=>{
        Object.values(cbMes||{}).forEach(cb=>{
          (cb.atendimentos||[]).forEach(at=>{
            (at.caes||[]).forEach(c=>{if(c.raca&&c.raca.trim())racas.add(c.raca.trim());});
          });
        });
      });
    });
    // das casas (campo pets)
    [...Object.values(DATA.casas||{}),...Object.values(DATA.casas2||{})].forEach(casa=>{
      (casa.pets||[]).forEach(p=>{if(p.raca&&p.raca.trim())racas.add(p.raca.trim());});
    });
    return [...racas].sort((a,b)=>a.localeCompare(b));

  // datalist compartilhado entre todos os campos de raça
  const dlId="raca-dl-"+Date.now();
  const dl=h("datalist",{id:dlId});

function importarClientesVetus(onDone){
  const casas2={...(DATA.casas2||{})};
  const telMap={};const nomeMap={};
  Object.values(casas2).forEach(c=>{
    const t=(c.telefone||"").replace(/\D/g,"");
    if(t.length>=8){telMap[t]=c;if(t.length>8)telMap[t.slice(-9)]=c;telMap[t.slice(-8)]=c;}
    if(c.morador)nomeMap[c.morador.toLowerCase().trim()]=c;
  });
  const novos=[];const atualizados=[];
  VETUS_CLIENTES.forEach(cli=>{
    const td=(cli.telefone||"").replace(/\D/g,"");
    const nk=(cli.nome||"").toLowerCase().trim();
    let ex=null;
    if(td.length>=8)ex=telMap[td]||telMap[td.slice(-9)]||telMap[td.slice(-8)];
    if(!ex)ex=nomeMap[nk];
    if(ex)atualizados.push({casa:ex,cli});
    else novos.push(cli);
  });
  const semId=VETUS_SEM_ID.filter(item=>!nomeMap[(item.nome||"").toLowerCase().trim()]);
  const totalN=novos.length+semId.length;
  const cont=div();
  const info=div({style:{background:"#f0fdf4",border:"2px solid #2DC653",borderRadius:12,padding:"14px",marginBottom:14,fontSize:13,lineHeight:1.7}});
  info.innerHTML=
    `<b style="color:#2DC653">✅ ${novos.length} novos</b> com ID Vetus + telefone<br>`+
    (semId.length?`<b style="color:#FFD93D">⚠️ ${semId.length} novos</b> sem ID Vetus<br>`:"")+
    (atualizados.length?`<b style="color:#3B82F6">📝 ${atualizados.length} existentes</b> tel atualizado<br>`:"")+
    `<span style="color:#6B7280;font-size:12px">ID Vetus preservado. Match por telefone ou nome.</span>`;
  cont.appendChild(info);
  const prev=div({style:{maxHeight:190,overflowY:"auto",marginBottom:14,border:"1px solid #f0f0f0",borderRadius:10,padding:"6px"}});
  novos.slice(0,20).forEach(cli=>{
    const r=div({style:{fontSize:11,padding:"4px 8px",borderBottom:"1px solid #f8f8f8",display:"flex",gap:8}});
    r.innerHTML=`<span style="color:#8B8FA8;min-width:40px">#${cli.id}</span><span style="font-weight:700">${cli.nome}</span><span style="color:#8B8FA8">${cli.telefone||""}</span>`;
    prev.appendChild(r);
  });
  if(totalN>20){const m=div({style:{textAlign:"center",padding:"6px",color:"#8B8FA8",fontSize:11}});m.textContent="... e mais "+(totalN-20);prev.appendChild(m);}
  cont.appendChild(prev);
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"15px",background:"linear-gradient(135deg,#3B82F6,#60a5fa)",color:"#fff",fontSize:15,fontWeight:700,borderRadius:14,marginBottom:10},onClick:()=>{
    const nc={...(DATA.casas2||{})};
    novos.forEach(cli=>{nc[cli.id]={numero:cli.id,morador:cli.nome,telefone:cli.telefone};}); 
    let nid=getProxId(nc);
    semId.forEach(item=>{nc[nid]={numero:nid,morador:item.nome,telefone:""};nid++;});
    atualizados.forEach(({casa,cli})=>{nc[casa.numero]={...nc[casa.numero],telefone:cli.telefone||nc[casa.numero].telefone};});
    updSilent(d=>(({...d,casas2:nc})));
    DATA=loadData();if(mv)mv.remove();
    alert("✅ "+novos.length+" novos com ID Vetus\n⚠️ "+semId.length+" sem ID Vetus\n📝 "+atualizados.length+" atualizados");
    onDone();
  }},"👤 Importar "+totalN+" clientes"));
  cont.appendChild(btn({style:{width:"100%",padding:"13px",background:"#f5f5f5",color:"#666",borderRadius:12},onClick:()=>{if(mv)mv.remove();}},"Cancelar"));
  mv=openModal("Importar Clientes do Vetus",cont,()=>{});
}

function importarPetsVetus(onDone){
  const casas2={...(DATA.casas2||{})};
  const idMap={};
  Object.values(casas2).forEach(c=>{if(c.numero)idMap[String(c.numero)]=c;});
  const updates=[];let totalPets=0;
  VETUS_CLIENTES.forEach(cli=>{
    const casa=idMap[String(cli.id)];if(!casa)return;
    const vetPets=(VETUS_PETS[String(cli.id)])||[];if(!vetPets.length)return;
    const petsAtuais=casa.pets||[];
    const nomesAtuais=new Set(petsAtuais.map(p=>p.nome.toLowerCase()));
    const petsNovos=vetPets
      .filter(p=>p.nome&&!nomesAtuais.has(p.nome.toLowerCase()))
      .map(p=>{return {
        nome:p.nome,raca:p.raca,sexo:p.sexo,nasc:p.nasc,peso:p.peso,
        valorRef:p.ultimo_valor>0?p.ultimo_valor:0,
        servicoRef:p.ultimo_servico,ultimaData:p.ultima_data
      };});
    if(petsNovos.length){updates.push({numero:casa.numero,petsNovos,petsAtuais});totalPets+=petsNovos.length;}
  });
  if(!totalPets){alert("Nenhum pet novo encontrado.\nImporte os clientes primeiro com o botão 👤 Clientes.");return;}
  const cont=div();
  const info=div({style:{background:"#fff5f9",border:"2px solid #FF6B9D",borderRadius:12,padding:"14px",marginBottom:14,fontSize:13,lineHeight:1.7}});
  info.innerHTML=`<b style="color:#FF6B9D">🐾 ${totalPets} pets</b> para importar em <b>${updates.length} tutores</b><br><span style="color:#6B7280;font-size:12px">Último valor de serviço registrado no Vetus preservado como referência.</span>`;
  cont.appendChild(info);
  const prev=div({style:{maxHeight:240,overflowY:"auto",marginBottom:14,border:"1px solid #f0f0f0",borderRadius:10,padding:"6px"}});
  let shown=0;
  updates.forEach(({numero,petsNovos})=>{
    if(shown>=40)return;
    const casa=(DATA.casas2||{})[numero];
    const tutor=casa?casa.morador.split(" ")[0]:"?";
    petsNovos.slice(0,3).forEach(p=>{
      if(shown>=40)return;
      const r=div({style:{fontSize:11,padding:"4px 8px",borderBottom:"1px solid #f8f8f8",display:"flex",justifyContent:"space-between",gap:6,alignItems:"center"}});
      const val=p.valorRef>0?`<b style="color:#2DC653">R$ ${p.valorRef.toFixed(2)}</b>`:`<span style="color:#ccc">s/val</span>`;
      r.innerHTML=`<span style="color:#8B8FA8;font-size:10px;min-width:45px">${tutor}</span><span style="font-weight:700;flex:1">${p.nome}</span><span style="color:#8B8FA8;font-size:10px;flex:1">${p.raca}</span>${val}`;
      prev.appendChild(r);shown++;
    });
  });
  if(totalPets>40){const m=div({style:{textAlign:"center",padding:"6px",color:"#8B8FA8",fontSize:11}});m.textContent="... e mais "+(totalPets-shown)+" pets";prev.appendChild(m);}
  cont.appendChild(prev);
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"15px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:15,fontWeight:700,borderRadius:14,marginBottom:10},onClick:()=>{
    const nc={...(DATA.casas2||{})};
    updates.forEach(({numero,petsNovos,petsAtuais})=>{nc[numero]={...nc[numero],pets:[...petsAtuais,...petsNovos]};});
    updSilent(d=>(({...d,casas2:nc})));
    DATA=loadData();if(mv)mv.remove();
    alert("✅ "+totalPets+" pets importados em "+updates.length+" tutores!");
    onDone();
  }},"🐾 Importar "+totalPets+" pets"));
  cont.appendChild(btn({style:{width:"100%",padding:"13px",background:"#f5f5f5",color:"#666",borderRadius:12},onClick:()=>{if(mv)mv.remove();}},"Cancelar"));
  mv=openModal("Importar Pets do Vetus",cont,()=>{});
}
function renderCadCasa(titulo,pref){

    :upd(d=>({...d,casas2:{...d.casas2||{},[n]:{numero:n,morador:m,telefone:t}},enderecos:{...d.enderecos,[n]:end}}));

    btn({style:{background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",padding:"8px 10px",fontSize:11,borderRadius:11,fontWeight:700},onClick:()=>importarPetsVetus(()=>{DATA=loadData();})},"🐾 Pets")

        const row=div({style:{display:"flex",alignItems:"center",gap:8,background:editandoId===n?"#EFF6FF":"#FFF5F9",border:"1.5px solid "+(editandoId===n?"#3B82F6":"#FFE4EF"),borderRadius:12,padding:"10px 12px",cursor:"pointer"}});

        const excluirBtn=btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"6px 10px",fontSize:11,borderRadius:10,fontWeight:800,flexShrink:0},onClick:(e)=>{
          e.stopPropagation();

          updSilent(d=>{
            const nd={...d};
            // Remove do cadastro

            ["cobrancas","cobrancas2"].forEach(k=>{

    idAviso.textContent="Se não preencher, ID será gerado automaticamente a partir de 15000";

    const numEndInp=inp({className:"fi",placeholder:"Numero",type:"number",style:{marginBottom:10}});
    const bairroSel=sel({className:"fi",style:{marginBottom:20}},[{v:"",l:"Selecione o bairro..."},{v:"Terra Ville",l:"Terra Ville"},{v:"Lami",l:"Lami"},{v:"Chapeu do Sol",l:"Chapeu do Sol"},{v:"Ponta Grossa",l:"Ponta Grossa"},{v:"Lajeado",l:"Lajeado"},{v:"Belem Novo",l:"Belem Novo"},{v:"Restinga",l:"Restinga"},{v:"Outro",l:"Outro"}]);

    const limparBtn=btn({style:{display:"none",width:"100%",padding:"9px",background:"#f5f5f5",color:"#8B8FA8",borderRadius:10,fontSize:12,marginBottom:10},onClick:()=>{
      editandoId=null;numInp.value="";morInp.value="";telInp.value="";ruaInp.value="";numEndInp.value="";bairroSel.value="";

    [lbl(idLabel),numInp,idAviso,lbl("Tutor"),morInp,lbl("Telefone"),telInp,
     lbl("Rua"),ruaInp,lbl("Número do Endereço"),numEndInp,lbl("Bairro"),bairroSel,
     limparBtn
    ].forEach(el=>card.appendChild(el));

    let okT=null;
    const svBtn=btn({style:{width:"100%",padding:"16px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:16,borderRadius:16},onClick:()=>{
      if(!morInp.value.trim()){alert("Preencha o nome do tutor!");return;}
      let novoN;
      if(numInp.value.trim()===""){
        if(!isCad2){alert("Preencha o número!");return;}

          const casaKey=pref==="cad1"?"casas":"casas2";

          if(nd.enderecos){nd.enderecos={...nd.enderecos};if(nd.enderecos[antigId]){nd.enderecos[novoN]=nd.enderecos[antigId];delete nd.enderecos[antigId];}}
          ["cobrancas","cobrancas2"].forEach(k=>{
            if(!nd[k])return;nd[k]={...nd[k]};
            MESES.forEach(m=>{if(nd[k][m]&&nd[k][m][antigId]){nd[k][m]={...nd[k][m]};nd[k][m][novoN]=nd[k][m][antigId];delete nd[k][m][antigId];}});

    function carregarParaEdicao(n){

function renderGrade(titulo,pref,mes){
  const casas=pref==="cad1"?DATA.casas:DATA.casas2||{};

  const cbMes=cobs[mes]||{};
  const w=div({className:"screen"});
  w.appendChild(mkHdr(titulo+" - "+mes,()=>go(pref+"_meses"),btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"9px 13px",fontSize:13,borderRadius:12},onClick:()=>go(pref+"_casa")},pref==="cad2"?"+ Cliente":"+ Casa")));
  const nums=Object.keys(casas).map(Number).sort((a,b)=>a-b);
  let tG=0,tP=0;
  nums.forEach(n=>{const cb=cbMes[n]||{};const s=totAts(cb.atendimentos);tG+=s;if(cb.pago)tP+=s;});
  const body=div({style:{padding:"10px 18px 40px"}});
  if(nums.length>0){
    const sm=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}});
    [{l:"Total",v:tG,c:"#FF6B9D",bg:"#FFF5F9"},{l:"Pago",v:tP,c:"#2DC653",bg:"#e8fbed"},{l:"Pendente",v:tG-tP,c:"#e53e3e",bg:"#fff0f0"}].forEach(it=>{
      const s=div({className:"card",style:{padding:"10px 11px",background:it.bg}});
      s.innerHTML=`<div style="font-size:10px;font-weight:700;color:${it.c};text-transform:uppercase">${it.l}</div><div style="font-size:13px;font-weight:800;color:${it.c};margin-top:2px">R$ ${it.v.toFixed(2)}</div>`;
      sm.appendChild(s);
    });
    body.appendChild(sm);
  }
  if(nums.length===0){body.innerHTML='<div style="text-align:center;padding:60px 0;color:#8B8FA8"><div style="font-size:48px">🏠</div><p style="font-weight:700;margin-top:10px">Nenhuma casa cadastrada</p></div>';w.appendChild(body);return w;}

  // ── Filtros ────────────────────────────────────────────────────────────────
  let filtroAtivo="todos";
  const filtros=[
    {k:"todos",l:"Todos",emoji:""},
    {k:"pago",l:"Pago",emoji:"✅"},
    {k:"pendente",l:"Pendente",emoji:"⚠️"},
    {k:"enviado",l:"Enviado",emoji:"📨"},
    {k:"sembanho",l:"Sem banho",emoji:"🛁"},
  ];
  const filtroBand=div({style:{display:"flex",gap:7,flexWrap:"wrap",marginBottom:10}});
  const grid=div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:11}});

  function buildGrid(){
    grid.innerHTML="";
    nums.forEach(num=>{
      const cb=cbMes[num]||{};const ats=cb.atendimentos||[];const sub=totAts(ats);
      const isPago=!!cb.pago;
      const isEnviado=!!cb.notaEnviada&&!isPago;
      const isSemBanho=ats.length===0;
      const isPendente=!isPago&&!isSemBanho;
      if(filtroAtivo==="pago"&&!isPago)return;
      if(filtroAtivo==="pendente"&&(!isPendente||isSemBanho))return;
      if(filtroAtivo==="enviado"&&!isEnviado)return;
      if(filtroAtivo==="sembanho"&&!isSemBanho)return;
      let bColor="#FFE4EF",sBg="#fff0f0",sColor="#e53e3e",sTxt="Pendente";
      if(isPago){bColor="#2DC653";sBg="#e8fbed";sColor="#2DC653";sTxt="Pago";}
      else if(isEnviado){bColor="#FFD93D";sBg="#FFFBEE";sColor="#E8A000";sTxt="Enviado";}
      else if(isSemBanho){bColor="#FFE4EF";sBg="#f9f9f9";sColor="#8B8FA8";sTxt="Sem banho";}
      const c=div({className:"btn card",style:{padding:"13px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:5,borderTop:"4px solid "+bColor,cursor:"pointer"}});
      let _sx=0,_sy=0,_mv=false;
      c.addEventListener("touchstart",e=>{_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;_mv=false;},{passive:true});
      c.addEventListener("touchmove",e=>{if(Math.abs(e.touches[0].clientX-_sx)>6||Math.abs(e.touches[0].clientY-_sy)>6)_mv=true;},{passive:true});
      c.addEventListener("touchend",e=>{if(!_mv){e.preventDefault();go(pref+"_det",{mes,num:num});}},{passive:false});
      c.addEventListener("click",()=>go(pref+"_det",{mes,num:num}));
      const vetusNum=num>=10001?num-10000:num;
      const labelTopo=pref==="cad2"?`<div style="font-family:'Fredoka One',sans-serif;font-size:13px;color:${isPago?"#2DC653":"#FF6B9D"}">ID ${vetusNum}</div>`:`<div style="font-family:'Fredoka One',sans-serif;font-size:18px;color:${isPago?"#2DC653":"#FF6B9D"}">🏠${num}</div>`;
      c.innerHTML=`${labelTopo}<div style="font-weight:700;color:#1A1A2E;font-size:11px;text-align:center">${casas[num]?.morador?casas[num].morador.split(" ")[0]:""}</div>${ats.length>0?`<div style="font-weight:800;color:${isPago?"#2DC653":"#FF6B9D"};font-size:12px">R$ ${sub.toFixed(2)}</div><div style="font-size:10px;color:#8B8FA8">${ats.length} banho${ats.length>1?"s":""}</div>`:'<div style="font-size:10px;color:#8B8FA8">Sem banhos</div>'}<div style="font-size:10px;font-weight:700;color:${sColor};background:${sBg};padding:2px 6px;border-radius:8px;width:100%;text-align:center">${sTxt}</div>`;
      grid.appendChild(c);
    });
  }

  function buildFiltros(){
    filtroBand.innerHTML="";
    filtros.forEach(f=>{
      const ativo=filtroAtivo===f.k;
      const fb=btn({style:{padding:"7px 13px",borderRadius:20,fontSize:12,fontWeight:800,background:ativo?"#1A1A2E":"#fff",color:ativo?"#fff":"#1A1A2E",border:"2px solid "+(ativo?"#1A1A2E":"#FFE4EF"),whiteSpace:"nowrap"}},
        (f.emoji?(f.emoji+" "):"")+f.l);
      let _fsx=0,_fsy=0,_fmv=false;
      fb.addEventListener("touchstart",e=>{_fsx=e.touches[0].clientX;_fsy=e.touches[0].clientY;_fmv=false;},{passive:true});
      fb.addEventListener("touchmove",e=>{if(Math.abs(e.touches[0].clientX-_fsx)>6||Math.abs(e.touches[0].clientY-_fsy)>6)_fmv=true;},{passive:true});
      fb.addEventListener("touchend",e=>{if(!_fmv){e.preventDefault();filtroAtivo=f.k;buildFiltros();buildGrid();}},{passive:false});
      fb.addEventListener("click",()=>{filtroAtivo=f.k;buildFiltros();buildGrid();});
      filtroBand.appendChild(fb);
    });
  }

  buildFiltros();
  buildGrid();
  body.appendChild(filtroBand);
  body.appendChild(grid);
  w.appendChild(body);return w;
}

    sc.appendChild(nB);

      // Vendas não pagas deste tutor (sem campo pago = não pago)
      const vendasTutor=(DATA.vendas||[]).filter(v=>Number(v.casaNum)===Number(numero)&&!v.pago);
      const totalVendas=vendasTutor.reduce((s,v)=>s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1),0);

      // WA Completo — atendimentos NÃO pagos + vendas não pagas
      const montaCompleto=()=>{
        const atsPendentes=ats.filter(at=>!at.pago);
        const totalPendente=atsPendentes.reduce((s,at)=>s+totAts([at]),0);
        const totalGeral=totalPendente+totalVendas;
        if(totalGeral===0)return encodeURIComponent(`🐾 PLANET DOGS\n📅 ${mes}\nOlá ${casa.morador||""}\n\n✅ Tudo em dia! Nenhum pendente.\n\n💚 Obrigado pela confiança!`);
        let msg=`🐾 PLANET DOGS\n📅 ${mes}\nOlá ${casa.morador||""}\n\n`;

          msg+=`✂️ BANHOS PENDENTES\n`;

            const sub=totAts([at]);
            msg+=`📅 ${fmtD(at.data)} - R$ ${sub.toFixed(2)}\n`;
            at.caes.forEach(c=>{
              msg+=`  🐶 ${c.nome||"Pet"}${c.raca?" ("+c.raca+")":""}\n     ${(c.servicos||[]).map(sv=>sv.nome+" R$"+parseFloat(sv.valor||0).toFixed(2)).join(" | ")}\n`;
            });
          });

        if(vendasTutor.length>0){
          msg+=`\n🛍 PRODUTOS PENDENTES\n`;

          });
        }

        return encodeURIComponent(msg);

      // WA Resumo — só o total (banhos + vendas)
      const montaResumo=()=>{
        const atsPendentes=ats.filter(at=>!at.pago);
        const totalPendente=atsPendentes.reduce((s,at)=>s+totAts([at]),0);
        const totalGeral=totalPendente+totalVendas;
        if(totalGeral===0)return encodeURIComponent(`🐾 PLANET DOGS\n📅 ${mes}\nOlá ${casa.morador||""}!\n\n✅ Está tudo em dia, obrigado! 💚`);

        if(totalPendente>0)msg+=`✂️ Banhos: *R$ ${totalPendente.toFixed(2)}*\n`;
        if(totalVendas>0)msg+=`🛍 Produtos: *R$ ${totalVendas.toFixed(2)}*\n`;
        msg+=`\n💰 Total pendente: *R$ ${totalGeral.toFixed(2)}*\n\nObrigado! 🐾`;
        return encodeURIComponent(msg);
      };

      waR.appendChild(btn({style:{padding:"11px",background:"#25D366",color:"#fff",borderRadius:12,fontSize:12,fontWeight:800},onClick:()=>window.open("https://api.whatsapp.com/send?phone=55"+tel+"&text="+montaCompleto(),"_blank")},"WA Completo"));
      waR.appendChild(btn({style:{padding:"11px",background:"#128C7E",color:"#fff",borderRadius:12,fontSize:12,fontWeight:800},onClick:()=>window.open("https://api.whatsapp.com/send?phone=55"+tel+"&text="+montaResumo(),"_blank")},"WA Resumo"));
      sc.appendChild(waR);
    }
    body.appendChild(sc);
    if(ats.length===0){const emp=div({style:{textAlign:"center",padding:"40px 0",color:"#8B8FA8"}});emp.innerHTML='<div style="font-size:44px">🛁</div><p style="font-weight:700;margin-top:10px">Nenhum banho este mes</p>';body.appendChild(emp);}

      const r=div({style:{display:"flex",alignItems:"center",gap:8}});

      r.appendChild(tog(atPago,v=>{const c2=getCob();saveCob(mes,numero,{...c2,atendimentos:(c2.atendimentos||[]).map(a=>a.id===at.id?{...a,pago:v}:a)});build();}));
      r.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"7px 11px",borderRadius:10,fontSize:12},onClick:()=>{if(confirm("Apagar?")){const c2=getCob();saveCob(mes,numero,{...c2,atendimentos:(c2.atendimentos||[]).filter(a=>a.id!==at.id)});build();}}},"Del"));
      top2.appendChild(inf);top2.appendChild(r);card.appendChild(top2);

      at.caes.forEach((c,ci)=>{const cd=div({style:{marginBottom:ci<at.caes.length-1?8:0}});cd.innerHTML=`<span style="font-weight:800;color:#1A1A2E;font-size:13px">🐶 ${c.nome||"?"}${c.raca?" - "+c.raca:""}</span><span style="color:#8B8FA8;font-size:12px;margin-left:8px">${(c.servicos||[]).map(sv=>sv.nome+" R$"+parseFloat(sv.valor||0).toFixed(2)).join(" | ")}</span>`;bot.appendChild(cd);});
      card.appendChild(bot);body.appendChild(card);

    // ── SEÇÃO DE VENDAS (dentro do build, sobrevive ao body.innerHTML="") ──

    const totVPend=totVG-totVP;
    const sepV=div({style:{height:"2px",background:"linear-gradient(to right,#9B59B6,#c084fc)",borderRadius:2,margin:"18px 0 12px"}});
    body.appendChild(sepV);
    const hdrVs=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}});
    hdrVs.innerHTML=`<div style="font-family:'Fredoka One',sans-serif;font-size:17px;color:#9B59B6">🛍 Produtos / Vendas</div>`;
    const addVBtn2=btn({style:{background:"linear-gradient(135deg,#9B59B6,#c084fc)",color:"#fff",padding:"8px 14px",borderRadius:12,fontSize:13,fontWeight:800},onClick:()=>abrirVendaModal(null,()=>{DATA=loadData();build();},numero,pref)},"+ Venda");

  function refreshFab(){
    fab.innerHTML="";
    if((getCob().atendimentos||[]).length>0)fab.appendChild(repBtn);

  // re-refresh após build

// ── AGENDA ────────────────────────────────────────────────────────────────────
function renderAgenda(gerente){
  const w=div({className:"screen"});
  const gwa=DATA.gruposWA||{};
  const grpBtn=btn({style:{background:"rgba(255,255,255,.35)",color:"#1A1A2E",padding:"8px 12px",fontSize:12,borderRadius:10},onClick:()=>abrirGruposModal()},"📲 Grupos");

  else w.appendChild(mkHdr("Agenda",()=>go("home"),grpBtn));

  let diaSel=hoje();
  let filtroStatus="todos";

  // ── Container principal (sem padding-bottom no wrapper, adicionamos abaixo)
  const calWrap=div({style:{padding:"0 14px 120px"}});

    calSection.innerHTML="";

    calSection.appendChild(navRow);

    const wd=div({style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}});

  function buildEvs(){
    evSection.innerHTML="";

    // Cabeçalho dia selecionado
    const dSelObj=new Date(diaSel+"T12:00:00");
    const diaSemanaNome=DIAS_FULL[dSelObj.getDay()];

    dayInfo.appendChild(h("span",{style:{fontFamily:"'Fredoka One',sans-serif",fontSize:19,color:"#1A1A2E",lineHeight:1.1}},fmtD(diaSel)));
    dayInfo.appendChild(h("span",{style:{fontSize:11,fontWeight:800,color:isHoje?"#FF6B9D":"#8B8FA8",textTransform:"uppercase",letterSpacing:.8}},isHoje?"📅 Hoje - "+diaSemanaNome:diaSemanaNome));
    dayHdr.appendChild(dayInfo);
    const agBtn=btn({style:{background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",padding:"11px 18px",fontSize:14,borderRadius:14,fontWeight:800,display:"flex",alignItems:"center",gap:6,flexShrink:0,boxShadow:"0 2px 10px rgba(255,107,157,.35)"},onClick:()=>abrirAgModal(diaSel,buildEvs,getAllPets,gerente)});

    evSection.appendChild(dayHdr);

    const filtros=div({style:{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:4}});
    [{k:"todos",l:"Todos",e:"📋"},{k:"pendente",l:"Pendente",e:"🟡"},{k:"servico",l:"Em Servico",e:"🔵"},{k:"finalizado",l:"Finalizado",e:"🟢"}].forEach(f=>{
      const isA=filtroStatus===f.k;
      filtros.appendChild(btn({style:{flexShrink:0,padding:"8px 13px",fontSize:12,fontWeight:800,background:isA?"#FF6B9D":"#fff",color:isA?"#fff":"#1A1A2E",border:"1.5px solid "+(isA?"#FF6B9D":"#FFE4EF"),borderRadius:20,whiteSpace:"nowrap"},onClick:()=>{filtroStatus=f.k;buildEvs();}},f.e+" "+f.l));
    });
    evSection.appendChild(filtros);

    // Lista eventos
    const evsDia=(DATA.agenda||[]).filter(a=>a.data===diaSel);
    if(evsDia.length===0){
      evSection.appendChild(div({style:{textAlign:"center",padding:"20px 0",color:"#8B8FA8",fontSize:13}},"Nenhum agendamento neste dia"));
      return;
    }
    const grupos=[];const vistos=new Set();
    evsDia.forEach(ev=>{
      if(vistos.has(ev.id))return;
      const irmaos=evsDia.filter(e=>e.casa===ev.casa&&e.func===ev.func&&e.hora===ev.hora);
      irmaos.forEach(e=>vistos.add(e.id));grupos.push(irmaos);
    });
    const gruposFiltrados=filtroStatus==="todos"?grupos:grupos.filter(g=>(g[0].statusCor||"pendente")===filtroStatus);
    if(gruposFiltrados.length===0){evSection.appendChild(div({style:{textAlign:"center",padding:"20px 0",color:"#8B8FA8",fontSize:13}},"Nenhum com este filtro"));return;}

    gruposFiltrados.forEach((grupo,gi)=>{
      const rep=grupo[0];
      const statusAtual=rep.statusCor||"pendente";const sc2=STATUS_CORES[statusAtual]||STATUS_CORES.pendente;
      const card=div({className:"card anim",style:{marginBottom:8,animationDelay:gi*20+"ms",borderLeft:"5px solid "+sc2.faixa,background:sc2.bg}});
      const inner=div({style:{padding:"12px 14px"}});
      const petsWrap=div();
      function buildPetsWrap(){
        petsWrap.innerHTML="";
        const grpAtual=(DATA.agenda||[]).filter(a=>grupo.some(g=>g.id===a.id));
        grpAtual.forEach(ev=>{
          const val=getValorEvento(ev);
          const petRow=div({style:{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}});
          petRow.appendChild(h("span",{style:{fontWeight:800,color:"#1A1A2E",fontSize:14}},ev.pet||"Pet"));
          if(!gerente){
            const valBtn=btn({style:{background:val>0?"#e8fbed":"#fff0f0",color:val>0?"#2DC653":"#e53e3e",fontWeight:800,fontSize:12,padding:"2px 8px",borderRadius:8,border:"1px solid "+(val>0?"#2DC653":"#ffcdd2")},onClick:()=>abrirValorModal(ev,()=>{DATA=loadData();buildPetsWrap();})},val>0?"R$ "+val.toFixed(2):"+ Valor");
            petRow.appendChild(valBtn);
          }
          // botão remover pet do grupo
          petRow.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",fontWeight:800,fontSize:11,padding:"2px 7px",borderRadius:8,border:"1px solid #ffcdd2"},onClick:()=>{if(grpAtual.length<=1){alert("Grupo precisa ter ao menos 1 pet.");return;}updSilent(d=>({...d,agenda:d.agenda.filter(a=>a.id!==ev.id)}));DATA=loadData();buildPetsWrap();}},"✕"));
          petsWrap.appendChild(petRow);
        });
        // botão + Pet
        const addPetBtn=btn({style:{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",background:"#FFF5F9",color:"#FF6B9D",border:"2px dashed #FF6B9D",borderRadius:10,fontSize:12,fontWeight:800,marginTop:4},onClick:()=>abrirAddPetGrupoModal(rep,grpAtual,buildPetsWrap,gerente)},[h("span",{},"＋")," Pet"]);
        petsWrap.appendChild(addPetBtn);
      }
      // Endereço em cor gelo no topo do card (antes dos pets)
      const endStrTop=(rep.endereco||"").trim();
      if(endStrTop){
        const endTopRow=div({style:{fontSize:11,color:"#B0BEC5",fontWeight:600,marginBottom:5,letterSpacing:.3}},endStrTop);
        inner.appendChild(endTopRow);
      }
      buildPetsWrap();
      inner.appendChild(petsWrap);
      inner.appendChild(div({style:{fontSize:11,color:"#8B8FA8",marginTop:3}},"Casa "+rep.casa+(rep.morador?" - "+rep.morador:"")));
      const acts=div({style:{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}});
      const todosBaixados=grupo.every(e=>e.buscado);
      if(!todosBaixados)acts.appendChild(btn({style:{padding:"8px 12px",background:"linear-gradient(135deg,#FFD93D,#E8A000)",color:"#fff",borderRadius:10,fontSize:12,fontWeight:800},onClick:()=>{
        const ids=new Set(grupo.map(e=>e.id));
        const grupoAtual=(DATA.agenda||[]).filter(a=>ids.has(a.id));
        abrirPagamentoModal(grupoAtual.length>0?grupoAtual:grupo,buildEvs,DATA.gruposWAPag||{},true); // true = sem WA
      }},"✓ Dar Baixa"));
      else acts.appendChild(div({style:{padding:"8px 10px",background:"#e8fbed",color:"#2DC653",borderRadius:10,fontSize:11,fontWeight:800,border:"1px solid #2DC653"}},"✅ Baixado"));
      acts.appendChild(btn({style:{background:"#EFF6FF",color:"#3B82F6",padding:"7px 10px",borderRadius:10,fontSize:12,fontWeight:800},onClick:()=>abrirEditDataModal(grupo,buildEvs)},"📅"));
      acts.appendChild(btn({style:{background:"#f5f5f5",color:rep.vetus?"#444":"#bbb",padding:"7px 10px",borderRadius:10,fontSize:12,fontWeight:700,border:"1px solid #ddd"},onClick:()=>{const ids=new Set(grupo.map(e=>e.id));updSilent(d=>({...d,agenda:d.agenda.map(a=>ids.has(a.id)?{...a,vetus:!rep.vetus}:a)}));buildEvs();}},rep.vetus?"V✓":"V"));
      acts.appendChild(btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"7px 10px",borderRadius:10,fontSize:12},onClick:()=>{if(confirm("Apagar?")){updSilent(d=>({...d,agenda:d.agenda.filter(a=>!grupo.map(e=>e.id).includes(a.id))}));DATA=loadData();buildEvs();}}},"🗑️"));
      inner.appendChild(acts);
      const stRow=div({style:{display:"flex",gap:5,marginTop:8}});
      Object.entries(STATUS_CORES).forEach(([k,v])=>{
        const isA=statusAtual===k;
        stRow.appendChild(btn({style:{flex:1,padding:"6px 4px",fontSize:10,fontWeight:800,background:isA?v.faixa:"#f5f5f5",color:isA?"#fff":"#8B8FA8",borderRadius:8,border:"2px solid "+(isA?v.faixa:"#eee")},onClick:()=>{const ids=new Set(grupo.map(e=>e.id));updSilent(d=>({...d,agenda:d.agenda.map(a=>ids.has(a.id)?{...a,statusCor:k}:a)}));buildEvs();}},v.emoji+" "+v.label));
      });
      inner.appendChild(stRow);
      const mapRow=div({style:{marginTop:8,paddingTop:8,borderTop:"1px solid #FFE4EF",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}});
      const endStr=rep.endereco||"";
      mapRow.appendChild(div({style:{flex:1,fontSize:11,color:"#8B8FA8",minWidth:50,wordBreak:"break-word"}},endStr||"Sem endereco"));
      if(endStr)mapRow.appendChild(h("a",{href:mapsUrl(endStr),target:"_blank",style:{background:"#4285F4",color:"#fff",padding:"7px 10px",borderRadius:10,fontWeight:800,fontSize:11,textDecoration:"none",flexShrink:0}},"🗺 Maps"));
      mapRow.appendChild(btn({style:{background:"#FF6B9D",color:"#fff",padding:"7px 10px",borderRadius:10,fontWeight:800,fontSize:11,flexShrink:0},onClick:()=>{const ids=new Set(grupo.map(e=>e.id));const grupoAtual=(DATA.agenda||[]).filter(a=>ids.has(a.id));abrirWATelebusca(grupoAtual.length>0?grupoAtual:grupo,gwa);}},"🚗 Buscar"));
      if(!gerente)mapRow.appendChild(btn({style:{background:"#25D366",color:"#fff",padding:"7px 10px",borderRadius:10,fontWeight:800,fontSize:11,flexShrink:0},onClick:()=>{// Reler grupo atualizado do DATA (captura pets adicionados depois)
const ids=new Set(grupo.map(e=>e.id));const grupoAtual=(DATA.agenda||[]).filter(a=>ids.has(a.id));abrirPagamentoModal(grupoAtual.length>0?grupoAtual:grupo,buildEvs,gwa);}},"💬 WA"));
      inner.appendChild(mapRow);
      card.appendChild(inner);evSection.appendChild(card);
    });

    // ── Contador de pets do dia (pequeno, cor gelo, no final)
    const totalPetsDia=evsDia.reduce((s,ev)=>s+1,0);
    if(totalPetsDia>0){
      const ctr=div({style:{textAlign:"center",marginTop:10,padding:"8px",background:"#f0f4f8",borderRadius:12,color:"#94a3b8",fontSize:12,fontWeight:700,letterSpacing:".5px"}});
      ctr.textContent="🐾 "+totalPetsDia+" pet"+(totalPetsDia>1?"s":"")+" no dia";
      evSection.appendChild(ctr);
    }
  }

  function getAllPets(){
    const all={...DATA.casas,...DATA.casas2||{}};const pets=[];const visto=new Set();
    Object.entries(all).forEach(([num,casa])=>{
      const endObj=(DATA.enderecos||{})[num]||{};
      const endStr=endObj.rua?`${endObj.rua}, ${endObj.numero||""}, ${endObj.bairro||""}`:"";
      const vis=new Set();
      // 1) Pets dos atendimentos de cobrança (fonte original)
      [...Object.values(DATA.cobrancas||{}),...Object.values(DATA.cobrancas2||{})].forEach(cbM=>{
        const cb=cbM[num];if(!cb)return;
        (cb.atendimentos||[]).forEach(at=>(at.caes||[]).forEach(c=>{
          if(c.nome&&!vis.has(c.nome)){vis.add(c.nome);const uid=num+"_"+c.nome;if(!visto.has(uid)){visto.add(uid);pets.push({pet:c.nome,casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
        }));
      });
      // 2) Pets do campo modelos (cadastrados via modal de pets)
      const modPets=DATA.modelos?.[num]||[];
      modPets.forEach(p=>{
        if(p.nome&&!vis.has(p.nome)){vis.add(p.nome);const uid=num+"_"+p.nome;if(!visto.has(uid)){visto.add(uid);pets.push({pet:p.nome,casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
      });
      // 3) Pets do campo pets da casa (campo direto do cadastro)
      const casaPets=casa.pets||[];
      casaPets.forEach(p=>{
        if(p.nome&&!vis.has(p.nome)){vis.add(p.nome);const uid=num+"_"+p.nome;if(!visto.has(uid)){visto.add(uid);pets.push({pet:p.nome,casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
      });
      // 4) Se ainda não tem nenhum pet, exibe tutor para cadastrar
      if(vis.size===0){const uid=num+"_";if(!visto.has(uid)){visto.add(uid);pets.push({pet:"",casa:Number(num),morador:casa.morador||"",endereco:endStr,telefone:casa.telefone||"",});}}
    });
    return pets;
  }

  buildCal();
  return w;
}

// ── MODAL ADICIONAR PET AO GRUPO ─────────────────────────────────────────────
function abrirAddPetGrupoModal(rep,grupoAtual,onDone,gerente){
  const casaNum=rep.casa;
  const casaObj=(DATA.casas||{})[casaNum]||(DATA.casas2||{})[casaNum]||{};
  const telefone=casaObj.telefone||rep.telefone||"";
  const morador=casaObj.morador||rep.morador||"";
  const endObj=(DATA.enderecos||{})[casaNum]||{};
  const endStr=endObj.rua?`${endObj.rua}, ${endObj.numero||""}, ${endObj.bairro||""}`:(rep.endereco||"");

  // Coletar todos os pets do tutor (modelos + cobrancas + campo pets)
  const petsCadastrados=new Set();
  grupoAtual.forEach(e=>{if(e.pet)petsCadastrados.add(e.pet);});// já agendados
  const petsDisponiveis=[];
  const vistos=new Set(grupoAtual.map(e=>e.pet));

  // modelos
  (DATA.modelos?.[casaNum]||[]).forEach(p=>{if(p.nome&&!vistos.has(p.nome)){vistos.add(p.nome);petsDisponiveis.push({nome:p.nome,valor:getValorPetFromCobs(casaNum,p.nome)});}});
  // campo pets da casa
  (casaObj.pets||[]).forEach(p=>{if(p.nome&&!vistos.has(p.nome)){vistos.add(p.nome);petsDisponiveis.push({nome:p.nome,valor:getValorPetFromCobs(casaNum,p.nome)});}});
  // cobrancas

function abrirAgModal(dataInicial,onDone,getAllPets,gerente){
  gerente=gerente||IS_GERENTE;
  const pets=getAllPets();
  let selIdxs=[];let funcIdx=0;let servicoSel="Banho";
  let petsFiltrados=pets;
  const cont=div();
  const dI=inp({className:"fi",type:"date",value:dataInicial,style:{marginBottom:12}});
  const buscaNum=inp({className:"fi",placeholder:"Ex: 608, 1029...",style:{marginBottom:8,border:"2px solid #4285F4"}});
  const buscaCao=inp({className:"fi",placeholder:"Cao...",style:{marginBottom:0,border:"2px solid #FF6B9D"}});
  const buscaTutor=inp({className:"fi",placeholder:"Tutor / telefone...",style:{marginBottom:0,border:"2px solid #FF6B9D"}});
  const buscaEnd=inp({className:"fi",placeholder:"Rua, bairro...",style:{marginBottom:8,border:"2px solid #2DC653"}});
  const listaDiv=div({style:{maxHeight:200,overflowY:"auto",border:"1.5px solid #FFE4EF",borderRadius:14,marginBottom:12}});
  const selInfo=div({style:{fontSize:12,fontWeight:700,color:"#FF6B9D",marginBottom:8,minHeight:18}});
  function filtrarPets(){
    const qNum=buscaNum.value.toLowerCase().trim();
    const qCao=buscaCao.value.toLowerCase().trim();
    const qTutor=buscaTutor.value.toLowerCase().trim();
    const qTutorDig=qTutor.replace(/\D/g,"");
    const qEnd=buscaEnd.value.toLowerCase().trim();
    return pets.filter(p=>{
      if(qNum&&!String(p.casa).includes(qNum))return false;
      if(qCao&&!p.pet.toLowerCase().includes(qCao))return false;
      if(qTutor){
        const tutorOk=p.morador.toLowerCase().includes(qTutor);
        const telOk=qTutorDig&&p.telefone&&String(p.telefone).replace(/\D/g,"").includes(qTutorDig);
        if(!tutorOk&&!telOk)return false;
      }
      if(qEnd&&!p.endereco.toLowerCase().includes(qEnd))return false;
      return true;
    });
  }
  // painel resumo dos pets selecionados (aparece abaixo da lista)
  const resumoDiv=div({style:{marginBottom:10}});

  function getUltimoValorPet(casa,pet){
    let melhorData="",melhorValor=0;
    [DATA.cobrancas,DATA.cobrancas2||{}].forEach(src=>{
      MESES.forEach(m=>{
        ((src[m]||{})[casa]||{atendimentos:[]}).atendimentos.forEach(at=>{
          (at.caes||[]).forEach(c=>{
            if(c.nome===pet){
              const v=(c.servicos||[]).reduce((s,sv)=>s+(parseFloat(sv.valor)||0),0);
              if(v>0&&at.data>melhorData){melhorData=at.data;melhorValor=v;}
            }
          });
        });
      });
    });
    return melhorValor;
  }

  // Casa do tutor atualmente selecionado (null = nenhum selecionado ainda)
  let casaSelecionada=null;

  function buildLista(){
    petsFiltrados=filtrarPets();
    // Se há tutor selecionado, filtra só pets desse tutor
    const listaExibida=casaSelecionada!=null
      ? petsFiltrados.filter(p=>p.casa===casaSelecionada)
      : petsFiltrados;
    listaDiv.innerHTML="";
    if(listaExibida.length===0){
      // Se filtrado e sem resultado, mostra botão para limpar filtro
      const emp=div({style:{padding:"14px",textAlign:"center",color:"#8B8FA8",fontSize:13}});
      emp.textContent=casaSelecionada!=null?"Todos os pets deste tutor já foram selecionados":"Nenhum pet encontrado";
      listaDiv.appendChild(emp);
      buildResumo();return;
    }
    listaExibida.forEach((p,i)=>{
      // índice real no array petsFiltrados
      const realIdx=petsFiltrados.indexOf(p);
      const isSel=selIdxs.includes(realIdx);
      const row=div({style:{display:"flex",alignItems:"center",gap:0,background:isSel?"#FFF0F7":"#fff",borderBottom:"1px solid #FFE4EF",transition:"background .1s"}});

          selIdxs.splice(idx,1);
          // Se removeu todos, libera o filtro de tutor
          if(selIdxs.length===0)casaSelecionada=null;
        } else {
          selIdxs.push(realIdx);
          casaSelecionada=p.casa; // fixa o tutor
        }
        buildLista();

      const ult=getUltimoValorPet(p.casa,p.pet);

      const togBtn=btn({style:{width:44,height:44,borderRadius:12,background:isSel?"#FF6B9D":"#fff",border:"2px solid "+(isSel?"#FF6B9D":"#FFE4EF"),color:isSel?"#fff":"#FF6B9D",fontSize:22,fontWeight:900,flexShrink:0,margin:"0 8px",display:"flex",alignItems:"center",justifyContent:"center"},onClick:()=>{
        if(!p.pet){
          const pref2=DATA.casas[p.casa]?"cad1":"cad2";

          return;

        const idx=selIdxs.indexOf(realIdx);
        if(idx>=0){
          selIdxs.splice(idx,1);
          if(selIdxs.length===0)casaSelecionada=null;
        } else {
          selIdxs.push(realIdx);
          casaSelecionada=p.casa;
        }
        buildLista();
      }},isSel?"✓":(p.pet?"+":"🐾"));
      row.appendChild(inf);row.appendChild(togBtn);listaDiv.appendChild(row);
    });
    // Botão para cadastrar novo pet do tutor selecionado

      }});

      listaDiv.appendChild(addPetBtn);
    }
    buildResumo();
  }

  function buildResumo(){
    resumoDiv.innerHTML="";
    if(selIdxs.length===0){
      selInfo.textContent="";
      return;
    }
    selInfo.textContent=selIdxs.length+" pet(s) selecionado(s)";
    const selecionados=selIdxs.map(i=>petsFiltrados[i]).filter(Boolean);
    const res=div({style:{background:"#FFF5F9",borderRadius:14,padding:"12px 14px",border:"1.5px solid #FF6B9D"}});
    res.appendChild(h("p",{style:{fontWeight:800,color:"#FF6B9D",fontSize:12,marginBottom:8,textTransform:"uppercase",letterSpacing:.6}},"Pets selecionados"));
    selecionados.forEach(p=>{
      const ult=getUltimoValorPet(p.casa,p.pet);
      const row2=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}});
      row2.innerHTML=`<span style="font-weight:700;color:#1A1A2E;font-size:13px">🐶 ${p.pet||"(sem pet)"} <span style="color:#8B8FA8;font-weight:600;font-size:11px">Casa ${p.casa}</span></span>${(!gerente&&ult>0)?`<span style="font-weight:800;color:#2DC653;font-size:13px">R$ ${ult.toFixed(2)}</span>`:(!gerente?`<span style="font-size:11px;color:#8B8FA8">sem histórico</span>`:"")}`;
      res.appendChild(row2);
    });
    resumoDiv.appendChild(res);
  }
  const onInput=()=>{
    // Ao mudar busca, reseta seleção e tutor fixado
    selIdxs=[];casaSelecionada=null;
    buildLista();
  };
  buscaNum.addEventListener("input",onInput);buscaCao.addEventListener("input",onInput);buscaTutor.addEventListener("input",onInput);buscaEnd.addEventListener("input",onInput);

    if(casaSelecionada!=null){
      const doTutor=petsFiltrados.filter(p=>p.casa===casaSelecionada);
      selIdxs=doTutor.map(p=>petsFiltrados.indexOf(p)).filter(i=>i>=0);

  const svSel2=sel({className:"fi",style:{marginBottom:12}},SERVICOS.map(s=>({v:s,l:s})));svSel2.addEventListener("change",()=>servicoSel=svSel2.value);

  const colCao=div();colCao.appendChild(h("span",{style:{fontWeight:700,color:"#FF6B9D",fontSize:10,textTransform:"uppercase",letterSpacing:.8,display:"block",marginBottom:4}},"Cao"));colCao.appendChild(buscaCao);
  const colTutor=div();colTutor.appendChild(h("span",{style:{fontWeight:700,color:"#FF6B9D",fontSize:10,textTransform:"uppercase",letterSpacing:.8,display:"block",marginBottom:4}},"Tutor / Tel"));colTutor.appendChild(buscaTutor);
  buscaDupla.appendChild(colCao);buscaDupla.appendChild(colTutor);
  // ── Botão NOVO CADASTRO no topo ──────────────────────────────────────────────

  // Painel inline de cadastro
  const cadPainel=div({style:{display:"none",background:"#EFF6FF",border:"2px solid #3B82F6",borderRadius:14,padding:"16px",marginTop:8}});
  const morI=inp({className:"fi",placeholder:"Nome do tutor *",style:{marginBottom:10,border:"2px solid #3B82F6"}});
  const telI=inp({className:"fi",placeholder:"(51) 99999-9999",type:"tel",style:{marginBottom:10}});
  // campos endereço
  const endRuaI=inp({className:"fi",placeholder:"Rua / Avenida",style:{marginBottom:6}});
  const endNumI=inp({className:"fi",placeholder:"Número",style:{marginBottom:6}});

// ── MODAL KM ──────────────────────────────────────────────────────────────────
function abrirKmModal(mesSel,onDone){
  const registros=(DATA.saidas||[])
    .filter(s=>s.cat==="km"&&s.data&&s.data.slice(0,7)===mesSel)
    .sort((a,b)=>a.data.localeCompare(b.data));

  const cont=div();

  // ── Campo novo registro ──────────────────────────────────────────────────
  const addBox=div({style:{background:"#FFF5F9",borderRadius:14,padding:"14px",marginBottom:16,border:"1.5px solid #FF6B9D"}});
  addBox.appendChild(h("p",{style:{fontWeight:800,color:"#FF6B9D",fontSize:13,marginBottom:10}},"📍 Registrar KM atual"));
  const dI=inp({className:"fi",type:"date",value:hoje(),style:{marginBottom:10}});
  const vI=inp({className:"fi",type:"number",placeholder:"Ex: 85420",style:{marginBottom:10}});
  vI.setAttribute("inputmode","numeric");
  const svBtn=btn({style:{width:"100%",padding:"13px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:14,fontWeight:800,borderRadius:12},onClick:()=>{
    if(!vI.value){alert("Informe o km!");return;}
    updSilent(d=>({...d,saidas:[...(d.saidas||[]),{id:Date.now(),cat:"km",data:dI.value,val:vI.value,desc:"Odômetro"}]}));
    DATA=loadData();vI.value="";buildLista();onDone&&onDone();
  }},"+ Registrar");
  [lbl("Data"),dI,lbl("KM do odômetro"),vI,svBtn].forEach(el=>addBox.appendChild(el));
  cont.appendChild(addBox);

  // ── Estatísticas ────────────────────────────────────────────────────────
  const statsBox=div({style:{background:"#EFF6FF",borderRadius:14,padding:"14px",marginBottom:16,border:"1.5px solid #3B82F6"}});
  function calcStats(){
    statsBox.innerHTML="";
    const regs=(DATA.saidas||[]).filter(s=>s.cat==="km"&&s.data&&s.data.slice(0,7)===mesSel).sort((a,b)=>a.data.localeCompare(b.data));
    if(regs.length<2){statsBox.appendChild(h("p",{style:{color:"#8B8FA8",fontSize:13,fontWeight:700,textAlign:"center"}},"Registre ao menos 2 datas para ver a média"));return;}
    const diffs=[];
    for(let i=1;i<regs.length;i++){
      const km=parseFloat(regs[i].val)-parseFloat(regs[i-1].val);
      const d1=new Date(regs[i-1].data+"T12:00:00"),d2=new Date(regs[i].data+"T12:00:00");
      const dias=Math.max(1,Math.round((d2-d1)/(1000*60*60*24)));
      if(km>0)diffs.push({km,dias,kmDia:km/dias});
    }
    if(!diffs.length){statsBox.appendChild(h("p",{style:{color:"#8B8FA8",fontSize:13,fontWeight:700,textAlign:"center"}},"KM inválido (valor menor que anterior)"));return;}
    const totalKm=diffs.reduce((s,d)=>s+d.km,0);
    const mediaDia=diffs.reduce((s,d)=>s+d.kmDia,0)/diffs.length;
    const grid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}});
    [{l:"Média/dia",v:mediaDia.toFixed(0)+" km",c:"#3B82F6"},{l:"Total mês",v:totalKm.toFixed(0)+" km",c:"#FF6B9D"},{l:"Registros",v:regs.length+" datas",c:"#8B8FA8"},{l:"Último KM",v:parseFloat(regs[regs.length-1].val).toLocaleString("pt-BR"),c:"#2DC653"}].forEach(it=>{
      const c=div({style:{background:"#fff",borderRadius:10,padding:"10px",textAlign:"center",border:"1px solid #E0F2FE"}});
      c.innerHTML=`<div style="font-size:10px;font-weight:700;color:${it.c};text-transform:uppercase">${it.l}</div><div style="font-weight:800;color:${it.c};font-size:15px;margin-top:3px">${it.v}</div>`;
      grid.appendChild(c);
    });
    statsBox.appendChild(grid);
    // Histórico de trechos
    diffs.forEach((d,i)=>{
      const r=div({style:{fontSize:11,padding:"5px 8px",borderBottom:"1px solid #E0F2FE",display:"flex",justifyContent:"space-between",color:"#1A1A2E",fontWeight:600}});
      r.innerHTML=`<span>Trecho ${i+1}: <b>${d.km.toFixed(0)} km</b> em ${d.dias} dia${d.dias>1?"s":""}</span><span style="color:#3B82F6;font-weight:800">${d.kmDia.toFixed(0)} km/dia</span>`;
      statsBox.appendChild(r);
    });
  }
  calcStats();
  cont.appendChild(statsBox);

  // ── Lista de registros ──────────────────────────────────────────────────
  const listaDiv=div();
  function buildLista(){
    listaDiv.innerHTML="";
    calcStats();
    const regs=(DATA.saidas||[]).filter(s=>s.cat==="km"&&s.data&&s.data.slice(0,7)===mesSel).sort((a,b)=>b.data.localeCompare(a.data));
    if(!regs.length){listaDiv.appendChild(h("p",{style:{color:"#8B8FA8",fontSize:12,textAlign:"center",padding:"10px"}},"Nenhum registro ainda"));return;}
    regs.forEach(r=>{
      const row=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",borderBottom:"1px solid #FFE4EF",fontSize:13}});
      row.innerHTML=`<span style="color:#8B8FA8;font-size:11px">${fmtD(r.data)}</span><span style="font-weight:800;color:#1A1A2E">${parseFloat(r.val).toLocaleString("pt-BR")} km</span>`;
      const del=btn({style:{background:"#fff0f0",color:"#e53e3e",padding:"4px 8px",borderRadius:8,fontSize:11},onClick:()=>{updSilent(d=>({...d,saidas:(d.saidas||[]).filter(x=>x.id!==r.id)}));DATA=loadData();buildLista();onDone&&onDone();}},  "✕");
      row.appendChild(del);
      listaDiv.appendChild(row);
    });
  }
  buildLista();
  cont.appendChild(listaDiv);

  openModal("🚗 Odômetro — "+mesSel.slice(0,7),cont,()=>{});
}

    [{k:"todos",l:"Todos"},{k:"pago",l:"✅ Pago"},{k:"pendente",l:"⚠️ Pendente"}].forEach(f=>{

    });

    let lista=(DATA.vendas||[]).filter(v=>{
      if(!v.data)return false;
      if(v.data.slice(0,7)!==mesSel)return false;
      if(filtSel==="pago"&&!v.pago)return false;
      if(filtSel==="pendente"&&v.pago)return false;

    });
    lista=[...lista].reverse();
    const todasDoMes=(DATA.vendas||[]).filter(v=>v.data&&v.data.slice(0,7)===mesSel);
    const tot=todasDoMes.reduce((s,v)=>s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1),0);
    const totPago=todasDoMes.filter(v=>v.pago).reduce((s,v)=>s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1),0);

    body.appendChild(sm);
    if(lista.length===0){const e=div({style:{textAlign:"center",padding:"40px 0",color:"#8B8FA8"}});e.innerHTML='<div style="font-size:48px">🛍</div><p style="font-weight:700;margin-top:12px">Nenhuma venda</p>';body.appendChild(e);return;}
    lista.forEach((v,i)=>{
      const sub=(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1);
      const pago=!!v.pago;
      const c=div({className:"card anim",style:{marginBottom:12,animationDelay:i*18+"ms",borderLeft:"4px solid "+(pago?"#2DC653":"#FF6B9D")}});
      const top=div({style:{padding:"12px 14px 8px",display:"flex",alignItems:"flex-start",gap:10}});
      const inf=div({style:{flex:1}});
      inf.innerHTML=`<div style="font-weight:800;color:#1A1A2E;font-size:15px">${v.nome}${parseInt(v.qtd)>1?" x"+v.qtd:""}</div><div style="font-size:12px;color:#8B8FA8;margin-top:2px">${v.morador||""} ${v.casaNum?"· Casa "+v.casaNum:""}</div><div style="font-size:11px;color:#8B8FA8">${fmtD(v.data)}</div>`;

      val.innerHTML=`<div style="font-family:'Fredoka One',sans-serif;font-size:20px;color:${pago?"#2DC653":"#FF6B9D"}">R$ ${sub.toFixed(2)}</div>`;

      const bPago=btn({style:{flex:1,padding:"10px",borderRadius:12,fontSize:13,fontWeight:800,background:pago?"#2DC653":"#fff",color:pago?"#fff":"#2DC653",border:"2px solid #2DC653"}},pago?"✅ Pago":"Marcar Pago");

      bDel.onclick=()=>{if(confirm("Apagar esta venda?")){updSilent(d=>({...d,vendas:(d.vendas||[]).filter(x=>x.id!==v.id)}));DATA=loadData();build();}};
      acoes.appendChild(bPago);acoes.appendChild(bPend);acoes.appendChild(bEdit);acoes.appendChild(bDel);
      c.appendChild(acoes);body.appendChild(c);
    });
  }
  build();return w;
}
function abrirVendaModal(vEdit,onDone,casaNumFixado,prefFixado){
  const all={...DATA.casas,...DATA.casas2||{}};const cl2=Object.entries(all).map(([n,c])=>({num:Number(n),morador:c.morador})).sort((a,b)=>a.num-b.num);
  const cont=div();
  // Estado interno do tutor selecionado
  let selectedCasaNum=vEdit?vEdit.casaNum:(casaNumFixado||null);

  // Campo de busca de tutor igual à agenda
  const tutorWrap=div({style:{position:"relative",marginBottom:12}});
  const tutorInp=inp({className:"fi",placeholder:"🔍 Buscar tutor...",style:{marginBottom:0}});
  // Pré-preencher se editando ou tutor fixado — usa cadastro correto quando pref disponível
  const casaPreench=vEdit?vEdit.casaNum:casaNumFixado;
  if(casaPreench){
    let c=null;
    if(prefFixado==="cad2")c=(DATA.casas2||{})[casaPreench];
    else if(prefFixado==="cad1")c=DATA.casas[casaPreench];
    else c=all[casaPreench];
    tutorInp.value=c?`${c.morador} (Casa ${casaPreench})`:`Casa ${casaPreench}`;
  }
  const tutorDrop=div({style:{position:"absolute",top:"100%",left:0,right:0,background:"#fff",border:"2px solid #FF6B9D",borderRadius:12,maxHeight:200,overflowY:"auto",zIndex:999,display:"none",boxShadow:"0 4px 16px rgba(0,0,0,.15)"}});
  tutorWrap.appendChild(tutorInp);
  tutorWrap.appendChild(tutorDrop);

  function renderTutorDrop(q){
    tutorDrop.innerHTML="";
    const filtered=q.length<1?cl2.slice(0,30):cl2.filter(c=>c.morador&&c.morador.toLowerCase().includes(q.toLowerCase())).slice(0,30);
    if(!filtered.length){const em=div({style:{padding:"10px 14px",color:"#8B8FA8",fontSize:13}});em.textContent="Nenhum tutor encontrado";tutorDrop.appendChild(em);tutorDrop.style.display="block";return;}
    filtered.forEach(c=>{
      const it=div({style:{padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid #f5f5f5",fontSize:13}});
      it.innerHTML=`<span style="font-weight:700;color:#1A1A2E">${c.morador}</span> <span style="color:#8B8FA8;font-size:11px">Casa ${c.num}</span>`;
      it.onmousedown=()=>{
        selectedCasaNum=c.num;
        tutorInp.value=`${c.morador} (Casa ${c.num})`;
        tutorDrop.style.display="none";
      };
      it.onmouseover=()=>{it.style.background="#FFF5F9";};
      it.onmouseout=()=>{it.style.background="";};
      tutorDrop.appendChild(it);
    });
    tutorDrop.style.display="block";
  }
  tutorInp.addEventListener("focus",()=>{renderTutorDrop(tutorInp.value);});
  tutorInp.addEventListener("input",()=>{selectedCasaNum=null;renderTutorDrop(tutorInp.value);});
  tutorInp.addEventListener("blur",()=>{setTimeout(()=>{tutorDrop.style.display="none";},150);});

  const nI=inp({className:"fi",placeholder:"Produto",value:vEdit?.nome||"",style:{marginBottom:12}});
  nI.setAttribute("list","plist");
  const dl=h("datalist",{id:"plist"});(DATA.produtos||[]).forEach(p=>{const op=document.createElement("option");op.value=p.nome;dl.appendChild(op);});
  const pI=inp({className:"fi",type:"number",placeholder:"0,00",value:vEdit?.preco||"",style:{marginBottom:12}});
  const qI=inp({className:"fi",type:"number",placeholder:"1",value:vEdit?.qtd||"1",style:{marginBottom:12}});
  const dI=inp({className:"fi",type:"date",value:vEdit?.data||hoje(),style:{marginBottom:20}});
  [lbl("Tutor"),tutorWrap,dl,lbl("Produto"),nI,lbl("Preco (R$)"),pI,lbl("Qtd"),qI,lbl("Data"),dI].forEach(el=>cont.appendChild(el));
  let mv=null;
  cont.appendChild(btn({style:{width:"100%",padding:"17px",background:"linear-gradient(135deg,#FF6B9D,#FFD93D)",color:"#fff",fontSize:16,borderRadius:16},onClick:()=>{
    if(!selectedCasaNum||!nI.value||!pI.value){alert("Preencha tutor, produto e preco!");return;}
    const casa=all[selectedCasaNum]||{};const venda={id:vEdit?.id||Date.now(),casaNum:Number(selectedCasaNum),morador:casa.morador||"",nome:nI.value,preco:pI.value,qtd:qI.value||"1",data:dI.value,pago:vEdit?.pago||false};
    if(vEdit)updSilent(d=>({...d,vendas:(d.vendas||[]).map(v=>v.id===venda.id?venda:v)}));
    else updSilent(d=>({...d,vendas:[...(d.vendas||[]),venda]}));
    DATA=loadData();if(mv)mv.remove();onDone();
  }},vEdit?"Salvar":"Registrar"));
  mv=openModal(vEdit?"Editar Venda":"Nova Venda",cont,()=>{});
}
