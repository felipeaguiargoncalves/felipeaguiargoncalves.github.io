var D = {};
var NAV = "home";
var STATE = {}; // estado temporário por tela

function emptyD() {
  return {casas:{},casas2:{},cobrancas:{},cobrancas2:{},modelos:{},agenda:[],saidas:[],enderecos:{},vendas:[],produtos:JSON.parse(JSON.stringify(PRODS_INIT)),lab:{maquina:"",insumos:[],exames:[],valorExame:"60"},gruposWA:{"0":"","1":"","2":"","3":"","4":"","5":"","6":""}};
}

function carregarDados() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      var base = emptyD();
      if (!p.produtos || p.produtos.length < 5) p.produtos = JSON.parse(JSON.stringify(PRODS_INIT));
      if (!p.lab) p.lab = {maquina:"",insumos:[],exames:[],valorExame:"60"};
      if (!p.gruposWA) p.gruposWA = {"0":"","1":"","2":"","3":"","4":"","5":"","6":""};
      p.casas = Object.assign({}, CASAS_INIT, p.casas || {});
      D = Object.assign(base, p);
    } else {
      D = emptyD();
      D.casas = JSON.parse(JSON.stringify(CASAS_INIT));
    }
  } catch(e) { D = emptyD(); D.casas = JSON.parse(JSON.stringify(CASAS_INIT)); }
}

function salvar() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e) {} }
function clone(x) { return JSON.parse(JSON.stringify(x)); }

function fmtD(d) { if(!d) return "--"; var p=d.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function addDias(ds,n) { var d=new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function getDiaSemana(ds) { return new Date(ds+"T12:00:00").getDay(); }
function mapsUrl(e) { return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e+", Porto Alegre RS"); }
function waLink(tel) { return "https://api.whatsapp.com/send?phone=55"+tel.replace(/\D/g,""); }
function totalAts(ats) { return (ats||[]).reduce(function(s,at){return s+(at.caes||[]).reduce(function(ss,c){return ss+(c.servicos||[]).reduce(function(sss,sv){return sss+(parseFloat(sv.valor)||0);},0);},0);},0); }

function goTo(s, extra) {
  NAV = s;
  STATE = extra || {};
  document.getElementById("topbar").style.display = (s==="agenda_gerente") ? "none" : "flex";
  render();
  window.scrollTo(0,0);
}

function render() {
  var root = document.getElementById("root");
  var s = NAV;
  if (s==="home") root.innerHTML = renderHome();
  else if (s==="exportar") root.innerHTML = renderExportar();
  else if (s==="restaurar") root.innerHTML = renderRestaurar();
  else if (s==="cad1") root.innerHTML = renderMenuCad("cad1");
  else if (s==="cad2") root.innerHTML = renderMenuCad("cad2");
  else if (s==="cad1_casa") root.innerHTML = renderCadCasa("cad1");
  else if (s==="cad2_casa") root.innerHTML = renderCadCasa("cad2");
  else if (s==="cad1_meses") root.innerHTML = renderMeses("cad1");
  else if (s==="cad2_meses") root.innerHTML = renderMeses("cad2");
  else if (s==="cad1_grade") root.innerHTML = renderGrade("cad1");
  else if (s==="cad2_grade") root.innerHTML = renderGrade("cad2");
  else if (s==="cad1_det") root.innerHTML = renderDet("cad1");
  else if (s==="cad2_det") root.innerHTML = renderDet("cad2");
  else if (s==="cad1_fin") root.innerHTML = renderFin("cad1");
  else if (s==="cad2_fin") root.innerHTML = renderFin("cad2");
  else if (s==="agenda") root.innerHTML = renderAgenda(false);
  else if (s==="agenda_gerente") root.innerHTML = renderAgenda(true);
  else if (s==="saidas") root.innerHTML = renderSaidas();
  else if (s==="vendas") root.innerHTML = renderVendas();
  else if (s==="farmacia") root.innerHTML = renderFarmacia();

  else root.innerHTML = renderHome();
}

// ─── EXPORTAR ─────────────────────────────────────────
function renderExportar() {
  var txt = JSON.stringify(D);
  var c1 = Object.keys(D.casas||{}).length;
  var c2 = Object.keys(D.casas2||{}).length;
  return '<div class="screen">'
    +hdr("Exportar Dados","goTo('home')")
    +'<div style="padding:16px 18px 40px;">'
    +'<div class="card" style="padding:14px 18px;margin-bottom:16px;background:#e8fbed;border-color:'+PS+';">'
    +'<div style="font-weight:800;color:'+PS+';font-size:15px;margin-bottom:6px;">Seus dados</div>'
    +'<div style="font-size:13px;color:#1A1A2E;line-height:1.9;">Cadastro 1: <b>'+c1+'</b> casas | Cadastro 2: <b>'+c2+'</b> casas<br>Vendas: <b>'+(D.vendas||[]).length+'</b> | Agenda: <b>'+(D.agenda||[]).length+'</b><br><span style="color:'+PM+'">Tamanho: <b>'+(txt.length/1024).toFixed(1)+' KB</b></span></div>'
    +'</div>'
    +'<button class="btn" onclick="exportDownload()" style="width:100%;padding:16px;background:linear-gradient(135deg,'+PR+','+PA+');color:#fff;font-size:15px;border-radius:14px;margin-bottom:12px;">📥 Baixar Arquivo .json</button>'
    +'<button class="btn" onclick="exportCopiar()" style="width:100%;padding:16px;background:linear-gradient(135deg,#1A1A2E,#2d2d4e);color:#fff;font-size:15px;border-radius:14px;margin-bottom:16px;">📋 Copiar Texto</button>'
    +'<div id="exp-msg" style="display:none;border-radius:12px;padding:14px 16px;font-weight:700;font-size:13px;margin-bottom:12px;"></div>'
    +'<label class="lb">Texto do backup (selecione e copie):</label>'
    +'<textarea readonly onclick="this.select()" style="width:100%;height:100px;padding:10px;border-radius:10px;border:1.5px solid '+PB+';font-size:10px;font-family:monospace;resize:none;color:#1A1A2E;background:#FAFAFA;">'+h(txt)+'</textarea>'
    +'</div></div>';
}
function exportDownload() {
  var txt = JSON.stringify(D);
  var blob = new Blob([txt],{type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href=url; a.download="planetdogs_"+hoje()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showMsg("exp-msg",true,"Download iniciado!");
}
function exportCopiar() {
  navigator.clipboard.writeText(JSON.stringify(D))
    .then(function(){showMsg("exp-msg",true,"Copiado!");})
    .catch(function(){showMsg("exp-msg",false,"Selecione o texto abaixo e copie.");});
}
function showMsg(id,ok,t) {
  var el=document.getElementById(id); if(!el) return;
  el.style.display="block"; el.style.background=ok?"#e8fbed":"#fff0f0"; el.style.color=ok?PS:"#e53e3e"; el.textContent=t;
}

// ─── RESTAURAR ────────────────────────────────────────
var _restoreParsed = null;
function renderRestaurar() {
  return '<div class="screen">'
    +hdr("Restaurar Backup","goTo('home')")
    +'<div style="padding:20px 18px 40px;">'
    +'<input type="file" id="restore-file" accept=".json,application/json,text/plain" style="display:none;" onchange="lerArquivo(event)">'
    +'<button class="btn" onclick="document.getElementById(\'restore-file\').click()" style="width:100%;padding:20px;background:linear-gradient(135deg,'+PR+','+PA+');color:#fff;font-size:16px;border-radius:16px;margin-bottom:14px;">📂 SELECIONAR ARQUIVO</button>'
    +'<div id="restore-nome" style="display:none;background:#FFF5F9;border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:13px;font-weight:700;"></div>'
    +'<div id="restore-msg" style="display:none;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700;font-size:13px;white-space:pre-line;line-height:1.8;"></div>'
    +'<button id="restore-btn" onclick="executarRestore()" style="display:none;width:100%;padding:18px;background:linear-gradient(135deg,'+PS+',#52e87b);color:#fff;font-size:17px;border-radius:16px;cursor:pointer;border:none;font-family:\'Nunito\',sans-serif;font-weight:800;">✅ RESTAURAR AGORA</button>'
    +'<div style="margin-top:20px;"><label class="lb">Ou cole o JSON aqui:</label>'
    +'<textarea id="restore-paste" placeholder=\'{"casas":{...},...}\' style="width:100%;height:140px;padding:12px;border-radius:12px;border:2px solid '+PR+';font-size:11px;font-family:monospace;resize:vertical;color:#1A1A2E;background:#FAFAFA;margin-bottom:10px;"></textarea>'
    +'<button class="btn" onclick="validarColar()" style="width:100%;padding:14px;background:linear-gradient(135deg,#1A1A2E,#2d2d4e);color:#fff;font-size:14px;border-radius:14px;">Validar e Restaurar JSON Colado</button>'
    +'</div></div></div>';
}
function lerArquivo(e) {
  var file=e.target.files[0]; if(!file) return;
  var nm=document.getElementById("restore-nome"); nm.style.display="block"; nm.textContent="Arquivo: "+file.name;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      _restoreParsed=JSON.parse(ev.target.result);
      var c1=Object.keys(_restoreParsed.casas||{}).length, c2=Object.keys(_restoreParsed.casas2||{}).length;
      showMsg("restore-msg",true,"Arquivo valido!\nCad.1: "+c1+" | Cad.2: "+c2+" casas");
      document.getElementById("restore-btn").style.display="block";
    }catch(err){showMsg("restore-msg",false,"Erro ao ler JSON: "+err.message);_restoreParsed=null;document.getElementById("restore-btn").style.display="none";}
  };
  r.onerror=function(){showMsg("restore-msg",false,"Erro ao abrir o arquivo.");};
  r.readAsText(file);
}
function executarRestore() {
  if(!_restoreParsed) return;
  if(!confirm("Restaurar backup? Dados atuais serao substituidos.")) return;
  D=_restoreParsed; salvar(); alert("Backup restaurado!"); goTo("home");
}
function validarColar() {
  var txt=(document.getElementById("restore-paste")||{}).value||"";
  if(!txt.trim()){alert("Cole o JSON primeiro!");return;}
  try{var p=JSON.parse(txt);if(!confirm("Restaurar? Dados atuais serao substituidos.")) return; D=p; salvar(); alert("Restaurado!"); goTo("home");}
  catch(e){alert("JSON invalido: "+e.message);}
}

function hdr(title, backFn, extraHtml) {

function togglePago(cad,num,mes){

  salvar(); goTo(NAV,STATE);
}
function toggleNota(cad,num,mes){
  var cobs=cobsSrc(cad); if(!cobs[mes]) cobs[mes]={};
  var cb=cobs[mes][num]||{atendimentos:[]}; cb.notaEnviada=!cb.notaEnviada; cobs[mes][num]=cb;
  salvar(); goTo(NAV,STATE);
}
function toggleAtPago(cad,num,mes,id){
  var cobs=cobsSrc(cad); if(!cobs[mes]) cobs[mes]={};
  var cb=cobs[mes][num]||{atendimentos:[]};
  cb.atendimentos=(cb.atendimentos||[]).map(function(a){return a.id===id?Object.assign({},a,{pago:!a.pago}):a;});
  cobs[mes][num]=cb; salvar(); goTo(NAV,STATE);
}
function delAt(cad,num,mes,id){
  if(!confirm("Apagar atendimento?")) return;
  var cobs=cobsSrc(cad); if(!cobs[mes]) cobs[mes]={};
  var cb=cobs[mes][num]||{atendimentos:[]};
  cb.atendimentos=(cb.atendimentos||[]).filter(function(a){return a.id!==id;});
  cobs[mes][num]=cb; salvar(); goTo(NAV,STATE);
}
function enviarWA(cad,num,mes,soPendentes){
  var casas=casasSrc(cad); var cobs=cobsSrc(cad);
  var casa=casas[num]||{}; var tel=(casa.telefone||"").replace(/\D/g,"");
  if(!tel){alert("Sem telefone!");return;}
  var ats=((cobs[mes]||{})[num]||{}).atendimentos||[];
  var lista=soPendentes?ats.filter(function(a){return !a.pago;}):ats;
  if(!lista.length){alert("Nenhum atendimento!");return;}
  var msg="🐾 PLANET DOGS\n📅 "+mes+"\nOla "+h(casa.morador||"")+"\n\n";
  lista.forEach(function(at){
    var sub=totalAts([at]); msg+="📅 "+fmtD(at.data)+" - R$ "+sub.toFixed(2)+"\n";
    at.caes.forEach(function(c){msg+="  🐶 "+(c.nome||"Pet")+(c.raca?" ("+c.raca+")":"")+"\n     "+(c.servicos||[]).map(function(sv){return sv.nome+" R$"+parseFloat(sv.valor||0).toFixed(2);}).join(" | ")+"\n";});
  });
  msg+="\n💰 TOTAL: R$ "+totalAts(lista).toFixed(2);
  window.open("https://api.whatsapp.com/send?phone=55"+tel+"&text="+encodeURIComponent(msg),"_blank");
}

  var opts=Object.keys(tc).map(Number).sort(function(a,b){return a-b;}).map(function(n){return '<option value="'+n+'">'+n+' - '+h((tc[n]||{}).morador||"")+'</option>';}).join("");
  var datalist='<datalist id="prod-dl">'+(D.produtos||[]).map(function(p){return '<option value="'+h(p.nome)+'">';}).join("")+'</datalist>';
  abrirModal('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">'
    +'<h3 style="font-family:\'Fredoka One\',sans-serif;font-size:20px;color:'+PR+';">Nova Venda</h3>'
    +'<button class="btn" onclick="fecharModal()" style="background:#f0f0f0;color:#1A1A2E;padding:8px 13px;border-radius:11px;">X</button>'
    +'</div>'
    +'<label class="lb">Casa / Tutor</label><select class="fi" id="v-casa" style="margin-bottom:12px;"><option value="">Selecione...</option>'+opts+'</select>'
    +'<label class="lb">Data</label><input class="fi" type="date" id="v-data" value="'+hoje()+'" style="margin-bottom:12px;">'
    +'<label class="lb">Produto</label>'+datalist+'<input class="fi" id="v-nome" list="prod-dl" placeholder="Digite o produto..." style="margin-bottom:12px;">'
    +'<div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:16px;">'
    +'<div><label class="lb">Preco</label><div style="position:relative;"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:800;color:'+PM+';font-size:13px;">R$</span><input class="fi" type="number" id="v-preco" placeholder="0,00" style="padding-left:28px;"></div></div>'
    +'<div><label class="lb">Qtd</label><input class="fi" type="number" id="v-qtd" value="1"></div>'
    +'</div>'
    +'<button class="btn" onclick="salvarVenda()" style="width:100%;padding:17px;background:linear-gradient(135deg,'+PR+','+PA+');color:#fff;font-size:16px;border-radius:16px;">Registrar Venda</button>');
}
function salvarVenda(){
  var casaNum=parseInt((document.getElementById("v-casa")||{}).value); if(!casaNum){alert("Selecione a casa!");return;}
  var nome=(document.getElementById("v-nome")||{}).value; if(!nome){alert("Informe o produto!");return;}
  var preco=(document.getElementById("v-preco")||{}).value; if(!preco){alert("Informe o preco!");return;}
  var qtd=(document.getElementById("v-qtd")||{}).value||"1";
  var data=(document.getElementById("v-data")||{}).value||hoje();
  var tc=todasCasas(); var morador=((tc[casaNum]||{}).morador||"");
  if(!D.vendas) D.vendas=[];
  D.vendas.push({id:Date.now(),casaNum:casaNum,morador:morador,nome:nome,preco:preco,qtd:qtd,data:data});
  salvar(); fecharModal(); goTo("vendas");
}

  var tabs=["exames","insumos","config"].map(function(t){
    return '<button class="btn" onclick="_abaLab=\''+t+'\';goTo(\'lab\');" style="flex:1;padding:10px 6px;font-size:13px;background:'+(_abaLab===t?PR:"#fff")+';color:'+(_abaLab===t?"#fff":PD)+';border:1.5px solid '+(_abaLab===t?PR:PB)+';border-radius:14px;">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>';

      +'<button class="btn" onclick="editExame(-1)" style="width:100%;padding:15px;background:linear-gradient(135deg,'+PR+','+PA+');color:#fff;font-size:15px;border-radius:14px;margin-bottom:14px;">+ Novo Exame</button>'

  salvar(); fecharModal(); goTo("lab");

// ─── RELATORIO ────────────────────────────────────────
function renderRelatorio(){
  var tRec=0,tPago=0;
  var tSaidas=(D.saidas||[]).reduce(function(s,x){return s+(parseFloat(x.val)||0);},0);
  MESES.forEach(function(m){
    [D.cobrancas,D.cobrancas2].forEach(function(src){if(!src)return;var cb=(src[m]||{});Object.values(cb).forEach(function(c){var v=totalAts(c.atendimentos);tRec+=v;if(c.pago)tPago+=v;});});
  });
  var tVendas=(D.vendas||[]).reduce(function(s,v){return s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1);},0);
  var txt="============================\n   RELATORIO PLANET DOGS\n   "+new Date().toLocaleDateString("pt-BR")+"\n============================\n\n=== RESUMO FINANCEIRO ===\nTotal faturado:  R$ "+tRec.toFixed(2)+"\nTotal recebido:  R$ "+tPago.toFixed(2)+"\nTotal pendente:  R$ "+(tRec-tPago).toFixed(2)+"\nTotal saidas:    R$ "+tSaidas.toFixed(2)+"\nLucro liquido:   R$ "+(tPago-tSaidas).toFixed(2)+"\n\n=== VENDAS ===\nTotal: R$ "+tVendas.toFixed(2)+"\n\n============================";
  return '<div class="screen">'+hdr("Relatorio","goTo('home')")
    +'<div style="padding:14px 18px 40px;">'
    +'<button class="btn" onclick="copiarRel()" style="width:100%;padding:16px;background:linear-gradient(135deg,'+PR+','+PA+');color:#fff;font-size:15px;border-radius:14px;margin-bottom:12px;">📋 Copiar Relatorio</button>'
    +'<textarea id="rel-txt" readonly onclick="this.select()" style="width:100%;height:420px;padding:12px;border-radius:12px;border:1.5px solid '+PB+';font-size:11px;font-family:monospace;resize:none;color:#1A1A2E;background:#FAFAFA;line-height:1.6;">'+txt+'</textarea>'
    +'</div></div>';
}
function copiarRel(){var el=document.getElementById("rel-txt");if(!el)return;navigator.clipboard.writeText(el.value).then(function(){alert("Copiado!");}).catch(function(){el.select();});}

// ─── MODAL GLOBAL ─────────────────────────────────────
function abrirModal(html){
  document.getElementById("modal-box").innerHTML=html;
  document.getElementById("modal-overlay").style.display="flex";
}
function fecharModal(){
  document.getElementById("modal-overlay").style.display="none";
  document.getElementById("modal-box").innerHTML="";
}

carregarDados();
goTo("home");
