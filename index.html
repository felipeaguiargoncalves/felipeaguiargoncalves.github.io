function emptyData(){

}
function loadData(){
  try{
    const d=localStorage.getItem(KEY);
    if(d){const p=JSON.parse(d);const base=emptyData();
      if(!p.produtos||p.produtos.length<5)p.produtos=JSON.parse(JSON.stringify(PRODUTOS_FARMACIA));

      if(!p.gruposWA)p.gruposWA={0:"",1:"",2:"",3:"",4:"",5:"",6:""};
      return Object.assign(base,p,{casas:Object.assign({},CASAS_PREFILL,p.casas||{})});

    return emptyData();
  }catch(e){return emptyData();}
}

function exportDownload(){
  try{

function toggleNota(cadNum,mes,num){

function toggleAtPago(cadNum,mes,num,atId){

  const ats=cb.atendimentos||[];
  const pago=cb.pago||false;
  const tel=(casa.telefone||"").replace(/\D/g,"");
  if(!tel){alert("Sem telefone cadastrado!");return;}
  const total=totalAts(ats);
  const totalPagos=ats.filter(a=>a.pago).reduce((s,a)=>s+totalAts([a]),0);
  const pendente=total-totalPagos;
  const vendas=(DATA.vendas||[]).filter(v=>v.casaNum===num);
  const totalVendas=vendas.reduce((s,v)=>s+(parseFloat(v.preco)||0)*(parseInt(v.qtd)||1),0);
  const totalGeral=total+totalVendas;
  let msg="Ola "+casa.morador+"\nPlanet Dogs - "+mes+"\n\n";
  const atsFilt=soOpen?ats.filter(a=>!a.pago):ats;
  atsFilt.forEach(at=>{
    const sub=at.caes.reduce((s,c)=>s+c.servicos.reduce((ss,sv)=>ss+(parseFloat(sv.valor)||0),0),0);
    msg+="Data: "+fmtD(at.data)+" - R$ "+sub.toFixed(2)+"\n";
    at.caes.forEach(c=>{msg+="  "+c.nome+(c.raca?" ("+c.raca+")":"")+" - "+c.servicos.map(sv=>sv.nome+" R$"+parseFloat(sv.valor||0).toFixed(2)).join(" | ")+"\n";});
  });
  if(totalVendas>0&&!soOpen){msg+="\nProdutos:\n";vendas.forEach(v=>{msg+="- "+v.nome+" x"+(v.qtd||1)+" R$ "+((parseFloat(v.preco)||0)*(parseInt(v.qtd)||1)).toFixed(2)+"\n";});}
  const tot=soOpen?pendente:totalGeral;
  msg+="\nTotal: R$ "+tot.toFixed(2);
  if(pendente>0&&!pago)msg+="\nPendente: R$ "+pendente.toFixed(2);
  window.open("https://api.whatsapp.com/send?phone=55"+tel+"&text="+encodeURIComponent(msg),"_blank");
}

function remSv(ci,si){_modalAt.caes[ci].servicos=_modalAt.caes[ci].servicos.filter((_,i)=>i!==si);renderModalAt();}
function addSv(ci){_modalAt.caes[ci].servicos.push({nome:"Banho",valor:""});renderModalAt();}
function remCao(ci){_modalAt.caes=_modalAt.caes.filter((_,i)=>i!==ci);renderModalAt();}

function salvarAt(){
  const{cadNum,mes,num,atId,data,caes}=_modalAt;
  if(!data)return;
  const cobrancas=cadNum===1?DATA.cobrancas:(DATA.cobrancas2||{});
  const cb=clone((cobrancas[mes]||{})[num]||{atendimentos:[]});
  let ats=cb.atendimentos||[];
  if(atId)ats=ats.map(a=>a.id===atId?{...a,data,caes}:a);
  else ats=[...ats,{id:Date.now(),data,caes,pago:false}];
  ats.sort((a,b)=>a.data.localeCompare(b.data));
  cb.atendimentos=ats;
  // salva modelo
  DATA.modelos={...DATA.modelos,[num]:caes};
  if(cadNum===1)saveCob(mes,num,cb); else saveCob2(mes,num,cb);
  document.getElementById("modal-at").innerHTML="";
}

async function labAnalisarFoto(input){

    const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("Erro"));r.readAsDataURL(file);});
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:base64}},{type:"text",text:`Analise este hemograma veterinario. Retorne APENAS JSON valido: {"especie":"cao ou gato","serieVermelha":{"hemacias":"v","hemoglobina":"v","hematocrito":"v"},"serieBranca":{"leucocitos":"v","neutrofilos":"v","linfocitos":"v"},"plaquetas":"v","interpretacao":"resumo","alertas":["valores fora do normal"]}. Se nao for hemograma: {"erro":"nao reconhecido"}.`}]}]})
    });
    const data=await resp.json();
    const txt=(data.content||[]).map(i=>i.text||"").join("").replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(txt);
    if(parsed.erro){if(el)el.innerHTML=`<div style="margin-top:10px;background:#fff0f0;border-radius:10px;padding:10px 12px;color:#e53e3e;font-size:12px;font-weight:700;">${parsed.erro}</div>`;}

function agDarBaixa(ids,m){
  const arr=ids.split(",");const agenda=DATA.agenda||[];
  const evs=agenda.filter(a=>arr.includes(String(a.id)));if(!evs.length)return;
  const rep=evs[0];const mesNome=MESES[new Date(rep.data+"T12:00:00").getMonth()];
  const cbSrc=DATA.casas[rep.casa]?DATA.cobrancas:(DATA.cobrancas2||{});
  const cbMes=(cbSrc[mesNome]||{});const cbCasa=(cbMes[rep.casa]||{atendimentos:[]});
  const caes=evs.map(ev=>{
    const atsAnt=cbCasa.atendimentos||[];
    for(let i=atsAnt.length-1;i>=0;i--){const cao=(atsAnt[i].caes||[]).find(c=>c.nome===ev.pet);if(cao)return JSON.parse(JSON.stringify(cao));}
    const mod=(DATA.modelos[rep.casa]||[]).find(c=>c.nome===ev.pet);
    if(mod)return JSON.parse(JSON.stringify(mod));
    return{nome:ev.pet||"Pet",raca:"",servicos:[{nome:"Banho",valor:""}]};
  });
  const novoAt={id:Date.now(),data:rep.data,caes,pago:false};
  const novosAts=[...(cbCasa.atendimentos||[]),novoAt].sort((a,b)=>a.data.localeCompare(b.data));
  if(DATA.casas[rep.casa])saveCob(mesNome,rep.casa,{...cbCasa,atendimentos:novosAts});
  else saveCob2(mesNome,rep.casa,{...cbCasa,atendimentos:novosAts});
  upd(d=>({...d,agenda:(d.agenda||[]).map(a=>arr.includes(String(a.id))?{...a,buscado:true}:a)}));
  alert("Baixa dada!");renderAgenda(m);
}

        <h3 style="font-family:'Fredoka One',sans-serif;font-size:20px;color:#FF6B9D;">Agendar</h3>
        <button class="btn" onclick="_agModalData={};renderAgendaModal(${m})" style="background:#f0f0f0;color:#1A1A2E;padding:8px 13px;border-radius:11px;">X</button>
      </div>
      <label style="${lb}">Data</label>
      <input type="date" value="${_agModalData.data}" oninput="_agModalData.data=this.value" style="${fi}margin-bottom:12px;">
      <label style="${lb}">Buscar por numero da casa</label>
      <input type="number" placeholder="Ex: 608, 1029..." value="${_agBuscaCasa}" oninput="_agBuscaCasa=this.value;renderAgendaModal(${m})" style="${fi}margin-bottom:8px;border:1.5px solid #3B82F6;">
      <label style="${lb}">Buscar por pet ou tutor</label>
      <input placeholder="Nome do cao, tutor..." value="${_agBusca}" oninput="_agBusca=this.value;_agModalData.petIdxs=[];renderAgendaModal(${m})" style="${fi}margin-bottom:8px;border:2px solid #FF6B9D;">
      <label style="${lb}">Buscar por rua / endereco</label>
      <input placeholder="Rua, bairro..." value="${_agBuscaRua}" oninput="_agBuscaRua=this.value;_agModalData.petIdxs=[];renderAgendaModal(${m})" style="${fi}margin-bottom:12px;border:1.5px solid #2DC653;">
      ${petsFilt.length>0?`<div style="margin-bottom:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:12px;font-weight:800;color:#8B8FA8;text-transform:uppercase;">Selecione os pets</span>
          <button class="btn" onclick="agSelectAll(${petsFilt.length},${m})" style="background:#FF6B9D;color:#fff;padding:5px 12px;font-size:12px;border-radius:10px;">Todos</button>
        </div>
        <div style="max-height:180px;overflow-y:auto;border:1.5px solid #FFE4EF;border-radius:14px;">${petsHtml}</div>
        ${idxsSel.length>0?`<div style="margin-top:8px;background:#FFF0F7;border:1.5px solid #FF6B9D;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:800;color:#FF6B9D;">${idxsSel.length} pet(s) selecionado(s)</div>`:""}
      </div>`:""}
      <label style="${lb}">Servico</label>
      <select onchange="_agModalData.servico=this.value" style="${fi}margin-bottom:12px;">
        ${SERVICOS_LISTA.map(s=>`<option ${_agModalData.servico===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <label style="${lb}">Funcionario</label>
      <select onchange="_agModalData.func=parseInt(this.value)" style="${fi}margin-bottom:12px;">
        ${FUNCIONARIOS.map((f,i)=>`<option value="${i}" ${_agModalData.func===i?"selected":""}>${f.nome} - ${f.cargo}</option>`).join("")}
      </select>
      <label style="${lb}">Hora</label>
      <input type="time" value="${_agModalData.hora}" oninput="_agModalData.hora=this.value" style="${fi}margin-bottom:16px;">
      <label style="${lb}margin-bottom:10px;">Repetir</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px;">
        ${REPETICOES.map(r=>`<button class="btn" onclick="_agModalData.repetir=${_agModalData.repetir===r.dias?"null":r.dias};renderAgendaModal(${m})" style="padding:10px 4px;font-size:12px;background:${_agModalData.repetir===r.dias?"#FF6B9D":"#fff"};color:${_agModalData.repetir===r.dias?"#fff":"#1A1A2E"};border:2px solid ${_agModalData.repetir===r.dias?"#FF6B9D":"#FFE4EF"};border-radius:12px;">${r.label}</button>`).join("")}
      </div>
      ${_agModalData.repetir?`<div style="background:#e8fbed;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#2DC653;font-weight:700;">12 repeticoes agendadas</div>`:""}
      <button class="btn" onclick="agSalvar(${m})" style="width:100%;padding:17px;background:linear-gradient(135deg,#FF6B9D,#FFD93D);color:#fff;font-size:16px;border-radius:16px;">Salvar</button>
    </div>
  </div>`;
  if(ret)return html;
  const el=document.getElementById("modal-agenda");if(el)el.innerHTML=html;
}
function agTogglePet(idx,m){
  const arr=_agModalData.petIdxs||[];
  if(arr.includes(idx))_agModalData.petIdxs=arr.filter(x=>x!==idx);
  else _agModalData.petIdxs=[...arr,idx];
  renderAgendaModal(m);
}
function agSelectAll(n,m){
  const arr=_agModalData.petIdxs||[];
  if(arr.length===n)_agModalData.petIdxs=[];
  else _agModalData.petIdxs=Array.from({length:n},(_,i)=>i);
  renderAgendaModal(m);
}
function agSalvar(m){
  const{data,petIdxs,servico,func,hora,repetir}=_agModalData;
  if(!petIdxs||petIdxs.length===0){alert("Selecione um pet!");return;}
  const todasCasas=Object.assign({},DATA.casas,DATA.casas2||{});
  const enderecos=DATA.enderecos||{};
  const cobrancas=DATA.cobrancas;const cobrancas2=DATA.cobrancas2||{};
  const pets=[];
  Object.entries(todasCasas).forEach(([num,casa])=>{
    const end=enderecos[num]||{};
    const endStr=end.rua?end.rua+(end.numero?", "+end.numero:"")+(end.bairro?" - "+end.bairro:""):"";
    const vistos=new Set();
    [...Object.values(cobrancas),...Object.values(cobrancas2)].forEach(cbMes=>{
      const cb=cbMes[num];if(!cb)return;
      (cb.atendimentos||[]).forEach(at=>at.caes.forEach(c=>{if(c.nome&&!vistos.has(c.nome)){vistos.add(c.nome);pets.push({pet:c.nome,casa:Number(num),morador:casa.morador,endereco:endStr});}}));
    });
    if(vistos.size===0)pets.push({pet:"",casa:Number(num),morador:casa.morador,endereco:endStr});
  });
  let _petsFilt=pets;
  if(_agBusca.trim())_petsFilt=_petsFilt.filter(p=>p.pet.toLowerCase().includes(_agBusca.toLowerCase())||p.morador.toLowerCase().includes(_agBusca.toLowerCase()));
  if(_agBuscaCasa.trim())_petsFilt=_petsFilt.filter(p=>String(p.casa).includes(_agBuscaCasa.trim()));
  if(_agBuscaRua.trim())_petsFilt=_petsFilt.filter(p=>(p.endereco||"").toLowerCase().includes(_agBuscaRua.toLowerCase()));
  _petsFilt=_petsFilt.slice(0,100);
  const selecionados=petIdxs.map(i=>_petsFilt[i]).filter(Boolean);
  let novas=[...(DATA.agenda||[])];
  selecionados.forEach((p,pi)=>{
    const base={data,pet:p.pet,casa:p.casa,morador:p.morador,servico,func:FUNCIONARIOS[func].nome,hora,endereco:p.endereco,buscado:false};
    novas.push({...base,id:Date.now()+pi*100});
    if(repetir){let d=data;for(let i=1;i<=11;i++){d=addDias(d,repetir);novas.push({...base,id:Date.now()+pi*100+i*10,data:d});}}
  });
  novas.sort((a,b)=>a.data.localeCompare(b.data));
  upd(d=>({...d,agenda:novas}));
  _agModalData={};
  const el=document.getElementById("modal-agenda");if(el)el.innerHTML="";
  renderAgenda(m);
}

// modal pagamento
function renderModalPag(m){
  const agenda=DATA.agenda||[];
  const ids=_agModalPag||[];
  const grupo=agenda.filter(a=>ids.includes(String(a.id)));
  if(!grupo.length){document.getElementById("modal-ag-pag").innerHTML="";return;}
  const rep=grupo[0];
  const casaObj=DATA.casas[rep.casa]||(DATA.casas2&&DATA.casas2[rep.casa])||{};
  const telNum=(casaObj.telefone||"").replace(/\D/g,"");

  function montarMsg(fp){
    const lFP={dinheiro:"Dinheiro",cartao:"Cartao",pix:"Pix",naopagou:"Pendente"};
    const eFP={dinheiro:"D$",cartao:"CC",pix:"PIX",naopagou:"X"};
    let total=0;
    let msg="PLANET DOGS\n"+fmtD(rep.data)+"\nCasa "+rep.casa+" - "+rep.morador+"\n";
    if(rep.endereco)msg+=rep.endereco+"\n";
    msg+="\n";
    grupo.forEach(function(ev){
      var val=parseFloat(ev.valorCustom)||0;total+=val;
      msg+="- "+ev.pet+"\n  "+(ev.servico||"Banho")+(val>0?"  R$ "+val.toFixed(2):"")+"\n";
    });
    msg+="\nTotal: R$ "+total.toFixed(2)+"\n";
    if(fp==="naopagou")msg+="Pagamento pendente";
    else msg+=eFP[fp]+" Pagamento: "+lFP[fp];
    return encodeURIComponent(msg);
  }

  function lancarCobranca(pago){
    var mesNome=MESES[new Date(rep.data+"T12:00:00").getMonth()];
    var cbSrc=DATA.casas[rep.casa]?DATA.cobrancas:(DATA.cobrancas2||{});
    var cbMes=cbSrc[mesNome]||{};
    var cbCasa=cbMes[rep.casa]||{atendimentos:[]};
    var caes=grupo.map(function(ev){
      var val=parseFloat(ev.valorCustom)||0;
      var atsAnt=cbCasa.atendimentos||[];
      for(var i=atsAnt.length-1;i>=0;i--){
        var cao=(atsAnt[i].caes||[]).find(function(c){return c.nome===ev.pet;});
        if(cao){var c2=JSON.parse(JSON.stringify(cao));c2.servicos=[{nome:ev.servico||"Banho",valor:String(val)}];return c2;}
      }
      return{nome:ev.pet||"Pet",raca:"",servicos:[{nome:ev.servico||"Banho",valor:String(val)}]};
    });
    var novoAt={id:Date.now(),data:rep.data,caes:caes,pago:pago};
    var novosAts=(cbCasa.atendimentos||[]).concat([novoAt]).sort(function(a,b){return a.data.localeCompare(b.data);});
    var novaCb=Object.assign({},cbCasa,{atendimentos:novosAts});
    if(DATA.casas[rep.casa])saveCob(mesNome,rep.casa,novaCb);
    else saveCob2(mesNome,rep.casa,novaCb);
    var arrIds=ids.map(String);
    upd(function(d){return Object.assign({},d,{agenda:(d.agenda||[]).map(function(a){return arrIds.includes(String(a.id))?Object.assign({},a,{buscado:true}):a;})});});
  }

  var opcoes=[
    {k:"dinheiro",l:"Pagou em Dinheiro",e:"💵",bg:"#e8fbed",c:"#2DC653",bc:"#2DC653"},
    {k:"cartao",l:"Pagou no Cartao",e:"💳",bg:"#EFF6FF",c:"#3B82F6",bc:"#3B82F6"},
    {k:"pix",l:"Pagou via Pix",e:"📱",bg:"#F0FFF4",c:"#00B37E",bc:"#00B37E"},
    {k:"naopagou",l:"Nao Pagou",e:"❌",bg:"#fff0f0",c:"#e53e3e",bc:"#e53e3e"}
  ];

  var botoesHtml=opcoes.map(function(op,bi){
    return '<button class="btn" id="pagbtn'+bi+'" style="padding:14px 18px;background:'+op.bg+';border:2px solid '+op.bc+';border-radius:16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;">'
      +'<span style="font-size:28px;">'+op.e+'</span>'
      +'<div style="font-weight:800;color:'+op.c+';font-size:15px;">'+op.l+'</div>'
      +'</button>';
  }).join("");

  document.getElementById("modal-ag-pag").innerHTML=
    '<div class="modal-bg">'
    +'<div class="modal-box">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'
    +'<h3 style="font-family:\'Fredoka One\',sans-serif;font-size:20px;color:#FF6B9D;">Forma de Pagamento</h3>'
    +'<button class="btn" id="pagbtn-x" style="background:#f0f0f0;color:#1A1A2E;padding:8px 13px;border-radius:11px;">X</button>'
    +'</div>'
    +'<p style="font-size:13px;color:#8B8FA8;font-weight:700;margin-bottom:18px;">'+grupo.map(function(e){return e.pet||"Pet";}).join(" + ")+" - Casa "+rep.casa+'</p>'
    +'<div style="display:flex;flex-direction:column;gap:11px;">'+botoesHtml+'</div>'
    +'</div></div>';

  document.getElementById("pagbtn-x").onclick=function(){
    _agModalPag=null;document.getElementById("modal-ag-pag").innerHTML="";
  };
  opcoes.forEach(function(op,bi){
    document.getElementById("pagbtn"+bi).onclick=function(){
      var msg=montarMsg(op.k);
      lancarCobranca(op.k!=="naopagou");
      if(telNum)window.open("https://api.whatsapp.com/send?phone=55"+telNum+"&text="+msg,"_blank");
      else window.open("https://api.whatsapp.com/send?text="+msg,"_blank");
      _agModalPag=null;document.getElementById("modal-ag-pag").innerHTML="";
      renderAgenda(NAV.s==="agenda_gerente");
    };
  });
}

// modal A Buscar
function agAbrirBuscar(ids){
  const arr=ids.split(",");const agenda=DATA.agenda||[];
  const grupo=agenda.filter(a=>arr.includes(String(a.id)));if(!grupo.length)return;
  const rep=grupo[0];const end=rep.endereco||"";
  const gruposWA=DATA.gruposWA||{};
  const diaSem=getDiaSemana(rep.data);
  const linkGrupo=(gruposWA[diaSem]||"").trim();
  const pets=grupo.map(e=>e.pet||"Pet").join(", ");
  let msg=`ROTA PLANET DOGS\nData: ${fmtD(rep.data)}\nCasa ${rep.casa} - ${rep.morador}\nPets: ${pets}\nServico: ${rep.servico}\nResponsavel: ${rep.func}`;
  if(end){msg+=`\nEndereco: ${end}\nMaps: ${mapsUrl(end)}`;}
  const txt=encodeURIComponent(msg);
  if(linkGrupo.startsWith("https://")){
    window.open(linkGrupo,"_blank");
    setTimeout(()=>window.open("https://api.whatsapp.com/send?text="+txt,"_blank"),600);
  } else {
    window.open("https://api.whatsapp.com/send?text="+txt,"_blank");
  }
}

// ─── RENDER PRINCIPAL ─────────────────────────────────────────────────────────
function render(){
  const s=NAV.s;
  document.getElementById("topbar").style.display=s==="agenda_gerente"?"none":"flex";
  let html="";
  if(s==="home")html=renderHome();
  else if(s==="exportar")html=renderExportar();
  else if(s==="restaurar")html=renderRestaurar();
  else if(s==="colar")html=renderColar();
  else if(s==="cad1")html=renderMenuCad(1);
  else if(s==="cad2")html=renderMenuCad(2);
  else if(s==="cad1_meses")html=renderMeses(1);
  else if(s==="cad2_meses")html=renderMeses(2);
  else if(s==="cad1_grade")html=renderGrade(1,NAV.mes);
  else if(s==="cad2_grade")html=renderGrade(2,NAV.mes);
  else if(s==="cad1_det")html=renderDetalhe(1,NAV.mes,NAV.num);
  else if(s==="cad2_det")html=renderDetalhe(2,NAV.mes,NAV.num);
  else if(s==="cad1_fin")html=renderFinanceiro(1);
  else if(s==="cad2_fin")html=renderFinanceiro(2);
  else if(s==="fin_det")html=renderFinDet(NAV.cadNum,NAV.mes);
  else if(s==="cad1_casa")html=renderCadCasa(1);
  else if(s==="cad2_casa")html=renderCadCasa(2);
  else if(s==="saidas")html=renderSaidas();
  else if(s==="saidas_cat")html=renderSaidasCat(NAV.cat);
  else if(s==="vendas")html=renderVendas();
  else if(s==="farmacia")html=renderFarmacia();
  else if(s==="lab")html=renderLab();
  else if(s==="stats")html=renderRelatorio();
  else if(s==="agenda")html=renderAgenda(false);
  else if(s==="agenda_gerente")html=renderAgenda(true);
  document.getElementById("app").innerHTML=html;
  // pos-render: modal pag se ativo
  if(_agModalPag&&document.getElementById("modal-ag-pag")){
    renderModalPag(s==="agenda_gerente");
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
DATA=loadData();
render();
</script>
